carpetas:
  - ruta: "_procesado"
    papel: heredado_v2
    descripcion: material procesado por el proyecto anterior (transcripciones Whisper tiny, fotogramas
      por cambio de escena, informes). Solo indice de navegacion y control de calidad; nunca se cita.
  - ruta: "Material adicional de su operativa"
    papel: material_adicional
    descripcion: >-
      exportaciones de FXReplay (enero, abril y agosto 2026) y capturas de balance y de analiticas
      enviadas por el trader el 2026-09-03 y el 2026-09-05 (abril, 38 operaciones y 6 capturas de la
      pestana Analytics). Entrada de F07 (evidencia) y F26 (fidelidad).
      Subcarpeta "Backtest mayo 2026": entregado el 2026-09-11, el primero de los dos meses que el
      trader se comprometio a backtestear. JUNIO QUEDA DESCARTADO por decision del consultor el
      2026-09-12: la biblioteca de casos de F14 se construye SOLO con mayo. Lleva la exportacion
      de FXReplay del mes, 7 capturas de su pestana Analytics y 2 capturas de los mensajes de
      WhatsApp con los que lo entrego. CUIDADO: mayo esta particionado en dev y holdout-1/2/3
      (`knowledge/cases/kit/2026-09-09-sesion-01/particiones.yaml`) y 13 de sus 19 dias son
      holdout, asi que este material NO puede usarse para elegir ningun parametro: es entrada de
      F14 (biblioteca de casos) y F26 (fidelidad), con el regimen de holdout que les toque.
      Subcarpeta "Backtest Julio 2026" (entregada a Aleks y copiada aqui el 2026-10-13, rama
      `trabajo/entrada-julio`): el xlsx del mes, que segun Aleks cubre del 1 al 17 de julio; las
      cuatro grabaciones v11 a v14 (arriba); y seis capturas de RESUMEN del mes, estadistica del
      mes entero, que se tratan como Analytics y no se abren nunca (ADR-0038). Julio es material
      de DESARROLLO desde esa rama (decision del consultor del 2026-10-12).
      Subcarpeta "Mensajes del trader": capturas de respuestas suyas por escrito, fuera de sesion.
      Son sus palabras, no una sintesis del consultor, y por eso el registro de feedback que las
      recoge puede llevarlas como `respuesta_literal`. La primera cierra A-20 (una sola zona de
      control). El 2026-10-06 entran OCHO capturas mas (`mensaje-whatsapp-2026-10-06-*`), de la
      conversacion por WhatsApp de ese dia (hora de Lima) sobre A-42, el reloj de invierno: el
      texto de sus mensajes de las 09:53, 09:59, 13:44, 13:45, 13:46, 15:36 y 15:44, y dos graficos
      H4 suyos de las semanas del 27 de octubre y del 3 de noviembre de 2024 (ningun dia de 2026).
      Entrada de la activacion de A-42 (docs/validation/ACTIVACION-A42.md). CAUTELAS: el trader
      escribe desde dos numeros, los dos suyos, confirmado por Aleks el 2026-10-06; ningun nombre
      ni numero entra al repositorio. Los literales los transcribio el consultor de las capturas,
      porque la guardia de Claude Code no deja abrir ninguna imagen de esta carpeta (ADR-0038):
      la captura queda aqui con su hash para verificarlos. Los tres mensajes sobre el stop (13:46,
      la segunda frase de las 15:36 y la parte «2-c» de las 15:44) NO se registran contra A-11 ni
      contra ningun parametro y no se interpretan: son contexto para el punto U de la Next Action.
      El 2026-10-17 (rama trabajo/sesgo-h4-color, docs/validation/SESGO-H4-COLOR.md) entran SEIS
      ficheros mas de la conversacion por WhatsApp del 2026-10-14 (hora de Lima) sobre el cambio
      de sesgo de H4, la respuesta a la pregunta P1 de R3.1: cuatro capturas de mensajes del
      trader (`mensaje-whatsapp-2026-10-14-*`: 14:45 primera respuesta, 14:48 pide el grafico,
      14:55 la regla, 15:18 «Si, esta bien bro») y dos graficos `grafico-consultor-2026-10-14-*`
      que son ESQUEMAS dibujados por el consultor -el de dos casos con el que pregunto y el de
      cuatro casos que el trader confirmo a las 15:18-, no dias reales ni velas de ningun mes.
      Los literales los transcribio el consultor y los volvio a leer contra las capturas el
      2026-10-17; la sesion no abre ninguna (ADR-0038): cada captura queda con su hash para
      verificarlos. Ningun nombre ni numero del trader entra al repositorio. La captura de las
      14:55 trae ademas dos mensajes del trader que no se registran ni se interpretan (una risa a
      las 14:55 y, a las 14:56, una peticion de que le manden el planteamiento con un grafico), y
      arriba de la de las 15:18 se ve una nota de voz de 0:21 de las 14:56, que Aleks escucho el
      2026-10-17 y no anade nada a la regla: no se registra ni se interpreta. Entrada de los dos
      registros de feedback de esa fecha (CORRECT sobre RN-003 y CONFIRM sobre
      sesgo_h4_criterio_ruptura) y del ADR de esa rama.
      El 2026-10-25 (rama trabajo/sesion-05, docs/validation/SESION-05-EXTRACCION.md, «Para
      cerrar») entra UNA captura mas, `mensaje-whatsapp-2026-10-25-1358.png`: la confirmacion
      ESCRITA del trader de que el backtest de marzo es material que ya ha visto
      (docs/validation/REGISTRO-MARZO.md §2, paso 0), que mando por WhatsApp durante la llamada
      de la segunda parte de la sesion 5 (v16), al pedirsela Aleks en voz. Literal, transcrito por
      el consultor de la captura: «Confirmado backtest de marzo», mensaje del trader del
      2026-10-25 a las 13:58 (hora de Lima); solo nombra el mes, sin ninguna fecha ni ningun
      resultado. La sesion no la abre (ADR-0038): queda con su hash para verificar el literal. El
      mensaje siguiente de la captura (14:01) no se registra ni se interpreta. Ningun nombre ni
      numero del trader entra al repositorio. Aleks la guardo con doble extension (`.png.png`) y
      la renombro el 2026-10-25, antes del inventario.
      El 2026-11-25 (rama trabajo/contraste-trader, docs/validation/CONTRASTE-TRADER.md) entran
      ONCE ficheros mas: el contraste con el trader de ADR-0099 §6 y la peticion escrita de los
      meses del backtest con costes (ADR-0100 §2), y por primera vez AUDIOS. Cuatro capturas de
      WhatsApp (hora de Lima): `mensaje-whatsapp-2026-11-23-0126-cinco-preguntas.png`, las cinco
      preguntas de Aleks al trader del 2026-11-23 a la 01:26;
      `mensaje-whatsapp-2026-11-23-0956-operativa-real.png`, sus respuestas escritas de las
      09:56; y `mensaje-whatsapp-2026-11-24-1718-propuesta-backtest-costes.png` y
      `mensaje-whatsapp-2026-11-24-1719-meses-enero-julio-2024.png`, la peticion de los meses del
      2026-11-24, de las 17:18 a las 18:02. Y siete notas de voz del trader del 2026-11-23, de las
      09:59 a las 10:13 (`audio-whatsapp-2026-11-23-<HHMM>-<tema>.ogg`). Los literales de las
      capturas los transcribio el consultor, porque la sesion no abre ninguna (ADR-0038): cada una
      queda con su hash para verificarlos. Las notas de voz se transcribieron el 2026-11-23 con el
      ASR del corpus FUERA de cualquier rama; esa transcripcion no entra al repositorio, y ninguna
      frase de los audios entra como literal, porque nadie la ha comprobado escuchandola. No
      entran: un duplicado byte a byte de la nota de las 09:59:43; la nota de voz de 0:14 del
      trader del 2026-11-24 a las 18:01, que segun Aleks es una risa; ni ninguna captura de la
      configuracion de FX Replay. La captura de las 17:19 trae ademas mensajes que no se registran
      ni se interpretan. Ningun registro de feedback: las respuestas no tienen objetivo en el
      esquema (CONTRASTE-TRADER.md §6.8). CAUTELAS: ningun nombre ni numero del trader, ni el
      nombre del grupo ni los de sus miembros, entra al repositorio; las capturas no las abre la
      sesion (ADR-0038); en una de las notas de voz, segun su ASR sin comprobar, el trader habla de
      operaciones suyas en FundedNext compartidas en el grupo: no se piden ni se abren, y si llega un historial de una cuenta real o
      de fondeo, entra SIN ABRIR y un ADR fija antes quien lo lee (ADR-0099 §6, con ADR-0072 como
      precedente); y lo que se le mostro al trader durante el intercambio, una foto a la que, segun
      el mismo ASR sin comprobar, respondio con un numero de operaciones que coincide con el de la
      corrida (3), es parte de un chat suyo con otro asistente que Aleks no leyo: queda SIN DETERMINAR, como posible
      desviacion de ADR-0098 §3 C (HOLDOUT-EXPOSICIONES.md, 2026-11-25).

  - ruta: "Sesiones"
    papel: material_adicional
    descripcion: >-
      hojas de respuestas rellenadas durante las sesiones con el trader, una subcarpeta por sesion.
      La del 2026-09-09 lleva las respuestas sintetizadas por el consultor durante la sesion 1; la
      version literal esta en la grabacion v6. Entrada de F07 (evidencia) y F09 (feedback escrito).

