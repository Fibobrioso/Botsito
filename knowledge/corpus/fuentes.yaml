carpetas:
  - ruta: "_procesado"
    papel: heredado_v2
    descripcion: material procesado por el proyecto anterior (transcripciones Whisper tiny, fotogramas
      por cambio de escena, informes). Solo indice de navegacion y control de calidad; nunca se cita.
  - ruta: "Material adicional de su operativa"
    papel: material_adicional
    descripcion: >-
      exportaciones de FXReplay (enero, abril y agosto 2026) y capturas de balance y de analiticas
      enviadas por el trader el 2026-09-03 y el 2026-09-05 (abril, 38 operaciones y 6 capturas de la
      pestana Analytics). Entrada de F07 (evidencia) y F26 (fidelidad).
      Subcarpeta "Backtest mayo 2026": entregado el 2026-09-11, el primero de los dos meses que el
      trader se comprometio a backtestear (mayo y junio; junio NO ha llegado). Lleva la exportacion
      de FXReplay del mes, 7 capturas de su pestana Analytics y 2 capturas de los mensajes de
      WhatsApp con los que lo entrego. CUIDADO: mayo esta particionado en dev y holdout-1/2/3
      (`knowledge/cases/kit/2026-09-09-sesion-01/particiones.yaml`) y 13 de sus 19 dias son
      holdout, asi que este material NO puede usarse para elegir ningun parametro: es entrada de
      F14 (biblioteca de casos) y F26 (fidelidad), con el regimen de holdout que les toque.
      Subcarpeta "Mensajes del trader": capturas de respuestas suyas por escrito, fuera de sesion.
      Son sus palabras, no una sintesis del consultor, y por eso el registro de feedback que las
      recoge puede llevarlas como `respuesta_literal`. La primera cierra A-20 (una sola zona de
      control).

  - ruta: "Sesiones"
    papel: material_adicional
    descripcion: >-
      hojas de respuestas rellenadas durante las sesiones con el trader, una subcarpeta por sesion.
      La del 2026-09-09 lleva las respuestas sintetizadas por el consultor durante la sesion 1; la
      version literal esta en la grabacion v6. Entrada de F07 (evidencia) y F09 (feedback escrito).

