    acordado: >-
      regla del brief de la sesion 02 (2026-09-27): el filtro se aplica a la cruda antes de que nadie la lea y solo se lee la version filtrada; el informe lleva solo las marcas de tiempo (docs/validation/SESION-02-VIDEO.md)
