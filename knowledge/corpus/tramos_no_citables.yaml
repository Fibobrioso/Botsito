# Tramos de un video que NO son especificacion (F07). Manual, versionado; cada commit cita
# `Fuente:`. Una cita de evidencia que caiga dentro de uno de estos tramos se rechaza, tanto en
# `evidence propose --check` como en `evidence new`.
#
# No es censura: el tramo sigue en la cruda, sin tocar. Lo que impide es que entre en la cadena
# evidencia -> spec -> bot, que es donde el proyecto se juega decir que el trader dijo algo que no
# dijo, o que dijo para la operativa algo que dijo fuera de ella.
#
# Desde `stable/F36l-cuarentena-por-defecto` (docs/validation/CUARENTENA-POR-DEFECTO.md) tampoco
# se ENSENA por defecto: `kb find`, `kb at`, `corpus transcript show`, `corpus frames show` y
# `evidence propose` ocultan sus segmentos y dicen cuantos ocultaron y por que, y `kb` oculta
# tambien la evidencia cuya cita cae en un tramo o cuyo texto lo copia (y, por otro motivo, la que
# trae un dia de `casos_ocultos`). La opcion de la CLI que lo
# ensena todo es solo de Aleks, en su propia terminal: la guardia de Claude Code la bloquea. La
# lista la lee `botsito.corpus.cuarentena`, la unica fuente.
#
# Campos: video_id, t0, t1 (h:mm:ss del video), motivo (por que no cuenta), acordado (como consta).

tramos:
  - video_id: v6
    t0: "0:41:00"
    t1: "0:50:11"
    motivo: >-
      el trader avisa de que lo que va a explicar no forma parte de la operativa (es el tercer
      esquema de entrada, pendiente de backtest) y el consultor lo acepta en voz. Todo lo dicho
      entre esas dos marcas queda fuera de la especificacion aunque suene a regla.
    acordado: >-
      0:41:03 "o sea lo que voy a comentar de ahora en adelante no va para la operativa" /
      0:41:06 "lo que va de aqui en adelante hasta que lo mencione de nuevo no va para la
      operativa" / 0:50:11 "y ahora si, a partir de aqui, volvemos a la operativa"
