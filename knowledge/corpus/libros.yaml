# EL REGISTRO DE LIBROS (ADR-0039): como se lee cada backtest del trader, atado al sha de SUS
# BYTES. Ningun libro se lee sin su entrada: el lector (`corpus.libro`) verifica el sha y parsea
# cada fecha con las lecturas declaradas y con ninguna otra.
#
# SOLO ANADIR, como `knowledge/feedback/`: el sha fija los bytes, asi que el formato y el huso de un
# libro no cambian nunca. Una entrada commiteada NO se edita ni se borra (`knowledge validate` lo
# comprueba version a version contra el historial). Si una resulta estar mal, el libro deja de
# leerse hasta que un ADR decida; no se corrige encima.
#
# EL PROCEDIMIENTO PARA DECLARAR UN LIBRO NUEVO: medir el huso por velas -entrada dentro de
# [minima - 2, maxima + 2] puntos de la M1 de ese minuto, con UTC y con Europe/Madrid- sobre filas
# que se puedan leer, y con CONTROL sobre un libro de huso ya conocido. Decide si un huso da
# >= 90 % y el otro <= 50 %. Si no, NO CONCLUYENTE y no se declara.
#
# NO ESTAN enero ni septiembre, y es lo correcto: nadie ha medido todavia como se leen.
libros:
  "33a01f1d81246417548663ec43752f3eb952b983175016ca3318044d5b090f45":
    fichero: "Material adicional de su operativa/backtesting-analytics AGOSTO 2026.xlsx"
    lecturas:
      - formato: "AAAA/MM/DD HH:MM:SS"
        huso: UTC
    medida: >-
      Sesiones: leidas en UTC y llevadas a huso_operativa, las 47 filas caen en las dos sesiones H4
      declaradas; leidas como hora de Madrid, 16 quedarian fuera (F14A-INGESTA §4, 2026-09-21).
      Velas, 2026-09-22 (MAYO-DEV): entrada dentro de la M1 +-2 puntos, UTC 47 de 47 (100 %),
      Europe/Madrid 1 de 47 (2 %).
    declarado_el: "2026-09-22"
    fuente: [ADR-0037, ADR-0039]
