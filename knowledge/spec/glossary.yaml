# Glosario de la operativa (F11, ADR-0013). Los terminos del trader, definidos una vez y usados
# por `strategy_spec.yaml`. Manual, versionado; cada commit cita `Fuente:`.
#
# Reglas del fichero, aprendidas de la auditoria del 2026-09-09, que encontro ocho definiciones
# que decian mas que su cita o citaban otra cosa:
#
# 1. Aqui se define QUE es cada cosa, no que se hace con ella: lo segundo son reglas, y ademas
#    meteria numeros de negocio en un sitio que no es el registro (ADR-0002).
# 2. `literal` es la frase EXACTA que sostiene la definicion, y `knowledge validate` comprueba
#    que aparece en lo que `cita` dice, con el mismo criterio de tokens que las reglas.
# 3. La definicion no puede afirmar mas de lo que su literal sostiene. Si hace falta decir mas,
#    se cita otra cosa o se dice menos.

terminos:
  - termino: flujo de ordenes
    alias: [order flow, mapeo]
    definicion: >-
      una de las tres piezas del modelo, junto al breaker y al marco de liquidez; el trader lo usa
      como sinonimo de mapear el mercado
    cita: ev-v3-000030-94d71563
    literal: Un flujo de órdenes, o sea, mapeo del mercado, breaker y marco de liquidez
    visto_en: v3 0:00:30

  - termino: breaker
    alias: [BOS, bos]
    definicion: >-
      la ruptura que marca el bloque de origen en M1. Es lo que el trader usa para fijar la orden
      limite, y no usa el CHoCH
    cita: ev-v3-011653-38c712f3
    literal: >-
      breaker que define cómo se marca el bloque de origen es eso. No uso lo que sería el
      shot como giro como tal
    visto_en: v3 1:16:53

  - termino: primer esquema de entrada
    alias: [esquema 1]
    definicion: >-
      el precio rompe directamente, sin retroceso: con el breaker basta para marcar la orden
      limite
    cita: ev-v3-004201-bfeb3734
    literal: >-
      Yo no espero ningún retroceso, si se han dado cuenta. Con el breaker ya me basta [...]
      apenas el breaker, o sea, marco mi orden limit y ya está
    visto_en: v3 0:42:01

  - termino: segundo esquema de entrada
    alias: [esquema 2]
    definicion: >-
      el precio hace un pequeno retroceso que deja una zona de control, y despues rompe
    cita: ev-v4-000243-5f8875ce
    literal: >-
      si hace el otro esquema pues con un pequeño retroceso pequeña zona de control y luego rompe
    visto_en: v4 0:02:43

  - termino: zona de control
    definicion: >-
      el tramo que el precio deja antes de romper. Se da por COMPLETADA cuando rompe el punto
      extremo anterior, y basta con que lo rompa con mecha
    cita: fb-2026-09-09-sesion-01-a456bc3f
    literal: >-
      como sé que una zona de control se ha completado, cuando apenas me generó un rompimiento
      [...] rompe el punto alto anterior con mecha, con mecha no importa
    visto_en: v6 1:25:36

  - termino: estructura
    alias: ["dos velas como una"]
    definicion: >-
      como el trader llama a lo que antes describia como "dos velas como una"; el termino lo
      corrigio el mismo en la sesion 1
    cita: fb-2026-09-09-sesion-01-7ee9cabc
    literal: sería considerado una estructura [...] en el lenguaje del bot sería considerado una estructura
    visto_en: v6 1:38:48

  - termino: equal
    alias: [equal high, equal low, igual]
    definicion: >-
      dos extremos al mismo precio. No cambia el sesgo: para cambiarlo hace falta romper el
      extremo anterior, aunque sea por una milesima
    cita: fb-2026-09-09-sesion-01-8eccf5c0
    literal: >-
      si no genera un rompimiento por encima, o sea, al menos por un pip o una milésima de pip,
      entonces seguiríamos operando bajista
    visto_en: v6 1:03:01

  - termino: cartucho
    alias: [intento]
    definicion: >-
      cada operacion que gasta el cupo. Ni el break even, ni una entrada invalidada, ni la
      reentrada tras un equal cuentan como uno
    cita: fb-2026-09-09-sesion-01-aa2abe65
    literal: >-
      un intento no es considerado un break even, ¿vale? una entrada invalidada pues tampoco es
      considerado un intento [...] reentrada después de equal, tampoco es considerado un intento
    visto_en: v6 0:52:19

  - termino: caja
    alias: [cuadro de Gann, caja de niveles]
    definicion: >-
      la distancia entre la entrada y el extremo del stop inicial, dividida en niveles. Es la
      unidad en la que se miden el objetivo y la proteccion. Dos cosas que esta definicion afirmo
      hasta el 2026-09-11 y que hoy son falsas: el lote NO se dimensiona sobre la caja entera sino
      sobre la distancia hasta stop_fraccion_caja (ADR-0020), y el stop NO se mueve despues, sino
      que se escribe en la orden limite antes de que la entrada se active (A-11, RN-011)
    cita: ev-v2-003336-fc210a05
    literal: >-
      yo calculo mi lotaje desde aquí, o sea, como si fuera lo básico un bot normal, pero luego
      automáticamente, se de inicio la entrada
    visto_en: v2 0:33:36

  - termino: liquidez de M15
    alias: [LQ M15]
    definicion: >-
      el alto o el bajo de M15 que el precio busca. Se da por tomada solo si una vela cierra con
      CUERPO al otro lado; una mecha que lo perfore no cuenta
    cita: fb-2026-09-09-sesion-01-6e15504f
    literal: >-
      ¿Vale con que la vela cierre con el cuerpo por encima del máximo, por debajo del mínimo, o
      vale con que la mecha lo perfore? Con cuerpo
    visto_en: v6 1:49:21
