# Registro de parametros de negocio: LA UNICA PUERTA (F02, ADR-0002).
#
# Sin valores de ESTRATEGIA a proposito: llegan en F11 citando evidencia o feedback. Los
# parametros de entorno (categoria distinta de estrategia) entran citando un ADR (ADR-0004).
# Ningun numero de negocio (0,75, 1:3, 07:00, 3 cartuchos...) puede vivir fuera de este fichero;
# tests/contract/test_no_business_literals.py lo comprueba.
#
# Esquema de cada entrada:
#   nombre:        identificador en snake_case (p. ej. stop_fraccion_caja)
#   categoria:     estrategia | instrumento | broker | prop_firm | ejecucion (ADR-0004).
#                  Solo `estrategia` se cita por evidence/feedback y se le pregunta al trader;
#                  las demas se citan por decision (ADR-NNNN) y se verifican en el pre-vuelo.
#   tipo:          fraccion | porcentaje | decimal | entero | hora | texto |
#                  enum | booleano | puntos | minutos | lotes (F11)
#   opciones:      obligatorio y exclusivo de `enum`: los valores que admite (>= 2)
#   huso:          obligatorio si tipo es hora: nombre IANA (Europe/Madrid, UTC, ...)
#   unidad:        texto libre pero obligatorio (p. ej. "fraccion de la distancia completa")
#   descripcion:   una frase
#   estado:        CONFIRMED | DEFAULT_AMBIGUOUS | UNKNOWN
#   valor:         entre comillas para fraccion/porcentaje/decimal/hora/texto ("0.75", "07:00");
#                  entero SIN comillas (3); ausente si UNKNOWN
#   fuente:        {tipo: evidence|feedback|decision, id: ...}; obligatoria salvo UNKNOWN;
#                  id con formato ev-…, fb-… o ADR-NNNN
#   ambiguedad_id: solo si DEFAULT_AMBIGUOUS (p. ej. A-1)
#   minimo/maximo: opcionales, entre comillas o entero; SOLO para fraccion/porcentaje/decimal/
#                  entero (en hora o texto se rechazan). No se admiten claves de nivel superior
#                  distintas de `parametros`.
#
# Ejemplo (NO es un valor real; los reales se anaden en F11):
#   - nombre: ejemplo_stop_fraccion
#     categoria: estrategia
#     tipo: fraccion
#     unidad: fraccion de la distancia completa nivel 0 -> nivel 1
#     descripcion: donde va el stop dentro de la caja
#     estado: CONFIRMED
#     valor: "0.75"
#     fuente: {tipo: evidence, id: ev-v4-001230-1a2b3c4d}
#     minimo: "0"
#     maximo: "1"
#   - nombre: ejemplo_inicio_ventana
#     categoria: estrategia
#     tipo: hora
#     huso: Europe/Madrid
#     unidad: hora de reloj del trader
#     descripcion: inicio de la ventana operativa
#     estado: UNKNOWN

parametros:
  # F15 (ADR-0005): el reloj del trader es un hecho del entorno; el anclaje de la vela H4 es de
  # estrategia y sigue abierto (A-9: hora Y huso del grafico) hasta que el trader lo resuelva.
  # El huso de los datos no es un parametro: lo declara cada manifiesto de dataset (UTC).
  # --- entorno: ficha del instrumento, reloj del broker y modelo de llenado (F11, ADR-0012).
  # Medidos contra la cuenta demo real de FundedNext (34891752, FundedNext-Server 3) el
  # 2026-09-05; el pre-vuelo de F33 los comprueba contra SymbolInfo*/AccountInfo* y aborta si
  # el broker dice otra cosa. No se preguntan al trader: son del entorno (ADR-0004).
  - nombre: instrumento_digitos
    categoria: instrumento
    tipo: entero
    unidad: decimales de la cotizacion
    descripcion: digits del simbolo; con 5 un punto es 0,00001 y un pip son 10 puntos
    estado: CONFIRMED
    valor: 5
    minimo: 0
    maximo: 8
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: instrumento_contrato
    categoria: instrumento
    tipo: decimal
    unidad: unidades de la divisa base por lote
    descripcion: tamano del contrato; con el se convierte el riesgo en lotes
    estado: CONFIRMED
    valor: "100000"
    minimo: "1"
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: instrumento_lote_minimo
    categoria: instrumento
    tipo: lotes
    unidad: lotes
    descripcion: lote minimo que admite el broker; por debajo, la operacion se rechaza
    estado: CONFIRMED
    valor: "0.01"
    minimo: "0"
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: instrumento_lote_paso
    categoria: instrumento
    tipo: lotes
    unidad: lotes
    descripcion: escalon del lote; el lotaje calculado se redondea a un multiplo de este paso
    estado: CONFIRMED
    valor: "0.01"
    minimo: "0"
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: instrumento_stops_level
    categoria: instrumento
    tipo: puntos
    unidad: puntos de distancia minima a mercado
    descripcion: >-
      distancia minima a la que el broker admite un stop o un limite. Si la spec pide uno mas
      cerca, la respuesta es ABSTENERSE, nunca aproximar (MASTER_PLAN H.2)
    estado: CONFIRMED
    valor: 0
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: broker_offset_base
    categoria: broker
    tipo: minutos
    unidad: minutos que el reloj del servidor va por delante de UTC en horario estandar
    descripcion: >-
      desfase base del reloj del servidor (GMT+2 en invierno, GMT+3 en verano de Nueva York);
      medido en el terminal, no supuesto
    estado: CONFIRMED
    valor: 120
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: broker_dst
    categoria: broker
    tipo: enum
    unidad: que calendario de cambio de hora sigue el servidor
    opciones: [us, eu, ninguno]
    descripcion: >-
      con que calendario cambia la hora el servidor. FundedNext sigue el de Nueva York, asi que
      en verano el reloj va a GMT+3 y el dia de riesgo se desplaza. Este reloj y huso_grafico son
      DOS RELOJES DISTINTOS: este es el del servidor donde se ejecuta, aquel el de la pantalla
      donde el trader decide. Coinciden en invierno y divergen una hora en verano, asi que las
      horas de la operativa se interpretan SIEMPRE en huso_grafico y se convierten al ejecutar
    estado: CONFIRMED
    valor: "us"
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: modelo_llenado
    categoria: ejecucion
    tipo: enum
    unidad: como se decide que una orden limite se ha llenado
    opciones: [al_tocar, cruce_mas_latencia]
    descripcion: >-
      criterio de llenado en el motor de referencia. `al_tocar` es optimista y `cruce_mas_latencia`
      exige que el precio cruce y pase `latencia_ms`; F27 mide las dos y la diferencia entre ellas
      es una cota de cuanto depende el resultado del modelo, no de la estrategia
    estado: CONFIRMED
    valor: "al_tocar"
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: latencia_ms
    categoria: ejecucion
    tipo: minutos
    unidad: milisegundos de latencia supuesta entre senal y orden
    descripcion: latencia que asume `cruce_mas_latencia`; con `al_tocar` no se usa
    estado: CONFIRMED
    valor: 0
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: huso_operativa
    categoria: ejecucion
    tipo: texto
    unidad: nombre IANA del huso en el que se expresan las horas de la operativa
    descripcion: >-
      reloj del TRADER como persona: la hora a la que se sienta y a la que cierra, y de la que
      cuelgan ventana_inicio y ventana_fin. Es su reloj civil y por tanto cambia con el horario
      de verano. ADR-0005 lo fijo en Europe/Madrid, ADR-0012 lo cambio a un offset fijo apoyandose
      en que "la sesion desmintio Madrid" -que no ocurrio, ver ADR-0015- y ADR-0017 lo revierte:
      el trader opera siempre a la misma hora SUYA, sea cual sea la fecha
    estado: CONFIRMED
    valor: "Europe/Madrid"
    fuente:
      tipo: decision
      id: ADR-0017
  - nombre: huso_grafico
    categoria: estrategia
    tipo: texto
    unidad: nombre IANA del huso configurado en el grafico del trader
    descripcion: >-
      como se ETIQUETAN las horas en la pantalla del trader. No hay configuracion deliberada de
      huso: su plataforma muestra su hora local, que es la misma de huso_operativa. Sirve para
      traducir lo que el dice -"la vela empieza a las 23"- a un instante: 23:00 Madrid son las
      21:00 UTC en verano y las 22:00 en invierno. NINGUNA regla cuelga de este parametro; las
      horas de la operativa cuelgan de huso_operativa y la rejilla H4 de anclaje_h4. Y NO es el
      reloj del servidor, que va en broker_offset_base + broker_dst y sigue a Nueva York
    estado: CONFIRMED
    valor: "Europe/Madrid"
    fuente:
      tipo: evidence
      id: ev-v3-000136-6160fcea
  - nombre: anclaje_h4
    categoria: estrategia
    tipo: hora
    huso: America/New_York
    unidad: hora de reloj de pared en el huso declarado; parte la recta UTC en velas H4
    descripcion: >-
      donde empieza la rejilla H4. Es la medianoche del servidor, que por convencion de los
      brokers se escribe 17:00 America/New_York (ADR-0005) y que sigue el calendario de Nueva
      York, como confirma broker_dst medido contra la demo. El trader lo ve como las 23:00 en su
      pantalla, y es cierto 337 dias al año; los otros 28 -8 a 28 de marzo y 25 a 31 de octubre,
      cuando la UE y EE.UU. no cambian la hora el mismo dia- lo ve a las 22:00. Escrito como una
      hora de un huso FIJO, el ancla caia una hora antes todo el invierno y repartia mal todas
      las velas H4, que es de donde sale el sesgo (ADR-0017)
    estado: CONFIRMED
    valor: "17:00"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-479e68b9

  # F10 (ADR-0011): todos los parametros de estrategia que la evidencia nombra, pre-poblados en
  # UNKNOWN sin valor. Se cerraron en F11 con un registro de feedback de la sesion 1 (o evidencia
  # que baste). El enlace parametro -> evidencia/ambiguedad esta en knowledge/cases/kit/
  # mapa_parametros.yaml (el esquema del registro no admite claves extra).
  - nombre: ventana_inicio
    categoria: estrategia
    tipo: hora
    huso: Europe/Madrid
    unidad: hora de reloj de pared del trader (huso_operativa)
    descripcion: >-
      hora a la que el trader empieza a buscar entradas. Es SU horario como persona y no se mueve
      con la fecha, asi que en UTC si se mueve con el cambio de hora (ADR-0017)
    estado: CONFIRMED
    valor: "07:00"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-8741c388
  - nombre: ventana_fin
    categoria: estrategia
    tipo: hora
    huso: Europe/Madrid
    unidad: hora de reloj de pared del trader (huso_operativa)
    descripcion: >-
      hora a la que el trader deja de operar y cierra lo que quede abierto. Es SU horario como
      persona, igual que ventana_inicio (A-6, ADR-0017)
    estado: CONFIRMED
    valor: "15:00"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-951b7a79
  - nombre: cierre_forzoso_fin_ventana
    categoria: estrategia
    tipo: enum
    unidad: si/no
    opciones: ["si", "no"]
    descripcion: si un trade abierto se cierra en punto al terminar la ventana (A-6)
    estado: CONFIRMED
    valor: "si"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-ffb528d7
  - nombre: sesgo_h4_regla
    categoria: estrategia
    tipo: enum
    unidad: opcion cerrada (mapa_parametros.yaml)
    opciones: ["vela_anterior_color", "vela_anterior_cierre_mecha", "otra"]
    descripcion: que vela H4 fija el sesgo y cuando cambia (A-1)
    estado: CONFIRMED
    valor: "vela_anterior_cierre_mecha"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-8eccf5c0
  - nombre: sesgo_h4_criterio_ruptura
    categoria: estrategia
    tipo: enum
    unidad: que hace falta para dar por rota la vela H4 previa
    opciones: ["mecha", "cuerpo"]
    descripcion: >-
      criterio de ruptura del extremo de la H4 anterior, del que depende el sesgo. Vivia dentro
      del nombre del enum `sesgo_h4_regla` (`vela_anterior_cierre_mecha`), que mezclaba sujeto y
      criterio; la forma ejecutable de F12 lo separa porque el criterio es un ARGUMENTO del
      predicado `rompe`, y escribirlo a pelo seria un valor de negocio en un campo ejecutable
    estado: CONFIRMED
    valor: "mecha"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-8eccf5c0
  - nombre: zona_control_criterio_completada
    categoria: estrategia
    tipo: enum
    unidad: que hace falta para dar una zona de control por completada
    opciones: ["mecha", "cuerpo"]
    descripcion: >-
      criterio de ruptura del punto extremo anterior que completa una zona de control. El trader
      lo dice con todas las letras -"con mecha no importa"- y hasta ahora vivia solo en la
      definicion del glosario
    estado: CONFIRMED
    valor: "mecha"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-a456bc3f
  - nombre: break_even_criterio_ruptura
    categoria: estrategia
    tipo: enum
    unidad: que hace falta para dar por rota la zona que dispara el break even
    opciones: ["mecha", "cuerpo"]
    descripcion: >-
      criterio de ruptura de la zona de control POSTERIOR a la entrada, que es la que dispara el
      break even. Es exactamente lo que pregunta A-13, y sigue ABIERTA: el trader se desdice a los
      doce minutos. Entra `mecha` por coherencia con los otros dos criterios, pero es un DEFAULT
      NUESTRO. No confundir con break_even_condicion, que dice si el stop se mueve al TOCAR el
      nivel o al cierre de la vela: son dos preguntas distintas que la prosa mantenia juntas
    estado: DEFAULT_AMBIGUOUS
    valor: "mecha"
    ambiguedad_id: A-13
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-0ccafcba
  - nombre: liquidez_m15_criterio_toma
    categoria: estrategia
    tipo: enum
    unidad: cuerpo/mecha
    opciones: ["cuerpo", "mecha"]
    descripcion: si la liquidez de M15 se toma con cierre de cuerpo o basta la mecha
    estado: CONFIRMED
    valor: "cuerpo"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-6e15504f
  - nombre: stop_fraccion_caja
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa nivel 0 -> nivel 1
    descripcion: nivel de la caja donde va el stop tras la entrada (0,75 u 0,8; A-10)
    estado: CONFIRMED
    valor: "0.8"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-d34a0222
    minimo: "0"
    maximo: "1"
  - nombre: stop_reduccion_fraccion
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa
    descripcion: nivel al que se reduce el stop cuando la vela avanza (A-12)
    estado: UNKNOWN
    minimo: "0"
    maximo: "1"
  - nombre: stop_reduccion_umbral_vela
    categoria: estrategia
    tipo: porcentaje
    unidad: porcentaje de la vela transcurrido
    descripcion: parte de la vela a partir de la cual se baja el stop (40 o 50; A-12)
    estado: UNKNOWN
    minimo: "0"
    maximo: "100"
  - nombre: stop_segundo_esquema
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa
    descripcion: >-
      UNKNOWN A PROPOSITO desde la auditoria del 2026-09-10 (A-7 sigue resuelta): no hay un stop
      del segundo esquema distinto del primero. El trader dijo que es el MISMO en los dos, asi
      que un parametro aparte con el mismo valor son dos puertas para el mismo numero -lo que
      RN-012 prohibe expresamente para stop_proteccion_capital y ADR-0002 para todo-. Hay un
      unico esquema de stop y vive en stop_fraccion_caja. Leerlo falla, que es lo que debe pasar
    estado: UNKNOWN
    minimo: "0"
    maximo: "1"
  - nombre: stop_en_orden_pendiente
    categoria: estrategia
    tipo: enum
    unidad: en_la_orden/tras_el_llenado
    opciones: ["en_la_orden", "tras_el_llenado"]
    descripcion: >-
      si el SL viaja en la orden pendiente o se pone tras el llenado (A-11). RESPONDIDO por el
      trader el 2026-09-10: "el SL se pone junto a la orden limite, no cuando se apertura recien".
      Deja de ser la inferencia que el barrido de fidelidad habia marcado. Consecuencia para el
      motor: la orden pendiente NACE con su stop, asi que no hay evento "mover el stop tras el
      llenado" que implementar, y RN-026 tiene que comprobar instrumento_stops_level en el momento
      de COLOCAR, no despues
    estado: CONFIRMED
    valor: en_la_orden
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-76fd91ba
  - nombre: break_even_condicion
    categoria: estrategia
    tipo: enum
    unidad: tocar/cierre
    opciones: ["tocar", "cierre"]
    descripcion: si el break even se pone al tocar el nivel o al cierre de la vela (A-4)
    estado: CONFIRMED
    valor: "tocar"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-0ccafcba
  - nombre: objetivo_rr
    categoria: estrategia
    tipo: decimal
    unidad: multiplo de la distancia que declara base_calculo_objetivo
    descripcion: >-
      objetivo fijo, en multiplos de la distancia que fija base_calculo_objetivo. "Riesgo" a
      secas seria ambiguo: hay dos distancias y no son la misma (ADR-0014). Desde ADR-0020 la
      diferencia es mayor, porque el lote ya no se dimensiona sobre la caja entera sino hasta
      stop_fraccion_caja, que es donde acaba el stop. El objetivo
      es FIJO, no minimo: la sesion 1 cerro la extension en objetivo_extension_activa: false
    estado: CONFIRMED
    valor: "3"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-7fbbb2e7
    minimo: "1"
    maximo: "10"
  - nombre: objetivo_extension_activa
    categoria: estrategia
    tipo: booleano
    unidad: se aplica o no
    descripcion: si el objetivo se extiende mas alla del 1:3 (el trader dice que no se extiende)
    estado: CONFIRMED
    valor: false
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-9c259e06
  - nombre: objetivo_extension
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia hasta la liquidez de M15
    descripcion: hasta donde se extiende el objetivo; solo si objetivo_extension_activa
    estado: UNKNOWN
    minimo: "0"
    maximo: "1"
  - nombre: zonas_control_max_por_esquema
    categoria: estrategia
    tipo: entero
    unidad: zonas de control admitidas dentro de un mismo esquema
    descripcion: >-
      cuantas zonas de control puede desarrollar un esquema sin invalidarlo. Vivia en la prosa de
      RN-009 -"se desarrolla mas de una zona de control"- y por tanto fuera de la unica puerta
      (ADR-0002). OJO: el literal dice "por lo general solo buscamos uno", que no es una
      prohibicion dura; se escribe 1 porque es lo que la regla afirma, y A-20 lo deja a la vista
    estado: DEFAULT_AMBIGUOUS
    valor: 1
    ambiguedad_id: A-20
    fuente:
      tipo: evidence
      id: ev-v4-001909-54ac2edd
    minimo: "1"
    maximo: "5"
  - nombre: operaciones_simultaneas_max
    categoria: estrategia
    tipo: entero
    unidad: operaciones abiertas a la vez
    descripcion: >-
      cuantas operaciones puede tener abiertas el bot a la vez. Vivia en la prosa de RN-018 -"hay
      una operacion abierta", "no se abre otra"- y por tanto fuera del registro
    estado: CONFIRMED
    valor: 1
    fuente:
      tipo: evidence
      id: ev-v4-003710-c753f3d3
    minimo: "1"
    maximo: "10"
  - nombre: cartuchos_max
    categoria: estrategia
    tipo: entero
    unidad: intentos por zona de liquidez
    descripcion: numero maximo de intentos por barrido de liquidez (2 o 3; A-2)
    estado: CONFIRMED
    valor: 3
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-1a3064b0
    minimo: 1
    maximo: 10
  - nombre: reentrada_tras_equal
    categoria: estrategia
    tipo: enum
    unidad: si/no
    opciones: ["si", "no"]
    descripcion: si tras un equal (activacion sin rotura) se reentra al romper de nuevo
    estado: CONFIRMED
    valor: "si"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-060cd801
  - nombre: reubicacion_cadencia
    categoria: estrategia
    tipo: enum
    unidad: opcion cerrada (mapa_parametros.yaml)
    opciones: ["cada_vela", "al_romper", "otra"]
    descripcion: cada cuanto se reubica la orden limite mientras no se activa (A-5)
    estado: CONFIRMED
    valor: "al_romper"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-6b29059d
  - nombre: salida_sin_ruptura
    categoria: estrategia
    tipo: enum
    unidad: cerrar_al_cierre/proteger_y_dejar
    opciones: ["cerrar_al_cierre", "proteger_y_dejar"]
    descripcion: que se hace si la orden se activa sin ruptura (A-3)
    estado: CONFIRMED
    valor: "proteger_y_dejar"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-9626d3dd
  - nombre: mapeo_dos_velas
    categoria: estrategia
    tipo: enum
    unidad: opcion cerrada (mapa_parametros.yaml)
    opciones: ["order_block_mayor", "otra"]
    descripcion: cuando dos velas de M1 cuentan como una estructura al mapear (A-8)
    estado: CONFIRMED
    valor: "order_block_mayor"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-7ee9cabc
  - nombre: parciales
    categoria: estrategia
    tipo: enum
    unidad: si/no
