      lo que hace el BOT desde el 2026-09-14: la cuenta elegida es FTMO 2-Step Swing, que no tiene
      restricciones de noticias (ADR-0026, firma_noticias_restringe). Del 2026-09-12 al 2026-09-14
      corrio con `regla` por ADR-0022, que suponia una cuenta fondeada con prohibicion; ese
