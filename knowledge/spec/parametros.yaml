  - nombre: base_calculo_objetivo
    categoria: estrategia
    tipo: enum
    unidad: sobre que distancia se multiplica objetivo_rr
    opciones: ["caja_completa", "riesgo_real"]
    descripcion: >-
      distancia sobre la que se mide el objetivo. `caja_completa` es la distancia nivel 0 ->
      nivel 1; `riesgo_real` seria la distancia hasta stop_fraccion_caja. Hasta el 2026-09-11
      esta descripcion anadia que la caja completa es "la misma que dimensiona el lote": desde
      ADR-0020 ya NO lo es, el lote se dimensiona hasta stop_fraccion_caja y solo el objetivo
      se mide sobre la caja entera. El RR realizado no es 1:3 sino objetivo_rr / stop_fraccion_caja,
      y es a proposito (RN-012). OJO (2026-09-16): esta descripcion justificaba el valor con que "el
      objetivo se traza CON la orden, antes de que el stop se mueva, asi que la unica distancia que
      existe en ese instante es la caja completa". Esa premisa esta revocada -el stop no se mueve,
      viaja en la orden desde el principio (A-11)-, asi que el argumento ya no discrimina. El valor
      NO se cambia: la decision queda para el consultor (A-18, nota en ADR-0014 y en RN-015).
      CONFIRMADO POR EL TRADER el 2026-09-29 (sesion 3, v9 1:02:32; fb-2026-09-29-sesion-03-f572f1a0,
      ev-v9-010232-4b049a1e): el objetivo se traza «desde el punto 0 al punto 1», y es «1, 3». Es
      la caja completa, y el valor no cambia. Hasta el 2026-09-30 la fuente era ev-v2-003256-0197f4e1
    estado: CONFIRMED
    valor: "caja_completa"
    fuente:
      tipo: feedback
      id: fb-2026-09-29-sesion-03-f572f1a0
  - nombre: instrumento
    categoria: estrategia
    tipo: texto
    unidad: simbolo del instrumento
    descripcion: >-
      instrumento sobre el que opera la primera version. Sale de la evidencia, no de una respuesta:
      es el unico instrumento de todo el corpus grabado y se lee en pantalla. Por donde ampliar
      -NASDAQ, oro, pares sin gaps, futuros- lo dijo el trader y vive en fb-2026-09-09-sesion-01-6eceb844
    estado: CONFIRMED
    valor: "EURUSD"
    # MASTER_PLAN H.2: la ficha del simbolo la consumen el motor, la exportacion, el EA y el pre-vuelo
    consumido_por: [F24, F28, F31, F33]
    fuente:
      tipo: evidence
      id: ev-v2-003320-a736fd37
  - nombre: cuenta_objetivo
    categoria: prop_firm
    tipo: enum
    unidad: tipo de cuenta
    opciones: [fondeada, demo, propia]
    descripcion: >-
      cuenta a la que apunta el bot cuando este validado: la FTMO Account que sale del reto
      2-Step (ADR-0026). QUE firma, programa y tipo de cuenta lo dicen firma, firma_programa y
      firma_tipo_cuenta
    estado: CONFIRMED
    valor: "fondeada"
    # la cuenta a la que se despliega; F33 la lee en el pre-vuelo
    consumido_por: [F33]
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: cuenta_pruebas
    categoria: prop_firm
    tipo: enum
    unidad: tipo de cuenta
    opciones: [fondeada, demo, propia]
    descripcion: >-
      cuenta en la que se prueba el funcionamiento antes de la fondeada: la prueba gratuita de FTMO
      (ADR-0026), donde se miden A-27 y A-28. La demo de FundedNext del 2026-09-05 ya no cuenta
    estado: CONFIRMED
    valor: "demo"
    # F17 mide el reloj del servidor contra este terminal y F33 despliega primero aqui
    consumido_por: [F17, F33]
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: saldo_inicial_cuenta
    categoria: prop_firm
    tipo: decimal
    unidad: USD
    descripcion: >-
      saldo con el que arranca la cuenta: el capital simulado inicial de la cuenta FTMO de 100.000
      (ADR-0026). NO es base de ningun calculo DEL TRADER: el lotaje va sobre base_calculo_riesgo
      (saldo_actual), el tope diario sobre base_calculo_perdida_diaria (saldo_inicial_dia) y el
      semanal sobre base_calculo_perdida_semanal (saldo_actual). SI es la base de los dos topes DE
      LA FIRMA: firma_perdida_diaria_max y firma_perdida_total_max son porcentajes de este capital
      (RN-029)
    estado: CONFIRMED
    valor: "100000"
    minimo: "0"
    # RN-029 lo nombra; F24 arranca el backtest con el y F33 lo compara con la cuenta real
    consumido_por: [F24, F33]
    fuente:
      tipo: decision
      id: ADR-0026

  # --- la prop firm (ADR-0026, 2026-09-14). Los topes de la firma son OTRO objeto que los del
  # trader (perdida_maxima_diaria, perdida_maxima_semanal): el motor respeta siempre el mas
  # restrictivo, y eso es una regla -RN-029-, no un parametro. Fuentes del reglamento, leidas el
  # 2026-09-14, en el propio ADR.
  - nombre: firma
    categoria: prop_firm
    tipo: enum
    unidad: prop firm de destino
    opciones: [ftmo, fundednext]
    descripcion: >-
      la firma de la cuenta fondeada. FundedNext se descarta porque no admite bots en cuentas de
      50.000 o mas, ni en el reto ni en la cuenta fondeada
    estado: CONFIRMED
    valor: ftmo
    # el pre-vuelo contrasta la cuenta real con la firma declarada
    consumido_por: [F33]
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_programa
    categoria: prop_firm
    tipo: texto
    unidad: programa del reto
    descripcion: >-
      programa del reto: reto, verificacion y cuenta fondeada, con la perdida maxima ESTATICA. El
      programa de una fase se descarta porque su perdida maxima arrastra y lleva regla del mejor dia
    estado: CONFIRMED
    valor: "2-step"
    consumido_por: [F33]
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_tipo_cuenta
    categoria: prop_firm
    tipo: enum
    unidad: tipo de cuenta elegido en la compra
    opciones: [standard, swing]
    descripcion: >-
      tipo de cuenta. Se elige EN LA COMPRA y no se puede cambiar despues ("Change from Standard to
      Swing: Not allowed"). `swing` no restringe las noticias; `standard` prohibe abrir o cerrar
      -incluida la ejecucion de un stop o un objetivo- de dos minutos antes a dos despues de
      noticias seleccionadas en la cuenta fondeada
    estado: CONFIRMED
    valor: swing
    consumido_por: [F33]
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_perdida_diaria_max
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital simulado inicial (saldo_inicial_cuenta)
    descripcion: >-
      perdida maxima del dia de la firma. El limite del dia es el saldo al corte diario
      (firma_base_perdida_diaria, reloj_dia_riesgo) menos este porcentaje del capital INICIAL, y lo
      vigila sobre firma_magnitud_vigilada. No es perdida_maxima_diaria, que es el freno del
      trader: con saldo al empezar el dia por encima de 111.111,11 el del trader es el MENOS
      restrictivo (ADR-0026)
    estado: CONFIRMED
    valor: "5"
    minimo: "0"
    maximo: "100"
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_perdida_total_max
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital simulado inicial (saldo_inicial_cuenta)
    descripcion: >-
      perdida maxima total de la firma: el limite es el capital inicial menos este porcentaje, fijo
      en las dos fases y en la cuenta fondeada (firma_perdida_total_arrastra). El semanal del
      trader no lo cubre: se reinicia cada semana y este no se reinicia nunca
    estado: CONFIRMED
    valor: "10"
    minimo: "0"
    maximo: "100"
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_base_perdida_diaria
    categoria: prop_firm
    tipo: enum
    unidad: sobre que saldo se fija el limite del dia
    opciones: [saldo_inicial_cuenta, saldo_corte_diario]
    descripcion: >-
      el limite del dia se fija con el saldo al corte diario (medianoche CE(S)T, reloj_dia_riesgo)
      y no con el capital inicial: "Account balance at midnight CE(S)T of the previous day - 5% of
      the Initial Simulated Capital"
    estado: CONFIRMED
    valor: saldo_corte_diario
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_perdida_total_arrastra
    categoria: prop_firm
    tipo: booleano
    unidad: si el limite total sigue al saldo maximo alcanzado
    descripcion: >-
      si la perdida maxima total arrastra con el saldo mas alto alcanzado. En el programa 2-Step
      NO: es estatica, capital inicial menos firma_perdida_total_max
    estado: CONFIRMED
    valor: false
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_magnitud_vigilada
    categoria: prop_firm
    tipo: enum
    unidad: que magnitud no puede bajar del limite
    opciones: [saldo, equity]
    descripcion: >-
      la firma vigila EQUITY: saldo mas P/L flotante, swaps y comisiones ("equity cannot drop at
      any time"). Por eso la fase de riesgo del motor va por tick (ADR-0028)
    estado: CONFIRMED
    valor: equity
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_cierre_al_tope
    categoria: prop_firm
    tipo: enum
    unidad: si/no
    opciones: ["si", "no"]
    descripcion: >-
      si, al alcanzar un limite de la firma con una posicion viva, el bot la cierra a mercado
      (RN-030). Nace el 2026-09-14 para sustituir el literal `si: "si"` que RN-029 llevaba en su
      cierre, donde RN-002 usa cierre_forzoso_fin_ventana: una opcion de una accion es un valor de
      negocio y vive aqui (ADR-0002). `si` es lo que decide ADR-0026: con el limite ya alcanzado la
      cuenta esta en infraccion, y dejar correr la posicion solo puede agrandar la perdida
    estado: CONFIRMED
    valor: "si"
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_margen_seguridad
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital simulado inicial (saldo_inicial_cuenta)
    descripcion: >-
      cuanto antes de cada limite de la firma saltan sus frenos (RN-029, RN-030, RN-031) y deja de
      caber una operacion nueva (RN-032). Llegar al limite ya es la infraccion, asi que frenar en el
      limite no evita perder la cuenta. El margen es el colchon para lo que la lectura prospectiva no
      ve: deslizamiento, gap, costes y el equity flotante antes de que un cierre se ejecute. El valor
      lo VALIDO EL CONSULTOR el 2026-09-17 (ADR-0031): 0,5 % del capital inicial es aproximadamente un
      riesgo nominal, y como riesgo_por_operacion va sobre el saldo actual y encoge con el drawdown,
      el colchon solo crece. Con el, en un dia que empieza en el capital inicial o por encima, la
      decima perdida seguida del dia ya no se abre. No cubre un gap mayor que el propio margen
    estado: CONFIRMED
    valor: "0.5"
    minimo: "0"
    maximo: "100"
    fuente:
      tipo: decision
      id: ADR-0031
  - nombre: firma_mensajes_dia_max
    categoria: prop_firm
    tipo: entero
    unidad: peticiones al servidor por dia
    descripcion: >-
      por encima de este numero de peticiones al servidor en un dia, la firma lo trata como
      practica prohibida ("an excessive number of more than 2,000 server requests per day").
      Restriccion de diseño de primera clase: la fase de estrategia va al cierre de M1 para no
      acercarse (ADR-0028)
    estado: CONFIRMED
    valor: 2000
    minimo: 0
    # F23 cuenta las peticiones en el journal, F24 las simula, F31 las limita en el EA
    consumido_por: [F23, F24, F31]
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: firma_noticias_restringe
    categoria: prop_firm
    tipo: booleano
    unidad: si la cuenta restringe operar alrededor de noticias
    descripcion: >-
      si la cuenta prohibe o penaliza operar alrededor de noticias. Con firma_tipo_cuenta = swing,
