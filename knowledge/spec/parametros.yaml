# Registro de parametros de negocio: LA UNICA PUERTA (F02, ADR-0002).
#
# Sin valores de ESTRATEGIA a proposito: llegan en F11 citando evidencia o feedback. Los
# parametros de entorno (categoria distinta de estrategia) entran citando un ADR (ADR-0004).
# Ningun numero de negocio (0,75, 1:3, 07:00, 3 cartuchos...) puede vivir fuera de este fichero;
# tests/contract/test_no_business_literals.py lo comprueba.
#
# Esquema de cada entrada:
#   nombre:        identificador en snake_case (p. ej. stop_fraccion_caja)
#   categoria:     estrategia | instrumento | broker | prop_firm | ejecucion (ADR-0004).
#                  Solo `estrategia` se cita por evidence/feedback y se le pregunta al trader;
#                  las demas se citan por decision (ADR-NNNN) y se verifican en el pre-vuelo.
#   tipo:          fraccion | porcentaje | decimal | entero | hora | texto
#   huso:          obligatorio si tipo es hora: nombre IANA (Europe/Madrid, UTC, ...)
#   unidad:        texto libre pero obligatorio (p. ej. "fraccion de la distancia completa")
#   descripcion:   una frase
#   estado:        CONFIRMED | DEFAULT_AMBIGUOUS | UNKNOWN
#   valor:         entre comillas para fraccion/porcentaje/decimal/hora/texto ("0.75", "07:00");
#                  entero SIN comillas (3); ausente si UNKNOWN
#   fuente:        {tipo: evidence|feedback|decision, id: ...}; obligatoria salvo UNKNOWN;
#                  id con formato ev-…, fb-… o ADR-NNNN
#   ambiguedad_id: solo si DEFAULT_AMBIGUOUS (p. ej. A-1)
#   minimo/maximo: opcionales, entre comillas o entero; SOLO para fraccion/porcentaje/decimal/
#                  entero (en hora o texto se rechazan). No se admiten claves de nivel superior
#                  distintas de `parametros`.
#
# Ejemplo (NO es un valor real; los reales se anaden en F11):
#   - nombre: ejemplo_stop_fraccion
#     categoria: estrategia
#     tipo: fraccion
#     unidad: fraccion de la distancia completa nivel 0 -> nivel 1
#     descripcion: donde va el stop dentro de la caja
#     estado: CONFIRMED
#     valor: "0.75"
#     fuente: {tipo: evidence, id: ev-v4-001230-1a2b3c4d}
#     minimo: "0"
#     maximo: "1"
#   - nombre: ejemplo_inicio_ventana
#     categoria: estrategia
#     tipo: hora
#     huso: Europe/Madrid
#     unidad: hora de reloj del trader
#     descripcion: inicio de la ventana operativa
#     estado: UNKNOWN

parametros:
  # F15 (ADR-0005): el reloj del trader es un hecho del entorno; el anclaje de la vela H4 es de
  # estrategia y sigue abierto (A-9: hora Y huso del grafico) hasta que el trader lo resuelva.
  # El huso de los datos no es un parametro: lo declara cada manifiesto de dataset (UTC).
  - nombre: huso_operativa
    categoria: ejecucion
    tipo: texto
    unidad: nombre IANA de huso horario
    descripcion: reloj del trader; las horas de la operativa se expresan en este huso
    estado: CONFIRMED
    valor: "Europe/Madrid"
    fuente: {tipo: decision, id: ADR-0005}
  - nombre: anclaje_h4
    categoria: estrategia
    tipo: hora
    unidad: hora de reloj de pared; el huso se fija al resolver A-9 (es parte de la pregunta)
    descripcion: hora local a la que abre la primera vela H4 del dia en el grafico del trader (A-9)
    estado: UNKNOWN

  # F10 (ADR-0011): todos los parametros de estrategia que la evidencia nombra, pre-poblados en
  # UNKNOWN sin valor. Se cierran en F11 con un registro de feedback de la sesion 1 (o evidencia
  # que baste). El enlace parametro -> evidencia/ambiguedad esta en knowledge/cases/kit/
  # mapa_parametros.yaml (el esquema del registro no admite claves extra). Las horas van sin
  # `huso` hasta que A-6/A-9 lo fijen.
  - nombre: ventana_inicio
    categoria: estrategia
    tipo: hora
    unidad: hora de reloj del trader
    descripcion: inicio de la ventana operativa (primera sesion H4)
    estado: UNKNOWN
  - nombre: ventana_fin
    categoria: estrategia
    tipo: hora
    unidad: hora de reloj del trader
    descripcion: fin de la ventana operativa (cierre de la segunda sesion H4; A-6)
    estado: UNKNOWN
  - nombre: cierre_forzoso_fin_ventana
    categoria: estrategia
    tipo: texto
    unidad: si/no
    descripcion: si un trade abierto se cierra en punto al terminar la ventana (A-6)
    estado: UNKNOWN
  - nombre: sesgo_h4_regla
    categoria: estrategia
    tipo: texto
    unidad: opcion cerrada (mapa_parametros.yaml)
    descripcion: que vela H4 fija el sesgo y cuando cambia (A-1)
    estado: UNKNOWN
  - nombre: liquidez_m15_criterio_toma
    categoria: estrategia
    tipo: texto
    unidad: cuerpo/mecha
    descripcion: si la liquidez de M15 se toma con cierre de cuerpo o basta la mecha
    estado: UNKNOWN
  - nombre: stop_fraccion_caja
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa nivel 0 -> nivel 1
    descripcion: nivel de la caja donde va el stop tras la entrada (0,75 u 0,8; A-10)
    estado: UNKNOWN
  - nombre: stop_colchon_spread
    categoria: estrategia
    tipo: texto
    unidad: fijo/spread
    descripcion: si el stop es fijo en la fraccion o se desplaza con el spread del momento (A-10)
    estado: UNKNOWN
  - nombre: stop_reduccion_fraccion
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa
    descripcion: nivel al que se reduce el stop cuando la vela avanza (A-12)
    estado: UNKNOWN
  - nombre: stop_reduccion_umbral_vela
    categoria: estrategia
    tipo: porcentaje
    unidad: porcentaje de la vela transcurrido
    descripcion: parte de la vela a partir de la cual se baja el stop (40 o 50; A-12)
    estado: UNKNOWN
  - nombre: stop_proteccion_capital
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa
    descripcion: parte del riesgo que se guarda al proteger el trade al entrar (0,25)
    estado: UNKNOWN
  - nombre: stop_segundo_esquema
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia completa
    descripcion: donde va el stop en el segundo esquema de entrada (0,75, 0,6, zona de control; A-7)
    estado: UNKNOWN
  - nombre: stop_en_orden_pendiente
    categoria: estrategia
    tipo: texto
    unidad: en_la_orden/tras_el_llenado
    descripcion: si el SL viaja en la orden pendiente o se pone tras el llenado (A-11)
    estado: UNKNOWN
  - nombre: break_even_condicion
    categoria: estrategia
    tipo: texto
    unidad: tocar/cierre
    descripcion: si el break even se pone al tocar el nivel o al cierre de la vela (A-4)
    estado: UNKNOWN
  - nombre: objetivo_rr
    categoria: estrategia
    tipo: decimal
    unidad: multiplo del riesgo (1 a N)
    descripcion: objetivo riesgo/beneficio fijo y minimo (1 a 3)
    estado: UNKNOWN
  - nombre: objetivo_extension
    categoria: estrategia
    tipo: fraccion
    unidad: fraccion de la distancia hasta la liquidez de M15
    descripcion: hasta donde se extiende el objetivo cuando se maximiza (0,50 de la liquidez)
    estado: UNKNOWN
  - nombre: cartuchos_max
    categoria: estrategia
    tipo: entero
    unidad: intentos por zona de liquidez
    descripcion: numero maximo de intentos por barrido de liquidez (2 o 3; A-2)
    estado: UNKNOWN
  - nombre: reentrada_tras_equal
    categoria: estrategia
    tipo: texto
    unidad: si/no
    descripcion: si tras un equal (activacion sin rotura) se reentra al romper de nuevo
    estado: UNKNOWN
  - nombre: reubicacion_cadencia
    categoria: estrategia
    tipo: texto
    unidad: opcion cerrada (mapa_parametros.yaml)
    descripcion: cada cuanto se reubica la orden limite mientras no se activa (A-5)
    estado: UNKNOWN
  - nombre: salida_sin_ruptura
    categoria: estrategia
    tipo: texto
    unidad: cerrar_al_cierre/proteger_y_dejar
    descripcion: que se hace si la orden se activa sin ruptura (A-3)
    estado: UNKNOWN
  - nombre: mapeo_dos_velas
    categoria: estrategia
    tipo: texto
    unidad: opcion cerrada (mapa_parametros.yaml)
    descripcion: cuando dos velas de M1 cuentan como una estructura al mapear (A-8)
    estado: UNKNOWN
  - nombre: parciales
    categoria: estrategia
    tipo: texto
    unidad: si/no
    descripcion: si se toman parciales
    estado: UNKNOWN
  - nombre: riesgo_por_operacion
    categoria: estrategia
    tipo: porcentaje
    unidad: porcentaje de la cuenta por operacion
    descripcion: riesgo por operacion (1 en backtest; 0,4-0,5 en fondeo)
    estado: UNKNOWN
  - nombre: lotaje_base
    categoria: estrategia
    tipo: texto
    unidad: distancia_completa/desde_075
    descripcion: sobre que distancia se calcula el lotaje
    estado: UNKNOWN

  # F10 (auditoria previa a la sesion 1): parametros que la hoja de la sesion pregunta y que sin
  # esta entrada dejarian la respuesta del trader sin ningun objeto al que apuntar.
  - nombre: dias_operables
    categoria: estrategia
    tipo: texto
    unidad: dias de la semana en que se opera
    descripcion: dias en los que el bot busca entradas y dias que se excluyen por norma
    estado: UNKNOWN
  - nombre: filtro_noticias
    categoria: estrategia
    tipo: texto
    unidad: regla de filtro, o no si no filtra
    descripcion: si se deja de operar alrededor de noticias de alto impacto y con que margen
    estado: UNKNOWN
  - nombre: spread_maximo
    categoria: estrategia
    tipo: decimal
    unidad: pips
    descripcion: spread por encima del cual no se abre la operacion
    estado: UNKNOWN
  - nombre: perdida_maxima_diaria
    categoria: estrategia
    tipo: porcentaje
    unidad: porcentaje de la cuenta
    descripcion: perdida acumulada en el dia que detiene la operativa
    estado: UNKNOWN
  - nombre: perdida_maxima_semanal
    categoria: estrategia
    tipo: porcentaje
    unidad: porcentaje de la cuenta
    descripcion: perdida acumulada en la semana que detiene la operativa
    estado: UNKNOWN
  - nombre: comportamiento_sin_regla
    categoria: estrategia
    tipo: texto
    unidad: abstenerse/regla_mas_parecida
    descripcion: que hace el bot cuando la situacion no encaja con ninguna regla
    estado: UNKNOWN
  - nombre: instrumento
    categoria: instrumento
    tipo: texto
    unidad: simbolo del instrumento
    descripcion: instrumento sobre el que opera el bot
    estado: UNKNOWN
  - nombre: cuenta_objetivo
    categoria: ejecucion
    tipo: texto
    unidad: tipo de cuenta
    descripcion: cuenta sobre la que opera la primera version (fondeo, demo o propia)
    estado: UNKNOWN
