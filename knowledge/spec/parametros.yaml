    opciones: [servidor, grafico]
    descripcion: >-
      en que reloj cae la medianoche que reinicia el tope diario, y el domingo que reinicia el
      semanal. Sin esto, "el saldo inicial del dia" no dice cuando empieza el dia. Importa porque
      los dos relojes NO coinciden: el del servidor cambia con el calendario de Nueva York
      (broker_offset_base + broker_dst) y el del grafico esta en discusion (A-14), asi que se
      separan una hora buena parte del año. `servidor` es un DEFAULT NUESTRO: es como lo calculan
      las cuentas de fondeo, pero no esta verificado contra el panel de FundedNext (A-19), y en
      una cuenta fondeada equivocarse aqui es perder la cuenta, no perder un trade
    estado: DEFAULT_AMBIGUOUS
