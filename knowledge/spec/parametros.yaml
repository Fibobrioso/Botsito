# Registro de parametros de negocio: LA UNICA PUERTA (F02, ADR-0002).
#
# Sin valores de ESTRATEGIA a proposito: llegan en F11 citando evidencia o feedback. Los
# parametros de entorno (categoria distinta de estrategia) entran citando un ADR (ADR-0004).
# Ningun numero de negocio (0,75, 1:3, 07:00, 3 cartuchos...) puede vivir fuera de este fichero;
# tests/contract/test_no_business_literals.py lo comprueba.
#
# Esquema de cada entrada:
#   nombre:        identificador en snake_case (p. ej. stop_fraccion_caja)
#   categoria:     estrategia | instrumento | broker | prop_firm | ejecucion (ADR-0004).
#                  Solo `estrategia` se cita por evidence/feedback y se le pregunta al trader;
#                  las demas se citan por decision (ADR-NNNN) y se verifican en el pre-vuelo.
#   tipo:          fraccion | porcentaje | decimal | entero | hora | texto |
#                  enum | booleano | puntos | minutos | lotes (F11)
#   opciones:      obligatorio y exclusivo de `enum`: los valores que admite (>= 2)
#   huso:          obligatorio si tipo es hora: nombre IANA (Europe/Madrid, UTC, ...)
#   unidad:        texto libre pero obligatorio (p. ej. "fraccion de la distancia completa")
#   descripcion:   una frase
#   estado:        CONFIRMED | DEFAULT_AMBIGUOUS | UNKNOWN
#   valor:         entre comillas para fraccion/porcentaje/decimal/hora/texto ("0.75", "07:00");
#                  entero SIN comillas (3); ausente si UNKNOWN
#   fuente:        {tipo: evidence|feedback|decision, id: ...}; obligatoria salvo UNKNOWN;
#                  id con formato ev-…, fb-… o ADR-NNNN
#   ambiguedad_id: solo si DEFAULT_AMBIGUOUS (p. ej. A-1)
#   minimo/maximo: opcionales, entre comillas o entero; SOLO para fraccion/porcentaje/decimal/
#                  entero (en hora o texto se rechazan). No se admiten claves de nivel superior
#                  distintas de `parametros`.
#
# Ejemplo (NO es un valor real; los reales se anaden en F11):
#   - nombre: ejemplo_stop_fraccion
#     categoria: estrategia
#     tipo: fraccion
#     unidad: fraccion de la distancia completa nivel 0 -> nivel 1
#     descripcion: donde va el stop dentro de la caja
#     estado: CONFIRMED
#     valor: "0.75"
#     fuente: {tipo: evidence, id: ev-v4-001230-1a2b3c4d}
#     minimo: "0"
#     maximo: "1"
#   - nombre: ejemplo_inicio_ventana
#     categoria: estrategia
#     tipo: hora
#     huso: Europe/Madrid
#     unidad: hora de reloj del trader
#     descripcion: inicio de la ventana operativa
#     estado: UNKNOWN

parametros:
  # F15 (ADR-0005): el reloj del trader es un hecho del entorno; el anclaje de la vela H4 es de
  # estrategia y sigue abierto (A-9: hora Y huso del grafico) hasta que el trader lo resuelva.
  # El huso de los datos no es un parametro: lo declara cada manifiesto de dataset (UTC).
  # --- entorno: ficha del instrumento, reloj del broker y modelo de llenado (F11, ADR-0012).
  # Medidos contra la cuenta demo real de FundedNext (34891752, FundedNext-Server 3) el
  # 2026-09-05. Desde ADR-0026 (2026-09-14) la firma es FTMO y esa medicion YA NO VALE COMO
  # MEDICION: los cinco del instrumento se quedan como default declarado bajo A-27 y los dos del
  # reloj del servidor pasan a UNKNOWN bajo A-28. El pre-vuelo de F33 los comprueba contra
  # SymbolInfo*/AccountInfo* y aborta si el broker dice otra cosa. No se preguntan al trader: son
  # del entorno (ADR-0004).
  - nombre: instrumento_digitos
    categoria: instrumento
    tipo: entero
    unidad: decimales de la cotizacion
    descripcion: >-
      digits del simbolo; con 5 un punto es 0,00001 y un pip son 10 puntos.
      Medido en una demo de FundedNext el 2026-09-05; se conserva como default porque EURUSD
      tiene las mismas especificaciones en casi cualquier bróker, pero NO está verificado en
      FTMO (A-27).
    estado: DEFAULT_AMBIGUOUS
    valor: 5
    ambiguedad_id: A-27
    minimo: 0
    maximo: 8
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: instrumento_contrato
    categoria: instrumento
    tipo: decimal
    unidad: unidades de la divisa base por lote
    descripcion: >-
      tamano del contrato; con el se convierte el riesgo en lotes.
      Medido en una demo de FundedNext el 2026-09-05; se conserva como default porque EURUSD
      tiene las mismas especificaciones en casi cualquier bróker, pero NO está verificado en
      FTMO (A-27).
    estado: DEFAULT_AMBIGUOUS
    valor: "100000"
    ambiguedad_id: A-27
    minimo: "1"
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: instrumento_lote_minimo
    categoria: instrumento
    tipo: lotes
    unidad: lotes
    descripcion: >-
      lote minimo que admite el broker; por debajo, la operacion se rechaza.
      Medido en una demo de FundedNext el 2026-09-05; se conserva como default porque EURUSD
      tiene las mismas especificaciones en casi cualquier bróker, pero NO está verificado en
      FTMO (A-27).
    estado: DEFAULT_AMBIGUOUS
    valor: "0.01"
    ambiguedad_id: A-27
    minimo: "0"
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: instrumento_lote_paso
    categoria: instrumento
    tipo: lotes
    unidad: lotes
    descripcion: >-
      escalon del lote; el lotaje calculado se redondea a un multiplo de este paso.
      Medido en una demo de FundedNext el 2026-09-05; se conserva como default porque EURUSD
      tiene las mismas especificaciones en casi cualquier bróker, pero NO está verificado en
      FTMO (A-27).
    estado: DEFAULT_AMBIGUOUS
    valor: "0.01"
    ambiguedad_id: A-27
    minimo: "0"
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: instrumento_stops_level
    categoria: instrumento
    tipo: puntos
    unidad: puntos de distancia minima a mercado
    descripcion: >-
      distancia minima a la que el broker admite un stop o un limite. Si la spec pide uno mas
      cerca, la respuesta es ABSTENERSE, nunca aproximar (MASTER_PLAN H.2).
      Medido en una demo de FundedNext el 2026-09-05; se conserva como default porque EURUSD
      tiene las mismas especificaciones en casi cualquier bróker, pero NO está verificado en
      FTMO (A-27). Y aqui el aviso pesa mas que en los otros cuatro: el stops level SI cambia de un
      broker a otro, y con 0 RN-026 no se activa nunca
    estado: DEFAULT_AMBIGUOUS
    valor: 0
    ambiguedad_id: A-27
    fuente:
      tipo: decision
      id: ADR-0026
  - nombre: broker_offset_base
    categoria: broker
    tipo: minutos
    unidad: minutos que el reloj del servidor va por delante de UTC en horario estandar
    descripcion: >-
      desfase base del reloj del servidor, medido en el terminal y no supuesto. En la demo de
      FundedNext valia 120 (GMT+2 en horario estandar) y NO se hereda (ADR-0026). FTMO declara
      "GMT+2 +DST" en su ficha de cuenta, que es una descripcion y no una medicion: se mide en su
      demo (A-28). Desde ADR-0027 no decide el dia de riesgo, que es civil; decide la rejilla de
      velas del servidor
    estado: UNKNOWN
    # F17 lo mide contra el terminal de la demo; F24 lo usa para la rejilla; F33 aborta si difiere
    consumido_por: [F17, F24, F33]
  - nombre: broker_dst
    categoria: broker
    tipo: enum
    unidad: que calendario de cambio de hora sigue el servidor
    opciones: [us, eu, ninguno]
    descripcion: >-
      con que calendario cambia la hora el servidor. El de FundedNext seguia el de Nueva York
      (valor `us` en su demo) y NO se hereda (ADR-0026): la ficha de FTMO dice "GMT+2 +DST" sin
      nombrar calendario, asi que se mide en su demo (A-28). Comprobarlo exige OBSERVAR UNA
      TRANSICION de hora, y por eso A-28 no se cierra antes del cambio de octubre. Desde ADR-0027
      este reloj ya no mueve el dia de riesgo, que es civil; si decide si anclaje_h4 (17:00 Nueva
      York) cae de verdad en la medianoche del servidor. Este reloj y huso_grafico son DOS RELOJES
      DISTINTOS: este es el del servidor donde se ejecuta, aquel el de la pantalla donde el trader
      decide
    estado: UNKNOWN
    # F17 lo mide observando una transicion; F24 lo usa para la rejilla; F33 aborta si difiere
    consumido_por: [F17, F24, F33]
  - nombre: modelo_llenado
    categoria: ejecucion
    tipo: enum
    unidad: como se decide que una orden limite se ha llenado
    opciones: [al_tocar, cruce_mas_latencia]
    descripcion: >-
      criterio de llenado en el motor de referencia. `al_tocar` es optimista y `cruce_mas_latencia`
      exige que el precio cruce y pase `latencia_ms`; F27 mide las dos y la diferencia entre ellas
      es una cota de cuanto depende el resultado del modelo, no de la estrategia
    estado: CONFIRMED
    valor: "al_tocar"
    # MASTER_PLAN H.2: el modelo de llenado lo simula F24 y F27 informa de los dos
    consumido_por: [F24, F27]
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: latencia_ms
    categoria: ejecucion
    tipo: minutos
    unidad: milisegundos de latencia supuesta entre senal y orden
    descripcion: latencia que asume `cruce_mas_latencia`; con `al_tocar` no se usa
    estado: CONFIRMED
    valor: 0
    # MASTER_PLAN H.2: el modelo de llenado lo simula F24 y F27 informa de los dos
    consumido_por: [F24, F27]
    fuente:
      tipo: decision
      id: ADR-0012
  - nombre: huso_operativa
    categoria: ejecucion
    tipo: texto
    unidad: nombre IANA del huso en el que se expresan las horas de la operativa
    descripcion: >-
      reloj del TRADER como persona: la hora a la que se sienta y a la que cierra, y de la que
      cuelgan ventana_inicio y ventana_fin. Es su reloj civil y por tanto cambia con el horario
      de verano. ADR-0005 lo fijo en Europe/Madrid, ADR-0012 lo cambio a un offset fijo apoyandose
      en que "la sesion desmintio Madrid" -que no ocurrio, ver ADR-0015- y ADR-0017 lo revierte:
      el trader opera siempre a la misma hora SUYA, sea cual sea la fecha. DESDE EL 2026-09-30
      (rama trabajo/nocturno-01oct, ADR-0063) YA NO LO LEE NINGUNA FORMA como reloj de la ventana:
      ese lo elige reloj_sesiones, que hoy apunta aqui (`civil_operativa`). Este parametro queda
      como el huso del reloj civil del trader y, con el, del DIA DE RIESGO: es lo que
      reloj_dia_riesgo declara (ADR-0027) y lo que el cableado compara con el reloj de la firma
      (ADR-0053 §4). Si A-42 lleva las sesiones al reloj del grafico, este valor NO se toca
    estado: CONFIRMED
    valor: "Europe/Madrid"
    consumido_por: [ADR-0027, ADR-0053, ADR-0063]
    fuente:
      tipo: decision
      id: ADR-0017
  - nombre: reloj_sesiones
    categoria: ejecucion
    tipo: enum
    unidad: con que reloj del registro se cuentan la ventana operativa y sus sesiones
    opciones: [civil_operativa, grafico]
    descripcion: >-
      en que reloj caen ventana_inicio y ventana_fin, y con ellas las sesiones del motor.
      `civil_operativa` es el reloj civil del trader, cuyo huso vive en huso_operativa; `grafico`,
      el de su grafico, cuyo huso vive en huso_grafico: el huso no se escribe aqui, para no
      tener dos puertas (ADR-0002). NACE el 2026-09-30 (rama trabajo/nocturno-01oct, ADR-0063)
      para separar este reloj del reloj del dia de riesgo: hasta entonces huso_operativa hacia de
      los dos y no se podia mover uno sin romper el otro (ADR-0059, desalineacion 9 de
      docs/validation/ACTIVAR-SESION-03.md). NACE EN `civil_operativa`, LO QUE EL MOTOR YA
      HACIA, asi que nada cambia todavia. Es un DEFAULT bajo A-42: la lectura PROVISIONAL del
      consultor (ADR-0059) es que las sesiones van fijas en el reloj del grafico todo el año, y
      el trader dijo «creo». Cuando se confirme, el valor que cambia es ESTE -a `grafico`-, junto
      con el `huso` de ventana_inicio y ventana_fin, que un test mantiene iguales al de este
      reloj; huso_operativa y el corte del dia de la firma no se tocan. La opcion
      `civil_operativa` se llama igual que la de reloj_dia_riesgo porque es el mismo reloj, leido
      para otro fin
    estado: DEFAULT_AMBIGUOUS
    valor: "civil_operativa"
    ambiguedad_id: A-42
    fuente:
      tipo: decision
      id: ADR-0063
  - nombre: huso_grafico
    categoria: estrategia
    tipo: texto
    unidad: nombre IANA del huso configurado en el grafico del trader
    descripcion: >-
      como se ETIQUETAN las horas en la pantalla del trader, que es el grafico de FX Replay. Es
      UTC+2 FIJO, sin horario de verano: lo marca el propio grafico en un fotograma de ENERO de v4
      ("14:29:59 UTC+2" sobre "Thu 29 Jan '26", docs/validation/ABRIL-Y-LA-CAJA.md R0), y ADR-0039
      lo da por medido ("es UTC+2 fijo"). En la sesion 1 ya se leyo UTC+2 en su pantalla
      (fr-v6-22982c02/3585000, ADR-0005), pero era verano y no distinguia (ADR-0015); y en v4,
      preguntado por el horario "en el horario UTC más 2", contesta "De UTC más 2, de 7, claro"
      (ev-v4-011425-ae028b78). Hasta el 2026-09-25 valia Europe/Madrid (ADR-0017 §4), con la
      premisa de que la plataforma muestra su hora local; la medida de enero la desmiente, y en
      verano los dos valores dan la misma hora. Sirve para traducir lo que el dice -"la vela
      empieza a las 23"- a un instante: 23:00 en su grafico son las 21:00 UTC todo el año.
      NINGUNA regla cuelga de este parametro; las horas de la operativa cuelgan de huso_operativa,
      que es OTRO reloj y en invierno va una hora por detras de este, y la rejilla H4 de
      anclaje_h4. Y NO es el reloj del servidor, que va en broker_offset_base + broker_dst y se
      mide en la demo de FTMO (A-28), ni el huso de un libro del trader, que se declara por libro
      (ADR-0039, knowledge/corpus/libros.yaml)
    estado: CONFIRMED
    valor: "Etc/GMT-2"
    # documental por ADR-0017: traduce lo que el trader DICE a un instante. Desde ADR-0063 es
    # ademas el huso del reloj `grafico` de reloj_sesiones: hoy el selector no apunta aqui.
    # Valor corregido el 2026-09-25 (rama trabajo/sesion-02) por la medida que recoge ADR-0039
    consumido_por: [ADR-0017, ADR-0063]
    fuente:
      tipo: evidence
      id: ev-v4-011425-ae028b78
  - nombre: anclaje_h4
    categoria: estrategia
    tipo: hora
    huso: America/New_York
    unidad: hora de reloj de pared en el huso declarado; parte la recta UTC en velas H4
    descripcion: >-
      donde empieza la rejilla H4. Es la medianoche del servidor, que por convencion de los
      brokers se escribe 17:00 America/New_York (ADR-0005) y que sigue el calendario de Nueva
      York, como confirmo broker_dst en la demo de FundedNext. En FTMO esta SIN VERIFICAR: se
      contrasta con su rejilla H4 real al medir A-28, y si no coincide se abre ambiguedad y este
      valor no se toca por su cuenta (ADR-0027). El trader lo ve como las 23:00 en su
      pantalla, y es cierto 337 dias al año; los otros 28 -8 a 28 de marzo y 25 a 31 de octubre,
      cuando la UE y EE.UU. no cambian la hora el mismo dia- lo ve a las 22:00. Escrito como una
      hora de un huso FIJO, el ancla caia una hora antes todo el invierno y repartia mal todas
      las velas H4, que es de donde sale el sesgo (ADR-0017)
    estado: CONFIRMED
    valor: "17:00"
    # La rejilla la construye la agregacion de velas (F15, "H4 reproducible para cualquier
    # anclaje_h4"). RN-003 lo nombra en su lista y, desde ADR-0060, lo lee la forma de RN-002
    # (`vence_vela_h4`), sobre esa misma rejilla
    consumido_por: [F15]
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-479e68b9

  # F10 (ADR-0011): todos los parametros de estrategia que la evidencia nombra, pre-poblados en
  # UNKNOWN sin valor. Se cerraron en F11 con un registro de feedback de la sesion 1 (o evidencia
  # que baste). El enlace parametro -> EVIDENCIA esta en knowledge/cases/kit/mapa_parametros.yaml
  # (el esquema del registro no admite claves extra); el enlace parametro -> AMBIGUEDAD lo sostiene
  # knowledge/spec/ambiguedades.yaml, en el campo `parametros` de cada A-N. Estaban en los dos
  # sitios hasta F13, y el del mapa llevaba parado desde F10.
  - nombre: ventana_inicio
    categoria: estrategia
    tipo: hora
    huso: Europe/Madrid
    unidad: hora de reloj de pared, en el reloj que dice reloj_sesiones
    descripcion: >-
      hora a la que el trader empieza a buscar entradas. Es SU horario como persona y no se mueve
      con la fecha, asi que en UTC si se mueve con el cambio de hora (ADR-0017)
    estado: CONFIRMED
    valor: "07:00"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-8741c388
  - nombre: ventana_fin
    categoria: estrategia
    tipo: hora
    huso: Europe/Madrid
    unidad: hora de reloj de pared, en el reloj que dice reloj_sesiones
    descripcion: >-
      hora a la que el trader deja de operar y cierra lo que quede abierto. Es SU horario como
      persona, igual que ventana_inicio (A-6, ADR-0017)
    estado: CONFIRMED
    valor: "15:00"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-951b7a79
  - nombre: cierre_forzoso_fin_ventana
    categoria: estrategia
    tipo: enum
    unidad: si/no
    opciones: ["si", "no"]
    descripcion: si un trade abierto se cierra en punto al terminar la ventana (A-6)
    estado: CONFIRMED
    valor: "si"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-ffb528d7
  - nombre: cierre_h4_antelacion
    categoria: estrategia
    tipo: minutos
    unidad: minutos antes del fin de la vela H4 en curso, en la rejilla de anclaje_h4
    descripcion: >-
      con cuanta antelacion al fin de su vela H4 se cierra toda operacion abierta (RN-002). NACE
      el 2026-09-30 (rama trabajo/nocturno-01oct, ADR-0060): en la sesion 3 el trader dice que
      cierra siempre un minuto antes de que termine la vela de cuatro horas, y hasta hoy esa
      cifra vivia solo en la prosa de RN-002, sin parametro. La vela H4 es la de la rejilla de
      anclaje_h4, no la ventana operativa. LA FUENTE ES EL ITEM DE EVIDENCIA que recoge la
      frase, y no el registro de feedback de esa misma frase (fb-2026-09-29-sesion-03-c38c4aef):
      ese registro es un CORRECT sobre la REGLA, no sobre un parametro, y `feedback pending` lo
      sigue dando por pendiente mientras RN-002 no lo cite
    estado: CONFIRMED
    valor: 1
    fuente:
      tipo: evidence
      id: ev-v9-002735-472432b8
  - nombre: sesgo_h4_regla
    categoria: estrategia
    tipo: enum
    unidad: opcion cerrada (las sostiene `opciones`, aqui debajo)
    opciones: ["vela_anterior_color", "vela_anterior_cierre_mecha", "otra"]
    descripcion: >-
      que vela H4 fija el sesgo y cuando cambia (A-1). Desde F12 ninguna forma lo lee: mezclaba sujeto
      y criterio, y la forma los separa en el predicado `rompe` (que: vela_h4_previa) y en
      sesgo_h4_criterio_ruptura. Se conserva porque es lo que el trader respondio; lo que ejecuta el
      motor es lo otro (ADR-0019)
    estado: CONFIRMED
    valor: "vela_anterior_cierre_mecha"
    consumido_por: [ADR-0019]
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-8eccf5c0
  - nombre: sesgo_h4_criterio_ruptura
    categoria: estrategia
    tipo: enum
    unidad: que hace falta para dar por rota la vela H4 previa
    opciones: ["mecha", "cuerpo"]
    descripcion: >-
      criterio de ruptura del extremo de la H4 anterior, del que depende el sesgo. Vivia dentro
      del nombre del enum `sesgo_h4_regla` (`vela_anterior_cierre_mecha`), que mezclaba sujeto y
      criterio; la forma ejecutable de F12 lo separa porque el criterio es un ARGUMENTO del
      predicado `rompe`, y escribirlo a pelo seria un valor de negocio en un campo ejecutable
    estado: CONFIRMED
    valor: "mecha"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-8eccf5c0
  - nombre: sesgo_h4_tope_velas
    categoria: ejecucion
    tipo: entero
    unidad: velas H4 hacia atras en las que se busca la ultima ruptura que fija el sesgo
    descripcion: >-
      tope de la busqueda hacia atras del estado inicial del sesgo H4 (ADR-0044): se busca la
      ultima H4 que rompio un extremo de su anterior, como mucho en estas velas; si no hay
      ninguna, el sesgo es INSUFICIENTE y no se opera. PROVISIONAL: es una decision del
      proyecto, no del trader, y no sale del corpus; por eso es de `ejecucion` y no de
      `estrategia`, cuyos valores solo los dice el trader
    estado: CONFIRMED
    valor: 60
    consumido_por: [F18]
    fuente:
      tipo: decision
      id: ADR-0044
  - nombre: zona_control_criterio_completada
    categoria: estrategia
    tipo: enum
    unidad: que hace falta para dar una zona de control por completada
    opciones: ["mecha", "cuerpo"]
    descripcion: >-
      criterio de ruptura del punto extremo anterior que completa una zona de control. El trader
      lo dice con todas las letras -"con mecha no importa"- y hasta ahora vivia solo en la
      definicion del glosario
    estado: CONFIRMED
    valor: "mecha"
    fuente:
      tipo: feedback
      id: fb-2026-09-09-sesion-01-a456bc3f
  - nombre: break_even_criterio_ruptura
    categoria: estrategia
    tipo: enum
    unidad: que hace falta para dar por rota la zona que dispara el break even
    opciones: ["mecha", "cuerpo"]
    descripcion: >-
      criterio de ruptura de la zona de control POSTERIOR a la entrada, que es la que dispara el
      break even. Es lo que pregunta A-13. Hasta el 2026-09-29 entraba `mecha` como DEFAULT
      NUESTRO, porque el trader se desdecia a los doce minutos; en la sesion 3 lo dijo: al tocar
      («apenas toca, pues se pone en B la entrada», v9 0:55:48), y al tocar basta la mecha. A-13
