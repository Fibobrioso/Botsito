  - id: RN-026
    titulo: si el broker no admite el stop donde toca, el bot se abstiene
    cuando: >-
      el stop o el limite que pide la spec queda mas cerca del precio que instrumento_stops_level,
      que viene en puntos y se traduce a precio con instrumento_digitos
    entonces: >-
      no se abre la operacion; nunca se aproxima el nivel al minimo que el broker admite
    parametros: [instrumento_stops_level, comportamiento_sin_regla, instrumento_digitos]
    cita: fb-2026-09-09-sesion-01-c698bc6a
    literal: Que sea fiel a la operativa y no busque nada adicional.
    notas: >-
      la decision explicita que pide MASTER_PLAN H.2: rechazo por stops level = abstencion. Mover
      el stop a donde el broker lo admite seria operar OTRA estrategia con el nombre de esta, y el
      trader pidio fidelidad, no aproximacion. La cita sostiene el PRINCIPIO -ser fiel y no buscar
      nada adicional-, no esta regla: el trader nunca hablo del stops level. Lo que la regla decide
      lo decide ADR-0016. OJO: instrumento_stops_level vale 0 en la demo medida, asi que hoy esta
      regla no llega a activarse; hay que volver a medirlo en la cuenta fondeada
    decision: ADR-0016
    forma:
      cuando:
        todos_de:
          - distancia_menor_que:
              que: stop_o_limite
              tope: instrumento_stops_level
              digitos: instrumento_digitos
      entonces:
        prohibe: [abrir_operacion]
        hace:
          - abstenerse: {segun: comportamiento_sin_regla}
    clase: gate
    estado: VIGENTE

  - id: RN-027
    titulo: el lotaje se redondea al escalon del broker, siempre a la baja
    cuando: el lote calculado no es un multiplo de instrumento_lote_paso
    entonces: >-
      se redondea hacia abajo al escalon; si queda por debajo de instrumento_lote_minimo, no se
      opera
    parametros: [instrumento_lote_paso, instrumento_lote_minimo, instrumento_contrato]
    cita: fb-2026-09-09-sesion-01-17ed6193
    literal: >-
      el 0.5% de riesgo de la cuenta se calcula sobre el nivel 0.8 de la cuenta, ese es el
      acuerdo final
    notas: >-
      a la baja y no al mas cercano: redondear hacia arriba haria arriesgar mas de lo que el
      trader dijo, y el error se acumularia operacion tras operacion. La cita sostiene DE DONDE
      sale el lotaje, no la DIRECCION del redondeo, de la que el trader nunca hablo: eso lo
      decide ADR-0016. Citaba el registro de la sesion 1, revocado el 2026-09-11 por el acuerdo
      del lotaje (ADR-0020); ahora cita el vigente y el redondeo importa mas que antes, porque
      el lote es un 25 % mayor sobre la misma caja
    decision: ADR-0016
    forma:
      cuando:
        todos_de:
          - no_es_multiplo_de: {que: lote_calculado, paso: instrumento_lote_paso}
      entonces:
        hace:
          - redondear_lote:
              a_la_baja: "si"
              paso: instrumento_lote_paso
              minimo: instrumento_lote_minimo
              contrato: instrumento_contrato
    clase: gate
    estado: VIGENTE

  - id: RN-028
    titulo: el bot no abre alrededor de una noticia de alto impacto, aunque el trader si lo haga
    cuando: hay una noticia de alto impacto y filtro_noticias dice que se filtra
    entonces: >-
      no se abre ninguna operacion. NO es lo que hace el trader -el opera cuentas propias que no lo
      prohiben y su estrategia funciona dentro de esos eventos-: es una restriccion de la cuenta a
      la que va el bot
    parametros: [filtro_noticias]
    cita: fb-2026-09-09-sesion-01-3565552d
    literal: >-
      a mí me es indiferente si hay noticia o no [...] Sí, incluimos noticias
    notas: >-
      La cita dice lo CONTRARIO de lo que esta regla hace, y por eso declara `decision`. Lo que el
      trader dijo sigue siendo verdad sobre SU operativa y se conserva intacto en RN-021 y en la
      descripcion de filtro_noticias. Lo que decide ADR-0022 es donde corre el bot: una cuenta
      fondeada que puede prohibirlo como norma, con la cuenta como sancion aunque la operacion
      acabe en profit. El propio trader lo aviso en la sesion 1. La CAPACIDAD se conserva: basta
      poner filtro_noticias en `no` el dia que el bot opere donde se permita. F26 tiene que citar
      esta regla: si el trader opero una noticia y el bot se abstuvo, NO es un fallo del bot.
      DESCARTADA el 2026-09-14 (ADR-0026 y la enmienda de ADR-0022): la cuenta elegida es FTMO
      2-Step Swing, sin restriccion de noticias, asi que el motivo de esta regla desaparece y el bot
      opera noticias igual que el trader. Pierde su `forma`, que solo decia `pendiente_definicion:
      A-17`: una regla descartada no se ejecuta, y A-17 ya no esta abierta. SE CONSERVA como
      capacidad: si el bot corre algun dia en una cuenta con restriccion (firma_noticias_restringe),
      se revive esta regla con su condicion definida, filtro_noticias pasa a `regla` y hace falta un
      calendario economico -precondicion del pre-vuelo de F33-. La divergencia de F26 que citaba
      tambien desaparece
    decision: ADR-0022
    clase: gate
    estado: DESCARTADA

  # ---------------------------------------------------------------- la cuenta de la firma
  - id: RN-029
    titulo: el freno diario de la firma, que salta antes de su limite
    cuando: >-
      el equity -firma_magnitud_vigilada- cae hasta el limite del dia de la firma menos
      firma_margen_seguridad; ese limite es el saldo al corte de reloj_dia_riesgo segun
      firma_base_perdida_diaria menos firma_perdida_diaria_max del capital saldo_inicial_cuenta
    entonces: >-
      se prohibe abrir y buscar entradas, y la detencion dura hasta el corte siguiente. Cerrar lo que
      quede vivo lo hace la regla complementaria, que solo dispara con una posicion viva
    parametros:
      - firma_perdida_diaria_max
      - firma_base_perdida_diaria
      - firma_magnitud_vigilada
      - saldo_inicial_cuenta
      - reloj_dia_riesgo
      - firma_margen_seguridad
    cita: ev-v4-012524-0ef85a89
    literal: >-
      5% como drawdown máximo de pérdida diaria, creo, y el total es un 7, ¿no? O un 10. 8, 8. Un 8,
      sí
    notas: >-
      LO QUE LA CITA SOSTIENE y lo que no: sostiene que la cuenta de fondeo tiene sus PROPIOS topes,
      uno diario y uno total, distintos de los del trader. No sostiene ni las cifras -el trader las
      dice de memoria, de otra firma y dudando- ni la base, ni la magnitud, ni el corte, ni el margen:
      eso lo escriben el reglamento de FTMO y ADR-0026, y ADR-0031, y por eso esta regla declara
      `decision`. El trader cerraba su recuerdo en un 8 % total -el de otra firma-; la cifra vigente es
      la del reglamento. POR QUE EXISTE aparte de RN-020: el mas restrictivo NO es siempre el del
      trader. El 4,5 % del trader va sobre el saldo inicial del dia y el 5 % de la firma sobre el
      capital inicial, asi que con el saldo al empezar el dia por encima de 5.000 / 0,045 = 111.111,11
      manda la firma. LLEGAR AL LIMITE DE LA FIRMA ES LA INFRACCION, y por eso desde el 2026-09-16
      (ADR-0031) esta regla no dispara en el limite sino en el limite menos firma_margen_seguridad,
      leyendo el equity (`magnitud` del acumulador). La lectura prospectiva -no abrir una operacion
      cuyo riesgo no cabe- es otra regla, RN-032, porque no fija detencion. EL LIMITE TOTAL SE FUE A
      RN-031 el 2026-09-16: esta regla lo alcanzaba en otra rama del `cualquiera_de` y fijaba tambien
      para el "hasta el corte siguiente", que para el total es falso -la cuenta esta perdida- y solo se
      mantenia porque el acumulador no se reinicia y la regla volvia a disparar tras el corte. Produce
      Y LEE `detenido_por_tope`, como RN-020: quien fija un freno tiene que seguir viendolo, o su
      prohibicion dura un tick (lo exige una guardia). POR QUE NO CIERRA ESTA REGLA (correccion del
      2026-09-14): llevaba en su `hace` un `cerrar_a_mercado: {de: OP, si: "si"}` con OP SIN LIGAR y
      un literal donde RN-002 usa un parametro; y como lee `detenido_por_tope`, habria emitido un
      cierre en CADA evento mientras el bot esta parado. Ligar OP aqui no se puede -el `cuando` es un
      `cualquiera_de` y la prohibicion tiene que valer sin posicion-, asi que el cierre vive en RN-030.
      Desde el 2026-09-16 una guardia (`comprobar_ligaduras`) rechaza aquel OP sin ligar
    decision: ADR-0026
    forma:
      cuando:
        cualquiera_de:
          - se_acerca_al_limite:
              acumulador: perdida_dia_firma
              tope: firma_perdida_diaria_max
              margen: firma_margen_seguridad
          - hecho: detenido_por_tope
      entonces:
        prohibe: [abrir_operacion, buscar_entradas]
        hace:
          - fijar: {hecho: detenido_por_tope, a: hasta_el_corte_siguiente}
    clase: gate
    estado: VIGENTE

  - id: RN-030
    titulo: al acercarse a un limite de la firma con una posicion viva, se cierra a mercado
    cuando: >-
      el equity -firma_magnitud_vigilada- cae hasta el limite del dia o el limite total de la firma
      menos firma_margen_seguridad, en los mismos terminos que sus dos frenos, y hay una posicion viva
    entonces: se cierra a mercado esa posicion si firma_cierre_al_tope lo dice
    parametros:
      - firma_perdida_diaria_max
      - firma_perdida_total_max
      - firma_base_perdida_diaria
      - firma_perdida_total_arrastra
      - firma_magnitud_vigilada
      - saldo_inicial_cuenta
      - reloj_dia_riesgo
      - firma_cierre_al_tope
      - firma_margen_seguridad
    cita: ev-v4-012524-0ef85a89
    literal: >-
      5% como drawdown máximo de pérdida diaria, creo, y el total es un 7, ¿no? O un 10. 8, 8. Un 8,
      sí
    notas: >-
      nace el 2026-09-14 partiendo RN-029, que cerraba a mercado con OP sin ligar y con un literal
      en `si` (ver sus notas). Aqui el cierre DEPENDE DE LA LIGADURA y no el gate entero: sin
      posicion viva esta regla no dispara, asi que no emite un cierre por evento mientras el bot
      esta detenido, y tampoco dispara cuando el freno alcanzado fue el del trader, porque no lee
      `detenido_por_tope` sino los acumuladores de la firma. Complementa a RN-029 y a RN-031 -mismo
      disparador, otro efecto- y lo declara. La cita sostiene lo mismo que en RN-029 y nada mas: que
      la cuenta tiene sus propios topes; el cierre lo decide ADR-0026 y el margen ADR-0031. CLASE
      (2026-09-16): era `gate` y no prohibe nada, solo cierra; su gemela por efecto, RN-002, es
      `terminal`. ADR-0018 define el gate como lo que "prohibe o frena" y el terminal como lo que
      cierra y gana a mover un stop o activar una entrada, que es lo que esta regla necesita frente a
      RN-014 en el mismo evento. Como `terminal`, `complementa` ya no la exime de nada -los gates de
      la firma son de otra clase- y se conserva porque dice la verdad: refina a sus dos frenos.
      Dispara en el limite MENOS firma_margen_seguridad (ADR-0031): cerrar en el propio limite es
      cerrar con el limite roto. Lo que quedaba del brief anterior -el lector de
      firma_magnitud_vigilada, el valor permanente del tope total y el `reinicia_con` booleano- esta
      resuelto en los acumuladores, en RN-031 y en el token `nunca`
    complementa: [RN-029, RN-031]
    decision: ADR-0026
    forma:
      cuando:
        todos_de:
          - cualquiera_de:
              - se_acerca_al_limite:
                  acumulador: perdida_dia_firma
                  tope: firma_perdida_diaria_max
                  margen: firma_margen_seguridad
              - se_acerca_al_limite:
                  acumulador: perdida_total_firma
                  tope: firma_perdida_total_max
                  margen: firma_margen_seguridad
          - hecho: operacion_abierta
            liga: OP
      entonces:
        hace:
          - cerrar_a_mercado: {de: OP, si: firma_cierre_al_tope}
    clase: terminal
    estado: VIGENTE

  - id: RN-031
    titulo: el freno total de la firma, que no se levanta nunca
    cuando: >-
      el equity -firma_magnitud_vigilada- cae hasta el limite total de la firma menos
      firma_margen_seguridad; ese limite es saldo_inicial_cuenta menos firma_perdida_total_max, y no se
      mueve mientras firma_perdida_total_arrastra lo diga
    entonces: >-
      se prohibe abrir y buscar entradas para siempre: ningun corte de dia ni de semana levanta la
      detencion. Cerrar lo que quede vivo lo hace la regla complementaria
    parametros:
      - firma_perdida_total_max
      - saldo_inicial_cuenta
      - firma_perdida_total_arrastra
      - firma_magnitud_vigilada
      - firma_margen_seguridad
    cita: ev-v4-012524-0ef85a89
    literal: >-
      5% como drawdown máximo de pérdida diaria, creo, y el total es un 7, ¿no? O un 10. 8, 8. Un 8,
      sí
    notas: >-
      nace el 2026-09-16 partiendo RN-029, que alcanzaba los dos limites de la firma en ramas de un
      `cualquiera_de` y fijaba para los dos `detenido_por_tope: hasta_el_corte_siguiente`. Para el
      total eso era falso: si se alcanza, la cuenta esta perdida, y la detencion solo se mantenia
      porque el acumulador no se reinicia y la regla volvia a disparar tras el corte -funcionaba por
      accidente, y dependia de que el acumulador se siguiera evaluando-. ADR-0019 no da semantica a
      una accion condicionada a una rama, asi que el valor permanente no cabia dentro de RN-029: va en
      una regla hermana con su propio hecho, `detenido_por_tope_total`, que lee RN-001. Hecho aparte y
      no otro valor de `detenido_por_tope`: RN-020 y RN-029 leen ese hecho sin mirar su valor y lo
      reescriben en cada evento, y machacarian el permanente. La cita sostiene lo mismo que en RN-029
      y nada mas; el limite, la magnitud, la permanencia y el margen los deciden ADR-0026 y ADR-0031
    decision: ADR-0026
    forma:
      cuando:
        cualquiera_de:
          - se_acerca_al_limite:
              acumulador: perdida_total_firma
              tope: firma_perdida_total_max
              margen: firma_margen_seguridad
          - hecho: detenido_por_tope_total
      entonces:
        prohibe: [abrir_operacion, buscar_entradas]
        hace:
          - fijar: {hecho: detenido_por_tope_total, a: permanente}
    clase: gate
    estado: VIGENTE

  - id: RN-032
    titulo: no se abre una operacion cuyo riesgo no cabe antes del limite de la firma
    cuando: >-
      la perdida acumulada de la firma -la del dia o la total, sobre firma_magnitud_vigilada- mas el
      riesgo de la operacion que se va a abrir, riesgo_por_operacion sobre base_calculo_riesgo, llega
      al limite menos firma_margen_seguridad
    entonces: >-
      no se abre esa operacion. No detiene nada: si la cuenta recupera holgura en el mismo dia, la
      siguiente puede caber
    parametros:
      - firma_perdida_diaria_max
      - firma_perdida_total_max
      - firma_base_perdida_diaria
      - firma_perdida_total_arrastra
      - firma_magnitud_vigilada
      - saldo_inicial_cuenta
      - reloj_dia_riesgo
      - firma_margen_seguridad
      - riesgo_por_operacion
      - base_calculo_riesgo
    cita: ev-v4-012524-0ef85a89
    literal: >-
      5% como drawdown máximo de pérdida diaria, creo, y el total es un 7, ¿no? O un 10. 8, 8. Un 8,
      sí
    notas: >-
      nace el 2026-09-16 con ADR-0031. Los topes se comprobaban antes de abrir SIN descontar la
      operacion que se abre, asi que se rebasaban por construccion: la auditoria del 2026-09-13 midio
      el del trader en 4,865 % sobre un 4,5 % ([d1-interprete-04], escenario s05a), y con la
      aritmetica en el borde el diario de la firma podia acabar en 5,475 % y el total en 10,45 %. Esta
      regla es la lectura PROSPECTIVA, y solo para los limites de la firma: el tope del trader (RN-020)
      sigue leyendose como el lo dijo. Va aparte de RN-029 y RN-031 porque no fija detencion: prohibe
      operacion a operacion. Lo que NO cubre -deslizamiento, gap, costes y equity flotante antes de
      que un cierre se ejecute- es lo que cubre el margen. La cita sostiene lo mismo que en RN-029 y
      nada mas
    decision: ADR-0031
    complementa: [RN-029, RN-031]
    forma:
      cuando:
        cualquiera_de:
          - no_cabe_la_operacion:
              acumulador: perdida_dia_firma
              tope: firma_perdida_diaria_max
              margen: firma_margen_seguridad
              riesgo: riesgo_por_operacion
              sobre: base_calculo_riesgo
          - no_cabe_la_operacion:
              acumulador: perdida_total_firma
              tope: firma_perdida_total_max
              margen: firma_margen_seguridad
              riesgo: riesgo_por_operacion
              sobre: base_calculo_riesgo
      entonces:
        prohibe: [abrir_operacion]
    clase: gate
    estado: VIGENTE
