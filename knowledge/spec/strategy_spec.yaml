# StrategySpec: las reglas de la operativa (F11, ADR-0013). Manual, versionado; cada commit cita
# `Fuente:`.
#
# LA REGLA DE ORO: aqui no hay ni un numero de negocio. Los campos ejecutables (`cuando`,
# `entonces`, `parametros`) solo nombran parametros del registro; el valor lo pone
# `knowledge/spec/parametros.yaml`, que es la unica puerta (ADR-0002). Asi, cambiar el stop de 0,8
# a 0,75 se hace en un sitio y esta spec no se toca.
#
# `cita` es el registro de feedback o el item de evidencia que sostiene la regla, y `literal` la
# frase del trader tal cual. El literal SI puede contener cifras: son sus palabras, y un test
# comprueba que coincide con el registro que declara.
#
# Campos: id (RN-NNN), titulo, cuando (condicion), entonces (accion), parametros (los que usa),
# cita, literal, clase, estado (VIGENTE | DESCARTADA), notas y decision (opcionales).
#
# PRECEDENCIA por CLASE, no por orden del fichero (ADR-0018, 2026-09-10). El orden de este
# fichero es EDITORIAL -esta agrupado por tema, con comentarios- y usarlo como semantica daba la
# respuesta equivocada en tres pares reales: RN-006 ganaba a RN-014 y a RN-018, y RN-019 ganaba a
# RN-020, o sea que se reentraba despues de tocar el tope diario. Las clases, de mas fuerte a mas
# debil:
#
#   1. gate       prohibe o frena. Gana siempre a todo lo demas.
#   2. terminal   cierra la jornada. Gana a un disparador: en ventana_fin, cerrar manda sobre
#                 mover un stop o activar una entrada.
#   3. disparador abre, mueve o modifica.
#   4. fallback   la clausula `else`: solo si no aplica ninguna otra.
#
# Y dos reglas de la MISMA clase que actuan sobre el mismo evento son un ERROR de validacion con
# los dos ids en el mensaje, hasta que una de las dos gane su precondicion.

version_esquema: 2

reglas:
  # ---------------------------------------------------------------- marco y sesgo
  - id: RN-001
    titulo: la ventana operativa es el horario del trader, no el de las velas
    cuando: >-
      la hora de pared en huso_operativa esta en el intervalo MEDIO ABIERTO que empieza en
      ventana_inicio e incluye hasta el instante anterior a ventana_fin, en un dia de
      dias_operables
    entonces: el bot busca entradas; fuera de ese intervalo no opera
    parametros: [ventana_inicio, ventana_fin, huso_operativa, dias_operables]
    cita: fb-2026-09-09-sesion-01-8741c388
    literal: >-
      Tu operativa inicia 7AM, me dijiste, ¿no? Sí [...] Por ahora vamos a trabajarlo en esas dos
      sesiones
    notas: >-
      manda SU horario, no la rejilla. La ventana coincide con dos velas H4 completas 337 dias al
      año; los otros 28 -del 8 al 28 de marzo y del 25 al 31 de octubre, cuando la UE y EE.UU. no
      cambian la hora el mismo dia- el ancla se ve a las 22:00 y el bot empieza una hora DENTRO de
      la vela. Se decidio asi a proposito el 2026-09-10: el trader se sienta a su hora, sea cual
      sea la fecha (ADR-0017). El titulo anterior afirmaba una alineacion que no es cierta siempre
    decision: ADR-0017
    clase: gate
    estado: VIGENTE

  - id: RN-002
    titulo: al llegar el fin de la ventana se cierra lo que quede abierto
    cuando: >-
      la hora de pared en huso_operativa alcanza ventana_fin y quedan operaciones abiertas
    entonces: se cierra a mercado si cierre_forzoso_fin_ventana
    parametros: [ventana_fin, cierre_forzoso_fin_ventana, huso_operativa]
    cita: fb-2026-09-09-sesion-01-ffb528d7
    literal: la operativa se cierra a las 3pm en punto
    notas: >-
      "las 3pm" son las suyas: la hora de pared en huso_operativa, que cambia con el horario de
      verano igual que la de cualquiera (ADR-0017)
    decision: ADR-0017
    clase: terminal
    estado: VIGENTE

  - id: RN-003
    titulo: el sesgo lo fija la vela H4 previa, y solo cambia si rompe su extremo
    cuando: abre una sesion operativa
    entonces: >-
      el sesgo es el de la vela H4 previa cerrada segun sesgo_h4_regla; cambia solo si esa vela
      rompio el extremo de la anterior, y basta con la mecha; un equal no lo cambia
    parametros: [sesgo_h4_regla, anclaje_h4]
    cita: fb-2026-09-09-sesion-01-8eccf5c0
    literal: >-
      si no genera un rompimiento por encima, o sea, al menos por un pip o una milésima de pip,
      entonces seguiríamos operando bajista
    notas: >-
      el color de la vela NO decide: una vela que cierra roja pero cuya mecha rompio por encima
      deja el sesgo alcista. La rejilla H4 la fija anclaje_h4 -la medianoche del servidor- y NO
      huso_operativa: son relojes distintos y se separan 28 dias al año (ADR-0017)
    clase: disparador
    estado: VIGENTE

  # ---------------------------------------------------------------- liquidez y entrada
  - id: RN-004
    titulo: la liquidez de M15 se toma con cuerpo
    cuando: el precio alcanza el alto o el bajo de M15 marcado
    entonces: >-
      se da por tomada solo si una vela cierra con cuerpo al otro lado segun
      liquidez_m15_criterio_toma; una mecha que lo perfore no cuenta
    parametros: [liquidez_m15_criterio_toma]
    cita: fb-2026-09-09-sesion-01-6e15504f
    literal: >-
      ¿Vale con que la vela cierre con el cuerpo por encima del máximo, por debajo del mínimo,
      o vale con que la mecha lo perfore? Con cuerpo
    notas: solo en M15; en M1 el rompimiento es indiferente
    clase: disparador
    estado: VIGENTE

  - id: RN-005
    titulo: lo que ocurre al otro lado de la liquidez de M15 es ruido
    cuando: el precio se desarrolla por debajo de la liquidez de M15 en sesgo alcista, o al reves
    entonces: no hay entrada
    parametros: []
    cita: ev-v3-001600-ed45b091
    literal: >-
      yo no busco entrada aquí todo lo que se desarrolle dentro o sea por debajo de m15 [...]
      de esta liquidez de m15 es ruido
    clase: gate
    estado: VIGENTE

  - id: RN-006
    titulo: la orden limite se reubica al completarse cada zona de control
    cuando: >-
      hay una orden limite COLOCADA Y TODAVIA SIN LLENAR, y el precio rompe el extremo anterior,
      con lo que la zona de control en curso queda completada
    entonces: la orden limite se mueve a la zona recien completada segun reubicacion_cadencia
    parametros: [reubicacion_cadencia]
    cita: fb-2026-09-09-sesion-01-6b29059d
    literal: >-
      cuando ya me rompe a este nivel de aquí, entonces ya esta orden límite aquí se pasa aquí
    notas: >-
      no es por vela ni por tiempo; mientras la zona no se completa, el limite no se mueve. La
      precondicion de que la orden siga pendiente se anadio el 2026-09-10: sin ella esta regla se
      disparaba sobre EL MISMO evento que RN-014 -"se completa una zona de control"- y, con la
      operacion ya abierta, reubicaba una limite en paralelo (lo que RN-018 prohibe) en vez de
      poner el break even. El literal habla de una orden que aun no ha entrado.
      SEGUNDA CORRECCION, mismo dia: la precondicion se escribio primero como "las operaciones
      abiertas son cero", que es un PROXY FALSO -tras un stop o un break even la cuenta vuelve a
      cero y la orden limite ya no existe, porque se lleno-, y ademas metia un numero de negocio
      en un campo ejecutable. La condicion es que la orden exista y siga pendiente
    clase: disparador
    estado: VIGENTE

  - id: RN-007
    titulo: varias velas de M1 que forman un order block mayor se mapean como una estructura
    cuando: se mapea la estructura en M1
    entonces: se agrupan segun mapeo_dos_velas y el resto se trata como ruido
    parametros: [mapeo_dos_velas]
    cita: fb-2026-09-09-sesion-01-7ee9cabc
    literal: sería considerado una estructura [...] en el lenguaje del bot sería considerado una estructura
    clase: disparador
    estado: VIGENTE

  - id: RN-008
    titulo: sin ninguno de los esquemas de entrada no hay entrada
    cuando: no se da el breaker ni el otro esquema de entrada
    entonces: no se opera
    parametros: []
    cita: ev-v4-001844-93dcb658
    literal: >-
      aquí no hay entrada por el hecho de que el precio no genera el esquema de entrada que ya
      sabemos cuál es [...] cualquiera de estos dos de aquí
    clase: gate
    estado: VIGENTE

  - id: RN-009
    titulo: mas zonas de control de las admitidas invalidan el esquema
    cuando: >-
      dentro del mismo esquema se desarrollan mas zonas de control de las que admite
      zonas_control_max_por_esquema
    entonces: no se opera
    parametros: [zonas_control_max_por_esquema]
    cita: ev-v4-001909-54ac2edd
    literal: >-
      aquí no habría un trade usando este modelo aquí por el hecho de que te genera dos zonas
      de control [...] por lo general sólo buscamos uno
    clase: gate
    estado: VIGENTE

  - id: RN-010
    titulo: una entrada activada sin ruptura se gestiona como cualquier otra
    cuando: la orden se activa por un equal y la estructura no llega a romperse
    entonces: se protege y se deja correr segun salida_sin_ruptura, con el stop en su nivel
    parametros: [salida_sin_ruptura, stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-9626d3dd
    literal: >-
      se activa la entrada y apenas automáticamente [...] proteger a 0.80 [...] o continúa ya
      nos saca con menos 0.80
    clase: disparador
    estado: VIGENTE

  # ---------------------------------------------------------------- riesgo y gestion
  - id: RN-011
    titulo: el lote se dimensiona sobre la caja completa y la orden nace con su stop
    cuando: se coloca la orden limite
    entonces: >-
      el lote sale de la distancia completa segun lotaje_base y riesgo_por_operacion sobre
      base_calculo_riesgo; el stop viaja EN LA ORDEN segun stop_en_orden_pendiente, ya en
      stop_fraccion_caja, antes de que la entrada se active
    parametros:
      - lotaje_base
      - riesgo_por_operacion
      - base_calculo_riesgo
      - stop_en_orden_pendiente
      - stop_fraccion_caja
    cita: fb-2026-09-09-sesion-01-76fd91ba
    literal: el SL se pone junto a la orden limite, no cuando se apertura recien
    notas: >-
      hasta el 2026-09-10 esta regla decia que el stop "se mueve inmediatamente" tras activarse la
      entrada, citando "El primer stop loss es para el calculo del lotaje y el segundo es para
      proteccion". El trader lo corrigio, y ese es el literal de ahora. Los dos stops de la frase
      anterior son el del CALCULO -la caja completa, que dimensiona el lote- y el que
      se ESCRIBE en la orden, que ya es stop_fraccion_caja. El corpus describe lo mismo desde el
      lado del resultado -"me activa la entrada y si yo protejo a 0.80", ev-v5-000312- y por eso
      parecia un movimiento posterior. Importa en un caso concreto: un hueco de precio que
      atraviese la entrada NO puede saltar al stop de rango completo, porque ese nunca llega a
      estar vivo en el mercado
    clase: disparador
    estado: VIGENTE

  - id: RN-012
    titulo: la perdida real es menor que el riesgo nominal, y es a proposito
    cuando: el stop salta
    entonces: >-
      la perdida es riesgo_por_operacion -sobre base_calculo_riesgo- multiplicado por
      stop_fraccion_caja, porque el lote se dimensiono sobre la caja completa. Lo que se
      conserva es el resto de la caja
    parametros: [riesgo_por_operacion, base_calculo_riesgo, stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-c4922acb
    literal: >-
      La operativa se calcula con el SL normal, pero apenas de abre la operacion se mueve el SL
      hasta el nivel 0.8 para todos los modelos de entrada.
    notas: >-
      INVARIANTE, no parametro: `stop_proteccion_capital` se queda UNKNOWN a proposito para que no
      haya dos puertas para el mismo numero. Un motor que guarde el riesgo real como dato aparte
      puede desincronizarlo del stop
    complementa: [RN-011]
    clase: disparador
    estado: VIGENTE

  - id: RN-013
    titulo: hay un unico esquema de stop, y vale para cualquier esquema de entrada
    cuando: se abre la operacion, por el esquema de entrada que sea
    entonces: el stop va a stop_fraccion_caja, sea cual sea el esquema
    parametros: [stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-bc829942
    literal: tanto primero como segundo esquema de entrada en 0.80, ¿verdad? Sí
    notas: >-
      hasta el 2026-09-10 existia `stop_segundo_esquema` con el MISMO valor que
      stop_fraccion_caja: dos puertas para el mismo numero, que es lo que RN-012 prohibe
      expresamente y ADR-0002 para todo. Ahora es cierto por construccion, no por coincidencia:
      el parametro del segundo esquema queda UNKNOWN a proposito
    complementa: [RN-010, RN-011, RN-012]
    clase: disparador
    estado: VIGENTE

  - id: RN-014
    titulo: el break even se pone al romperse la zona de control posterior
    cuando: tras la entrada se desarrolla otra zona de control y el precio la rompe
    entonces: el stop pasa a la entrada, en el instante del toque segun break_even_condicion
    parametros: [break_even_condicion]
    cita: fb-2026-09-09-sesion-01-0ccafcba
    literal: yo siempre lo he estado trabajando, o sea, apenas toca
    notas: >-
      el disparador NO es un nivel de precio sino la ruptura de la zona de control que se forma
      despues de la entrada. A-13 pregunta si esa ruptura deberia exigir cuerpo
    clase: disparador
    estado: VIGENTE

  - id: RN-015
    titulo: el objetivo es fijo, se traza con la orden y no se mueve
    cuando: se abre la operacion
    entonces: >-
      el objetivo se fija en objetivo_rr sobre la distancia que declara base_calculo_objetivo,
      en el mismo instante en que se traza la orden, y no se extiende
      (objetivo_extension_activa) ni se sacan parciales (parciales)
    parametros: [objetivo_rr, base_calculo_objetivo, objetivo_extension_activa, parciales]
    cita: fb-2026-09-09-sesion-01-7fbbb2e7
    literal: Siempre se fija el 1:3, no importa en que escenario nos encontremos
    notas: >-
      la BASE del 1:3 no la dice el literal, y por eso vive en base_calculo_objetivo y no en
      esta frase (ADR-0014). El objetivo y el lote se trazan juntos sobre la caja completa;
      despues el stop se mueve a stop_fraccion_caja y el RR REALIZADO pasa a ser
      objetivo_rr / stop_fraccion_caja, no objetivo_rr. Quien mida fidelidad en F26 no debe
      leer esa diferencia como un fallo del bot: es la mecanica. ev-v4-011951 empuja al otro
      lado -el trader dice que un ganador cubre "2 o 3" perdidas, que cuadra mejor con medir
      sobre el riesgo real-, pero es una estimacion redonda hablando de margenes, no una
      descripcion del calculo; A-18 lo deja a la vista hasta ratificarlo
    clase: disparador
    estado: VIGENTE

  # ---------------------------------------------------------------- limites del dia
  - id: RN-016
    titulo: el dia se limita por cartuchos, y solo una perdida gasta uno
    cuando: se cierra la operacion
    entonces: >-
      suma al contador solo si fue perdida (cartucho_criterio); al llegar a cartuchos_max se deja
      de operar hasta cartuchos_reinicio
    parametros: [cartuchos_max, cartucho_criterio, cartuchos_reinicio]
    cita: fb-2026-09-09-sesion-01-aa2abe65
    literal: >-
      un intento no es considerado un break even, ¿vale? una entrada invalidada pues tampoco es
      considerado un intento [...] reentrada después de equal, tampoco es considerado un intento
    notas: el contador NO es diario; se reinicia con la siguiente liquidez de M15
    clase: gate
    estado: VIGENTE

  - id: RN-017
    titulo: un trade ganador no apaga el dia
    cuando: la operacion cierra en positivo
    entonces: se sigue operando, con el limite de cartuchos intacto
    parametros: [cartuchos_max]
    cita: fb-2026-09-09-sesion-01-af02495f
    literal: >-
      que siga operando, pero que respete la regla de los 3 cartuchos de perdida
    notas: >-
      corrige lo que se daba por sabido antes de la sesion: la confirmacion R-07 de la hoja,
      que apunta a ev-v4-004936-d7004417 (ver el anexo del informe de la sesion)
    clase: disparador
    estado: VIGENTE

  - id: RN-018
    titulo: no hay operaciones en paralelo
    cuando: el numero de operaciones abiertas alcanza operaciones_simultaneas_max
    entonces: no se abre ninguna mas; para reentrar hay que haber salido antes
    parametros: [operaciones_simultaneas_max]
    cita: ev-v4-003710-c753f3d3
    literal: >-
      para que tú puedas entrar nuevamente o bien te ha tocado stop loss
    notas: >-
      la cita sigue en el item hasta "con el profit ya no operas mas", pero ESA MITAD quedo
      revocada en la sesion 1 (RN-017): el trader dijo que un ganador no apaga el dia. El literal
      se corta donde sigue siendo cierto
    clase: gate
    estado: VIGENTE

  - id: RN-019
    titulo: se puede reentrar tras un equal sin gastar cartucho
    cuando: un equal cierra la operacion y el precio vuelve a dar el esquema
    entonces: se reentra segun reentrada_tras_equal, y no suma al contador
    parametros: [reentrada_tras_equal, cartucho_criterio]
    cita: fb-2026-09-09-sesion-01-060cd801
    literal: Sí, esto no gasta intentos, me dijiste, ¿no? No
    clase: disparador
    estado: VIGENTE

  - id: RN-020
    titulo: el tope porcentual es el unico freno del dia
    cuando: >-
      la perdida acumulada desde el corte que marca reloj_dia_riesgo alcanza perdida_maxima_diaria
      sobre base_calculo_perdida_diaria, o perdida_maxima_semanal sobre
      base_calculo_perdida_semanal
    entonces: se deja de operar hasta el corte siguiente
    parametros:
      - perdida_maxima_diaria
      - base_calculo_perdida_diaria
      - perdida_maxima_semanal
      - base_calculo_perdida_semanal
      - reloj_dia_riesgo
    cita: fb-2026-09-09-sesion-01-bff260ea
    literal: >-
      De la cuenta basado en el saldo, y que sea en el saldo inicial del día
    notas: >-
      OJO a la aritmetica, corregida en la auditoria del 2026-09-09: agotar los cartuchos cuesta
      tres perdidas, pero el contador NO es diario -se reinicia con la siguiente liquidez de M15
      (cartuchos_reinicio)-, asi que no hay cota diaria por esa via: son tres perdidas POR ZONA, y
      nada limita cuantas zonas se desarrollan entre la apertura y el cierre de la ventana. El
      tope porcentual no es una red que nunca se toca: es el unico freno del dia que existe, y el
      titulo de esta regla decia lo contrario hasta la auditoria del 2026-09-10. Las dos bases NO
      son la misma -el dia sobre el saldo inicial del dia, la semana sobre el saldo actual, que es
      lo que dijo el trader en cada caso- y el corte lo marca reloj_dia_riesgo, que sigue siendo
      un default nuestro (A-19)
    decision: ADR-0015
    clase: gate
    estado: VIGENTE

  - id: RN-021
    titulo: se opera durante las noticias y sin tope de spread
    cuando: hay una noticia de alto impacto o el spread se ensancha
    entonces: no se filtra (filtro_noticias, filtro_spread)
    parametros: [filtro_noticias, filtro_spread]
    cita: fb-2026-09-09-sesion-01-3565552d
    literal: >-
      a mí me es indiferente si hay noticia o no [...] Sí, incluimos noticias
    notas: >-
      A-17: el propio trader avisa de que la cuenta de fondeo puede prohibirlo y cerrar la cuenta
      aunque se acabe en profit. Verificar antes de operar en real
    clase: disparador
    estado: VIGENTE

  - id: RN-022
    titulo: cuando la situacion no encaja, el bot se abstiene
    cuando: no se cumple ninguna regla de entrada
    entonces: no se opera (comportamiento_sin_regla)
    parametros: [comportamiento_sin_regla]
    cita: fb-2026-09-09-sesion-01-c698bc6a
    literal: Que sea fiel a la operativa y no busque nada adicional.
    clase: fallback
    estado: VIGENTE

  # ---------------------------------------------------------------- reglas descartadas
  - id: RN-023
    titulo: no hay colchon de spread separado del stop
    cuando: se coloca el stop
    entonces: >-
      no se suma ningun margen; el nivel del stop ya lo incorpora
    parametros: [stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-08761847
    literal: Por temas de Spread ... se reduce al 0.8
    notas: >-
      por eso `stop_colchon_spread` se queda UNKNOWN. Cierra A-10. La contradiccion mecanica
      `stop.nivel` sigue ABIERTA a proposito: los items que dicen 0,75 son citas ciertas de lo que
      el trader hacia antes, y cerrarla exige superseder esos items (F06/F07), no una regla
    clase: disparador
    estado: DESCARTADA

  - id: RN-024
    titulo: no se baja la proteccion segun el porcentaje de vela transcurrido
    cuando: pasa buena parte de la vela sin que el precio avance
    entonces: >-
      no se hace nada; el stop se queda donde esta
    parametros: []
    cita: fb-2026-09-09-sesion-01-728b68da
    literal: Descartar esto, se mantiene el SL fijo de 0.8
    notas: >-
      cierra A-12 y con ella la duda del 40 % / 50 % que arrastraba el corpus. `stop_reduccion_*`
      se quedan UNKNOWN
    clase: disparador
    estado: DESCARTADA

  - id: RN-025
    titulo: el tercer esquema de entrada queda fuera de la primera version
    cuando: el precio permite anticiparse al segundo esquema
    entonces: no se entra
    parametros: []
    cita: ev-v4-013008-73dcd8c3
    literal: >-
      solo sería agregar un modelo de entrada más, o sea, no un modelo, sino un esquema de
      entrada más [...] antes que se desarrolle esta zona de control pues operar
    notas: >-
      lo explico en v6 entre 0:41:00 y 0:50:11, tramo declarado fuera de la operativa por ambos y
      no citable (knowledge/corpus/tramos_no_citables.yaml)
    clase: gate
    estado: DESCARTADA

  - id: RN-026
    titulo: si el broker no admite el stop donde toca, el bot se abstiene
    cuando: >-
      el stop o el limite que pide la spec queda mas cerca del precio que instrumento_stops_level
    entonces: >-
      no se abre la operacion; nunca se aproxima el nivel al minimo que el broker admite
    parametros: [instrumento_stops_level, comportamiento_sin_regla]
    cita: fb-2026-09-09-sesion-01-c698bc6a
    literal: Que sea fiel a la operativa y no busque nada adicional.
    notas: >-
      la decision explicita que pide MASTER_PLAN H.2: rechazo por stops level = abstencion. Mover
      el stop a donde el broker lo admite seria operar OTRA estrategia con el nombre de esta, y el
      trader pidio fidelidad, no aproximacion. La cita sostiene el PRINCIPIO -ser fiel y no buscar
      nada adicional-, no esta regla: el trader nunca hablo del stops level. Lo que la regla decide
      lo decide ADR-0016. OJO: instrumento_stops_level vale 0 en la demo medida, asi que hoy esta
      regla no llega a activarse; hay que volver a medirlo en la cuenta fondeada
    decision: ADR-0016
    clase: gate
    estado: VIGENTE

  - id: RN-027
