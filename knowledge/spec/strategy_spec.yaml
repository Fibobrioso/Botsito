# StrategySpec: las reglas de la operativa (F11, ADR-0013). Manual, versionado; cada commit cita
# `Fuente:`.
#
# LA REGLA DE ORO: aqui no hay ni un numero de negocio. Los campos ejecutables (`cuando`,
# `entonces`, `parametros`) solo nombran parametros del registro; el valor lo pone
# `knowledge/spec/parametros.yaml`, que es la unica puerta (ADR-0002). Asi, cambiar el stop de 0,8
# a 0,75 se hace en un sitio y esta spec no se toca.
#
# `cita` es el registro de feedback o el item de evidencia que sostiene la regla, y `literal` la
# frase TAL CUAL del registro citado. Normalmente es del trader; cuando el registro dice en su
# `registrado_por` que la refiere el consultor -pasa desde el 2026-09-11 en RN-012, RN-027 y el
# predicado `no_es_multiplo_de`, que citan fb-...-17ed6193-, la regla declara ademas `decision`.
# El literal SI puede contener cifras: son las palabras de quien las dijo, y un test comprueba que
# coincide con el registro que declara.
#
# Campos: id (RN-NNN), titulo, cuando (condicion), entonces (accion), parametros (los que usa),
# cita, literal, clase, estado (VIGENTE | DESCARTADA), notas y decision (opcionales).
#
# PRECEDENCIA por CLASE, no por orden del fichero (ADR-0018, 2026-09-10). El orden de este
# fichero es EDITORIAL -esta agrupado por tema, con comentarios- y usarlo como semantica daba la
# respuesta equivocada en tres pares reales: RN-006 ganaba a RN-014 y a RN-018, y RN-019 ganaba a
# RN-020, o sea que se reentraba despues de tocar el tope diario. Las clases, de mas fuerte a mas
# debil:
#
#   1. gate       prohibe o frena. Gana siempre a todo lo demas.
#   2. terminal   cierra la jornada. Gana a un disparador: en ventana_fin, cerrar manda sobre
#                 mover un stop o activar una entrada.
#   3. disparador abre, mueve o modifica.
#   4. fallback   la clausula `else`: solo si no aplica ninguna otra.
#
# Y dos reglas de la MISMA clase que actuan sobre el mismo evento son un ERROR de validacion con
# los dos ids en el mensaje, hasta que una de las dos gane su precondicion.

version_esquema: 3

# ---------------------------------------------------------------------------------------------
# FORMA EJECUTABLE (F12, ADR-0019). PILOTO: solo cuatro reglas la llevan todavia -RN-003, RN-006,
# RN-014 y RN-020, las cuatro mas dificiles-. Las demas siguen en prosa y `spec status` dice
# cuantas faltan. Si la forma no aguanta estas cuatro, se cambia habiendo gastado cuatro y no
# veinticuatro.
#
# Un predicado NO lleva valores: lleva argumentos, y todo argumento de valor es el NOMBRE de un
# parametro del registro. El ejemplo que se descarto -`cierra_con_cuerpo_al_otro_lado`- horneaba
# el valor `cuerpo` en el nombre, y ese parametro admite tambien `mecha`: dos puertas para el
# mismo hecho (ADR-0002).

predicados:
  rompe:
    descripcion: el sujeto supera el extremo de la referencia, con el criterio declarado
    argumentos: [que, contra, criterio]
    fuente: mercado
    cita: fb-2026-09-09-sesion-01-8eccf5c0
    literal: >-
      si no genera un rompimiento por encima, o sea, al menos por un pip o una milésima de pip,
      entonces seguiríamos operando bajista
  se_completa_zona_de_control:
    descripcion: el precio rompe el punto extremo anterior y deja la zona cerrada
    argumentos: [criterio]
    fuente: mercado
    cita: fb-2026-09-09-sesion-01-a456bc3f
    literal: >-
      como sé que una zona de control se ha completado, cuando apenas me generó un rompimiento
      [...] rompe el punto alto anterior con mecha, con mecha no importa
  abre_sesion_operativa:
    descripcion: empieza una de las sesiones de la ventana
    argumentos: []
    fuente: reloj
    cita: fb-2026-09-09-sesion-01-8741c388
    literal: >-
      Tu operativa inicia 7AM, me dijiste, ¿no? Sí [...] Por ahora vamos a trabajarlo en esas dos
      sesiones
  operaciones_abiertas_alcanzan:
    descripcion: el numero de posiciones vivas llega al tope declarado
    argumentos: [tope]
    fuente: broker
    lo_provoca: [colocar_orden_limite]
    cita: ev-v4-003710-c753f3d3
    literal: >-
      ya la respuesta es no o sea, por el hecho de que para que tú puedas entrar nuevamente o
      bien te ha tocado stop loss
  alcanza_tope:
    descripcion: un acumulador llega al tope declarado
    argumentos: [acumulador, tope]
    fuente: acumulador
    cita: fb-2026-09-09-sesion-01-bff260ea
    literal: >-
      De la cuenta basado en el saldo, y que sea en el saldo inicial del día

  en_ventana:
    descripcion: la hora de pared cae en el intervalo medio abierto [inicio, fin)
    argumentos: [inicio, fin, huso, dias]
    fuente: reloj
    cita: fb-2026-09-09-sesion-01-8741c388
    literal: >-
      Tu operativa inicia 7AM, me dijiste, ¿no? Sí [...] Por ahora vamos a trabajarlo en esas dos
      sesiones
  alcanza_hora:
    descripcion: la hora de pared llega al instante declarado
    argumentos: [hora, huso]
    fuente: reloj
    cita: fb-2026-09-09-sesion-01-ffb528d7
    literal: la operativa se cierra a las 3pm en punto
  alcanza_nivel:
    descripcion: el precio llega al nivel marcado
    argumentos: [que]
    fuente: mercado
    cita: ev-v3-001600-ed45b091
    literal: >-
      yo no busco entrada aquí todo lo que se desarrolle dentro o sea por debajo de m15 [...]
      de esta liquidez de m15 es ruido
  cruza:
    descripcion: el precio pasa al otro lado del nivel con el criterio declarado
    argumentos: [que, criterio]
    fuente: mercado
    cita: fb-2026-09-09-sesion-01-6e15504f
    literal: >-
      ¿Vale con que la vela cierre con el cuerpo por encima del máximo, por debajo del mínimo,
      o vale con que la mecha lo perfore? Con cuerpo
  se_desarrolla_en_el_lado_de_ruido:
    # Hasta el 2026-09-16 se llamaba `esta_al_otro_lado_de` y decia "el precio se desarrolla del
    # lado contrario al sesgo", que es justo la frase cuya traduccion a un lado concreto dependia
    # de quien la leyera, y se tradujo AL REVES: RN-005 prohibia abrir por debajo en sesgo alcista,
    # que es donde el trader opera (auditoria del 2026-09-13, hallazgo [2]). Ahora el lado se nombra
    # en `lado_de_ruido` y la traduccion no depende de nadie.
    descripcion: >-
      el precio se desarrolla en el lado de la liquidez de M15 donde el trader NO busca entrada: por
      encima si el sesgo es alcista, por debajo si es bajista. Su operativa esta en el otro: por
      debajo en alcista (ev-v1-001306, v1 0:13:06) y por encima en bajista (ev-v3-001725, v3 0:17:25,
      sobre un ejemplo cuyo sesgo H4 es bajista por el contexto de 0:15:08, no por la frase citada).
      Que en alcista lo de ENCIMA sea ruido es simetria del ejemplo bajista, no una frase del trader
    argumentos: [que, sentido]
    lado_de_ruido: {alcista: por_encima, bajista: por_debajo}
    fuente: mercado
    cita: ev-v1-001306-f98e12e9
    literal: >-
      el precio puede o bien continuar o bien puede hacer lo que quiera, no me importa nuestra
      operativa tiene que estar por debajo
  se_mapea_estructura:
    descripcion: varias velas de M1 se agrupan como una estructura
    argumentos: [criterio]
    fuente: motor
    cita: fb-2026-09-09-sesion-01-7ee9cabc
    literal: sería considerado una estructura [...] en el lenguaje del bot sería considerado una estructura
  se_da_esquema:
    descripcion: >-
      el precio forma uno de los dos esquemas de entrada en M1, con la liquidez de M15 ya tomada.
      `primer_esquema`: rompe directamente, sin retroceso, y el breaker basta.
      `segundo_esquema`: pequeno retroceso que deja una zona de control, y despues rompe. Los dos
      marcan el bloque de origen con el breaker (BOS); el CHoCH no se usa. En M1 la ruptura vale
      con mecha o con cuerpo; la de M15 tiene que ser con cuerpo (RN-004)
    argumentos: [cual]
    valores: {cual: [primer_esquema, segundo_esquema, cualquier_esquema]}
    fuente: mercado
    depende_de: [liquidez_tomada]
    cita: ev-v4-000243-5f8875ce
    literal: >-
      ya recordamos los dos esquemas que era uno, o bien me hace esto de aquí, rompe o bien
      directamente rompe el precio como tal o sea sólo con velas rojas y si hace el otro esquema
      pues con un pequeño retroceso pequeña zona de control y luego rompe
  zonas_desarrolladas_superan:
    descripcion: el esquema desarrolla mas zonas de control de las admitidas
    argumentos: [tope]
    fuente: mercado
    cita: fb-2026-09-09-sesion-01-1b2203b0
    literal: solo 1 zona control bro. si hay 2 se descarta
    notas: >-
      citaba `ev-v4-001909-54ac2edd`, que describe el caso pero remata con una tendencia -"por lo
      general solo buscamos uno"- y de ahi salio A-20. El trader la cerro en duro el 2026-09-11 y
      el predicado cita lo mismo que RN-009; la evidencia vieja se queda en A-20
  se_activa_entrada:
    descripcion: >-
      la orden limite se llena. `por` dice COMO se activo: por uno de los dos esquemas, o sin que la
      estructura llegara a romperse (`activacion_sin_ruptura`, lo que el trader acaba llamando
      cerrar un equal cuando el precio forma el equal y lo saca)
    argumentos: [por]
    valores:
      por: [primer_esquema, segundo_esquema, cualquier_esquema, activacion_sin_ruptura]
    fuente: broker
    lo_provoca: [colocar_orden_limite]
    cita: fb-2026-09-09-sesion-01-9626d3dd
    literal: >-
      se activa la entrada y apenas automáticamente [...] proteger a 0.80 [...] o continúa ya
      nos saca con menos 0.80
  toca_colocar_orden_limite:
    # Sustituye a `se_coloca_orden_limite`, que era un evento DEL BOT que ninguna accion producia:
    # leida al pie de la letra, la jornada daba cero colocaciones (auditoria del 2026-09-13). Ahora
    # la colocacion es una accion (`colocar_orden_limite`, RN-015) y esto es la condicion de mercado
    # que la dispara. CUAL es esa condicion no esta cerrado en el corpus: A-29.
    descripcion: >-
      llega el momento de colocar la orden limite en una zona de control, segun `momento`
      (orden_limite_nace): `al_darse_el_esquema`, cuando se da uno de los dos esquemas de entrada
      (se_da_esquema) y la orden se marca en su bloque de origen; o `al_tomarse_la_liquidez`, cuando
      la liquidez de M15 ya esta tomada y se completa la primera zona de control en M1, desde la que
      RN-006 la ira moviendo. Ata la zona con `liga`
    argumentos: [momento]
    fuente: mercado
    depende_de: [liquidez_tomada]
    cita: ev-v3-004201-bfeb3734
    literal: >-
      Yo no espero ningún retroceso, si se han dado cuenta. Con el breaker ya me basta [...] apenas
      el breaker, o sea, marco mi orden limit y ya está
  salta_stop:
    descripcion: el precio alcanza el stop y cierra la posicion en perdida
    argumentos: []
    fuente: broker
    lo_provoca: [colocar_orden_limite]
    cita: fb-2026-09-09-sesion-01-c4922acb
    literal: >-
      La operativa se calcula con el SL normal, pero apenas de abre la operacion se mueve el SL
      hasta el nivel 0.8 para todos los modelos de entrada.
    notas: >-
      LO QUE LA CITA SOSTIENE y lo que no: sostiene que hay un stop y en que nivel vive, no el
      EVENTO de que el precio lo alcance, que es mecanico y el trader nunca describio. Y su frase
      es del mundo anterior al 2026-09-10: dice que el SL "se mueve" al abrir, y A-11 cerro que
      viaja en la orden limite desde el principio (RN-011). Se conserva porque es lo que el trader
      dijo en la sesion y es el registro que fija el nivel; queda declarado para que nadie lo lea
      como la mecanica vigente
  se_cierra_operacion:
    # `resultado` admitia `ganancia | perdida | equal`, y `equal` nombraba a la vez un resultado, una
    # geometria y una forma de activarse. El caso que el trader describe -se activa sin romper, forma
    # un equal y "te genera una perdida" (v6 1:23:13-1:23:19)- cerraba como `perdida`: RN-016
    # gastaba cartucho y RN-019 no disparaba, contra el literal de abajo. Ahora el resultado se
    # clasifica por MECANISMO y COMO se activo la operacion viaja aparte, en `por`.
    descripcion: >-
      la posicion deja de estar viva. `resultado`: `break_even` si salta el stop que RN-014 llevo a
      la entrada, sea cual sea el P/L neto de costes; `ganancia` o `perdida` en cualquier otro
      cierre, por su signo. `por`: como se activo la operacion que se cierra (ver se_activa_entrada)
    argumentos: [resultado, por]
    valores:
      resultado: [ganancia, perdida, break_even, cualquier_resultado]
      por: [primer_esquema, segundo_esquema, cualquier_esquema, activacion_sin_ruptura, cualquier_activacion]
    fuente: broker
    lo_provoca: [colocar_orden_limite]
    cita: fb-2026-09-09-sesion-01-aa2abe65
    literal: >-
      un intento no es considerado un break even, ¿vale? una entrada invalidada pues tampoco es
      considerado un intento [...] reentrada después de equal, tampoco es considerado un intento
  contexto_filtrable:
    # Declaraba tambien `noticias` hasta el 2026-09-12. ADR-0022 partio RN-021 y se las llevo a
    # RN-028, pero el argumento se quedo aqui, declarado y sin que nadie lo pasara: lo encontro la
    # guardia de argumentos QUE FALTAN, que nacio en la auditoria de cierre de F13. La cita se
    # conserva entera porque sigue sosteniendo lo que esta regla dice: el trader no filtra nada.
    descripcion: el spread se ensancha por encima de lo tolerable
    argumentos: [spread]
    fuente: mercado
    cita: fb-2026-09-09-sesion-01-3565552d
    literal: >-
      a mí me es indiferente si hay noticia o no [...] Sí, incluimos noticias
  ninguna_regla_de_entrada_aplica:
    descripcion: la situacion no encaja en ningun esquema
    argumentos: []
    fuente: motor
    cita: fb-2026-09-09-sesion-01-c698bc6a
    literal: Que sea fiel a la operativa y no busque nada adicional.
  distancia_menor_que:
    descripcion: >-
      el nivel que pide la spec queda mas cerca del precio que el minimo del broker; el minimo viene
      en puntos y `digitos` lo traduce a precio
    argumentos: [que, tope, digitos]
    fuente: bot
    lo_provoca: [escribir_stop_en_la_orden, fijar_objetivo]
    cita: fb-2026-09-09-sesion-01-c698bc6a
    literal: Que sea fiel a la operativa y no busque nada adicional.
  no_es_multiplo_de:
    descripcion: el lote calculado no cae en el escalon del broker
    argumentos: [que, paso]
    fuente: bot
    lo_provoca: [dimensionar_lote]
    cita: fb-2026-09-09-sesion-01-17ed6193
    literal: >-
      el 0.5% de riesgo de la cuenta se calcula sobre el nivel 0.8 de la cuenta, ese es el
      acuerdo final
  # Los dos del freno de la firma (ADR-0031). Sin cita: no los dijo el trader, los decide el ADR, y
  # las reglas que los usan declaran `decision`.
  se_acerca_al_limite:
    descripcion: >-
      el acumulador llega al tope menos el margen: el limite de la firma deja de ser el sitio donde
      se frena, porque llegar a el ya es la infraccion
    argumentos: [acumulador, tope, margen]
    fuente: acumulador
  no_cabe_la_operacion:
    descripcion: >-
      el acumulador, sumandole el riesgo de la operacion que se va a abrir (riesgo sobre su base),
      llega al tope menos el margen. Es la lectura PROSPECTIVA: `alcanza_tope` se comprueba antes
      de abrir y no descuenta la operacion que se abre, por eso un tope se rebasa por construccion
    argumentos: [acumulador, tope, margen, riesgo, sobre]
    fuente: acumulador

# Lo que una regla HACE. Separado de los predicados a proposito: un predicado se EVALUA y una
# accion se EJECUTA, y confundirlos fue lo que la guardia encontro al escribir las veinte reglas
# restantes. Cada accion declara sus argumentos igual que un predicado, y el motor de F22-F23
# implementa esta lista y ninguna otra.
acciones:
  fijar:
    descripcion: establece un hecho de estado
    argumentos: [hecho, a]
  cerrar_a_mercado:
    descripcion: cierra la posicion al precio de mercado
    argumentos: [de, si]
  reubicar_orden_limite:
    descripcion: mueve la orden pendiente a otra zona
    argumentos: [a, cadencia]
  mover_stop:
    descripcion: cambia el nivel del stop de una posicion viva
    argumentos: [de, a, cuando]
  agrupar_estructura:
    descripcion: mapea como una sola estructura las velas de M1 que forman un order block mayor
    argumentos: [criterio]
  dimensionar_lote:
    descripcion: calcula el lote a partir del riesgo y la distancia declarada
    argumentos: [base, riesgo, sobre]
  escribir_stop_en_la_orden:
    descripcion: escribe el stop en la orden que se va a colocar, antes de enviarla (RN-011)
    argumentos: [donde, nivel]
  fijar_objetivo:
    descripcion: escribe el objetivo en la orden que se va a colocar, antes de enviarla (RN-015)
    argumentos: [multiplo, sobre, extension, parciales]
  colocar_orden_limite:
    # Hasta el 2026-09-16 no existia: ninguna de las acciones colocaba una orden, y la unica que lo
    # hacia -`reentrar`- presuponia una colocacion anterior que nadie hacia. Lleva `efecto`: un gate
    # que prohibe `abrir_operacion` la frena en el instante de ejecutarla, con lo que las acciones
    # anteriores de la misma regla ya escribieron (ADR-0032).
    descripcion: >-
      envia al broker la orden limite en la zona `en`, con el lote (ya redondeado por RN-027), el stop
      (RN-011) y el objetivo (RN-015) escritos. Es lo que hace verdaderos `orden_limite_pendiente` y,
      al llenarse, `operacion_abierta`
    argumentos: [en]
    efecto: abrir_operacion
    cita: ev-v3-004201-bfeb3734
    literal: >-
      Yo no espero ningún retroceso, si se han dado cuenta. Con el breaker ya me basta [...] apenas
      el breaker, o sea, marco mi orden limit y ya está
  retirar_orden_limite:
    descripcion: >-
      cancela en el broker la orden limite pendiente `de`. DECLARADA Y SIN REGLA que la use: que se
      hace con una orden pendiente al llegar ventana_fin no lo dice el corpus ni lo cerraba ninguna
      ambiguedad (A-30). No se supone
    argumentos: [de]
  realizar_perdida:
    descripcion: contabiliza la perdida efectiva cuando el stop salta
    argumentos: [riesgo, sobre]
  gestionar_salida:
    descripcion: protege y deja correr una entrada que no rompio
    argumentos: [segun, stop]
  reentrar:
    descripcion: >-
      habilita volver a entrar tras cerrar una operacion activada sin ruptura, sin sumar al
      contador. NO envia nada por si misma: la orden se vuelve a colocar por la via de todas
      (RN-011 y RN-015), con su lote, su stop, su objetivo y los gates delante. Hasta el 2026-09-16
      decia "vuelve a colocar la orden", y habria sido una segunda puerta al broker sin ninguno de
      los tres ni ventana para los gates
    argumentos: [segun, cuenta_como]
  redondear_lote:
    descripcion: ajusta el lote al escalon del broker
    argumentos: [a_la_baja, paso, minimo, contrato]
  abstenerse:
    descripcion: no operar, sin aproximar ni buscar nada adicional
    argumentos: [segun]

# Las palabras del lenguaje ejecutable que NO son parametros ni ligaduras: sujetos de geometria,
# estados, resultados y los campos de la operacion en curso. Nacen en la auditoria de cierre de
# F13 porque hasta entonces no estaban declaradas EN NINGUNA PARTE: `_ESTRUCTURALES` era una lista
# de CLAVES de argumento -`que`, `a`, `por`, `resultado`...- y el valor que llevaran no se
# contrastaba con nada, asi que `que: cuerpo` valia lo mismo que `que: liquidez_m15`. Era la mitad
# que quedo abierta al invertir `_ARGS_DE_VALOR`, y estaba declarada como deuda en el codigo.
#
# Un token NO lleva numero ni admite alternativas de negocio: si una casilla puede valer una cosa
# u otra segun lo que diga el trader, eso es un PARAMETRO del registro y no un token (ADR-0002).
tokens:
  OP:
    descripcion: la operacion en curso; sus campos se nombran con punto (`OP.precio_entrada`)
  precio_entrada:
    descripcion: campo de OP, el precio al que se lleno la orden
  instante_entrada:
    descripcion: campo de OP, el momento en que se lleno la orden
  zona_de_entrada:
    descripcion: campo de OP, la zona de control desde la que se entro
  "si":
    descripcion: enciende un hecho de estado (`fijar`) o activa una opcion de una accion
  "no":
    descripcion: >-
      apaga un hecho de estado. Va ENTRECOMILLADO en el YAML a proposito: sin comillas, `no` es el
      booleano falso de YAML 1.1 mientras que `si` es una cadena, y la misma casilla de la misma
      regla acababa con dos tipos distintos (RN-013, encontrado el 2026-09-12)
  sentido_de_la_ruptura:
    descripcion: el lado hacia el que rompio la referencia; es lo que fija el hecho `sesgo`
  # `alcista` y `bajista` NO son tokens a proposito: si lo fueran, `sentido: alcista` volveria a
  # pasar la guardia de argumentos, que es justo la puerta que la auditoria de F13 cerro. Solo viven
  # como claves de `lado_de_ruido`, contra una lista fija del codigo.
  por_encima:
    descripcion: el lado de un nivel que queda por encima del precio
  por_debajo:
    descripcion: el lado de un nivel que queda por debajo del precio
  hasta_cartuchos_reinicio:
    descripcion: la detencion dura hasta el reinicio que diga `cartuchos_reinicio`
    clase: duracion
  hasta_el_corte_siguiente:
    descripcion: la detencion dura hasta el siguiente corte del dia o de la semana de riesgo
    clase: duracion
  permanente:
    descripcion: >-
      la detencion no caduca: ningun corte de dia ni de semana la levanta. Es la del limite TOTAL
      de la firma, cuya infraccion pierde la cuenta (RN-031, ADR-0026)
    clase: duracion
  nunca:
    descripcion: >-
      el acumulador no se reinicia. Nace el 2026-09-16 para `perdida_total_firma`, que ponia en
      `reinicia_con` un parametro booleano -firma_perdida_total_arrastra- donde los demas llevan un
      reloj o un evento
    clase: reinicio
  extremo_de_la_h4_anterior:
    descripcion: el maximo o el minimo de la vela H4 previa, segun el sentido
  vela_h4_previa:
    descripcion: la vela H4 cerrada inmediatamente anterior al anclaje
  liquidez_m15:
    descripcion: la liquidez marcada en M15 que hay que tomar antes de mirar M1
  lote_calculado:
    descripcion: el lote que acaba de calcular `dimensionar_lote`, antes de redondear
  stop_o_limite:
    descripcion: el nivel al que llega el precio, sea el stop o el objetivo
  primer_esquema:
    descripcion: el primer esquema de entrada
  segundo_esquema:
    descripcion: el segundo esquema de entrada
  cualquier_esquema:
    descripcion: >-
      cualquiera de los dos esquemas de entrada, sin distinguirlos. NO incluye una activacion sin
      ruptura, que no es un esquema
  activacion_sin_ruptura:
    # `equal` era un token con TRES significados -resultado de cierre, geometria del glosario y
    # causa de activacion- y ninguno de los tres sitios que lo usaban hablaba de lo mismo (auditoria
    # del 2026-09-13, hallazgos [10] y [11]). `equal` se queda en el glosario como geometria; aqui
    # quedan sus otros dos sentidos, con nombres que no se pueden confundir.
    descripcion: >-
      la orden se lleno sin que la estructura llegara a romperse (RN-010, A-3). Si despues el precio
      forma un equal y saca la posicion, es lo que el trader llama cerrar un equal (RN-019)
  cualquier_activacion:
    descripcion: cualquier forma de activarse, por un esquema o sin ruptura
  ganancia:
    descripcion: la operacion cerro en positivo, por cualquier via que no sea el break even
  perdida:
    descripcion: la operacion cerro en negativo, por cualquier via que no sea el break even
  break_even:
    descripcion: >-
      salto el stop que RN-014 llevo a la entrada. Se clasifica por MECANISMO, no por el P/L neto:
      con comisiones o deslizamiento cierra unos dolares en negativo y sigue siendo un break even,
      que no gasta cartucho (cartucho_criterio)
  cualquier_resultado:
    descripcion: cualquier resultado de cierre

# Estado del bot, no geometria del mercado. Cada hecho dice QUIEN lo produce y QUIEN lo consume:
# un hecho que nadie consume es una regla que no sirve para nada, y uno que nadie produce es una
# regla inalcanzable. La prosa no permitia ver ninguna de las dos cosas.
# Lo que una regla PERMITE o PROHIBE. No son acciones -nadie las "ejecuta"- sino capacidades con
# nombre, y hasta la auditoria de cierre de F12 no se comprobaban contra nada: `abrir_operacionn`
# con una ene de mas pasaba en once de las veinticuatro reglas vigentes.
efectos:
  abrir_operacion:
    descripcion: colocar una orden o abrir una posicion nueva
  buscar_entradas:
    descripcion: mirar M1 en busca de un esquema de entrada

hechos:
  # `origen` (ADR-0032): `regla` -lo fija una forma, y `produce` se compara con las formas- o
  # `broker` -lo lee el motor del estado de ordenes y posiciones (ADR-0028 §5)-. Uno de origen
  # broker NO lleva `produce`: ninguna forma puede fijarlo, y `lo_provoca` dice que accion lo hace
  # verdadero, para que sus consumidores no queden inalcanzables en silencio. `valores`: con que se
  # puede fijar.
  sesgo:
    descripcion: el sentido en el que se busca entrada
    origen: regla
    valores: [sentido_de_la_ruptura]
    produce: [RN-003]
    # RN-003 lo PRODUCE, no lo consume. Declaraba las dos cosas y colaba porque la guardia casaba
    # por subcadena: el `cuando` de RN-003 contiene `sesgo_h4_criterio_ruptura` (2026-09-11)
    consume: [RN-005]
  orden_limite_pendiente:
    descripcion: hay una orden colocada y todavia sin llenar
    # Lo fijaban RN-011 y RN-013 hasta el 2026-09-16, contra ADR-0028 §5: una copia del broker que
    # la auditoria del 2026-09-13 midio desincronizada.
    origen: broker
    decision: ADR-0028
    lo_provoca: [colocar_orden_limite]
    consume: [RN-006, RN-011]
  operacion_abierta:
    descripcion: hay una posicion viva
    # Lo fijaban RN-010 y RN-013: al final de una jornada el estado decia `operacion_abierta: si`
    # con la posicion ya cerrada (auditoria del 2026-09-13).
    origen: broker
    decision: ADR-0028
    lo_provoca: [colocar_orden_limite]
    consume: [RN-002, RN-011, RN-014, RN-030]
  orden_dimensionada:
    descripcion: >-
      la orden limite ya tiene lote y stop (RN-011) y espera su objetivo y su envio (RN-015). Guarda
      la ZONA en la que se va a colocar. Existe porque ADR-0028 no ordena dos reglas de la misma
      clase dentro de un evento: sin este hecho, la que coloca podia disparar antes que la que
      dimensiona, y entre las dos tienen que pasar los gates (RN-027 redondea el lote). RN-015 lo
      apaga aunque un gate prohiba colocar, asi que nunca sobrevive al evento (ADR-0032)
    origen: regla
    produce: [RN-011, RN-015]
    consume: [RN-015]
  detenido_por_tope:
    descripcion: >-
      un tope porcentual esta alcanzado -el diario o el semanal del trader (RN-020), o el diario de
      la firma (RN-029)- y no se abre hasta el corte siguiente. Es un HECHO que dura, no un instante:
      sin el, la prohibicion solo valia en el tick del evento y nada impedia abrir en el siguiente.
      Lo leen RN-001, que es el gate maestro, y las dos reglas que lo fijan. El limite TOTAL de la
      firma ya no lo fija: su detencion no caduca y va en `detenido_por_tope_total`
    origen: regla
    valores: [hasta_el_corte_siguiente]
    produce: [RN-020, RN-029]
    consume: [RN-001, RN-020, RN-029]
  detenido_por_tope_total:
    descripcion: >-
      el limite TOTAL de la firma esta alcanzado (RN-031): la cuenta esta perdida y ningun corte la
      devuelve. Hasta el 2026-09-16 lo fijaba RN-029 en `detenido_por_tope` con
      `hasta_el_corte_siguiente`, y funcionaba por accidente -tras el corte la regla volvia a
      disparar porque el acumulador no se reinicia-. Va en un hecho aparte y no como otro valor del
      mismo: RN-020 y RN-029 leen `detenido_por_tope` sin mirar su valor y lo reescriben en cada
      evento, asi que machacarian el permanente
    origen: regla
    valores: [permanente]
    produce: [RN-031]
    consume: [RN-001, RN-031]
  detenido_por_cartuchos:
    descripcion: >-
      los cartuchos estan agotados y no se opera hasta cartuchos_reinicio. Va aparte del tope
      porque su reinicio es OTRO: la siguiente liquidez de M15, no el corte del dia
    origen: regla
    valores: [hasta_cartuchos_reinicio]
    produce: [RN-016]
    consume: [RN-001, RN-016]
  liquidez_tomada:
    descripcion: >-
      la liquidez de M15 marcada ya se ha tomado con cuerpo (RN-004). Es la PRECONDICION de los
      dos esquemas de entrada y de colocar la orden: sin ella no se mira M1. Hasta el 2026-09-11 esta
      condicion vivia solo en la prosa de `se_da_esquema`, y RN-004 fijaba un hecho que ninguna forma
      leia: un motor que implementara `forma` habria entrado sin esperar la toma. Lo consumen los
      predicados `se_da_esquema` y `toca_colocar_orden_limite` (`depende_de`), no una regla
    origen: regla
    valores: ["si"]
    produce: [RN-004]
    consume: [predicado se_da_esquema, predicado toca_colocar_orden_limite]

# Lo que se suma o se cuenta, con su BASE y su REINICIO explicitos. Sin esto, que agotar los
# cartuchos NO acote el dia -porque su reinicio no es diario- solo se puede descubrir leyendo
# parrafos, que es como se descubrio: a mano, el 2026-09-09.
#
# `reinicia_con` admite un token de clase `reinicio` o un parametro enum, nunca un booleano ni una
# cifra. `magnitud` dice QUE se vigila -saldo o equity- y `arrastra` si la base sigue al maximo
# alcanzado: las dos vivian solo en la prosa de los de la firma, y un motor fiel a la forma podia
# evaluar el limite al cierre de M1 sobre P/L realizado y perder la cuenta sin que nada se quejara.
acumuladores:
  perdida_dia:
    descripcion: perdida acumulada desde el corte del dia de riesgo
    base: base_calculo_perdida_diaria
    reinicia_con: reloj_dia_riesgo
    cita: fb-2026-09-09-sesion-01-462134c7
  perdida_semana:
    descripcion: perdida acumulada desde el corte de la semana
    base: base_calculo_perdida_semanal
    reinicia_con: reloj_dia_riesgo
    cita: fb-2026-09-09-sesion-01-a85b6bc7
  # Los dos de la firma (ADR-0026) no llevan cita: no los dijo el trader, los escribe el
  # reglamento, y las reglas que los usan declaran `decision`.
  perdida_dia_firma:
    descripcion: >-
      caida de la magnitud vigilada (equity) por debajo del saldo al corte diario; ese corte lo
      marca reloj_dia_riesgo y la base la declara firma_base_perdida_diaria. El tope es un
      porcentaje del capital INICIAL, no del saldo del corte (ADR-0026)
    base: firma_base_perdida_diaria
    reinicia_con: reloj_dia_riesgo
    magnitud: firma_magnitud_vigilada
  perdida_total_firma:
    descripcion: >-
      caida de la magnitud vigilada (equity) por debajo del capital inicial (saldo_inicial_cuenta).
      No se reinicia nunca, y la base no sigue al maximo mientras firma_perdida_total_arrastra
      valga false, que es lo que dice el programa 2-Step (ADR-0026)
    base: saldo_inicial_cuenta
    reinicia_con: nunca
    magnitud: firma_magnitud_vigilada
    arrastra: firma_perdida_total_arrastra
  cartuchos:
    descripcion: perdidas que cuentan como intento
    base: cartucho_criterio
    reinicia_con: cartuchos_reinicio
    cita: fb-2026-09-09-sesion-01-e3eedcaa

reglas:
  # ---------------------------------------------------------------- marco y sesgo
  - id: RN-001
    titulo: la ventana operativa es el horario del trader, no el de las velas
    cuando: >-
      la hora de pared en huso_operativa esta en el intervalo MEDIO ABIERTO que empieza en
      ventana_inicio e incluye hasta el instante anterior a ventana_fin, en un dia de
      dias_operables
    entonces: el bot busca entradas; fuera de ese intervalo no opera
    parametros: [ventana_inicio, ventana_fin, huso_operativa, dias_operables]
    cita: fb-2026-09-09-sesion-01-8741c388
    literal: >-
      Tu operativa inicia 7AM, me dijiste, ¿no? Sí [...] Por ahora vamos a trabajarlo en esas dos
      sesiones
    notas: >-
      manda SU horario, no la rejilla. La ventana coincide con dos velas H4 completas 337 dias al
      año; los otros 28 -del 8 al 28 de marzo y del 25 al 31 de octubre, cuando la UE y EE.UU. no
      cambian la hora el mismo dia- el ancla se ve a las 22:00 y el bot empieza una hora DENTRO de
      la vela. Se decidio asi a proposito el 2026-09-10: el trader se sienta a su hora, sea cual
      sea la fecha (ADR-0017). El titulo anterior afirmaba una alineacion que no es cierta siempre
    decision: ADR-0017
    forma:
      cuando:
        cualquiera_de:
          - ninguno_de:
              - en_ventana:
                  inicio: ventana_inicio
                  fin: ventana_fin
                  huso: huso_operativa
                  dias: dias_operables
          - hecho: detenido_por_tope
          - hecho: detenido_por_tope_total
          - hecho: detenido_por_cartuchos
      entonces:
        prohibe: [buscar_entradas, abrir_operacion]
    clase: gate
    estado: VIGENTE

  - id: RN-002
    titulo: al llegar el fin de la ventana se cierra lo que quede abierto
    cuando: >-
      la hora de pared en huso_operativa alcanza ventana_fin y quedan operaciones abiertas
    entonces: se cierra a mercado si cierre_forzoso_fin_ventana
    parametros: [ventana_fin, cierre_forzoso_fin_ventana, huso_operativa]
    cita: fb-2026-09-09-sesion-01-ffb528d7
    literal: la operativa se cierra a las 3pm en punto
    notas: >-
      "las 3pm" son las suyas: la hora de pared en huso_operativa, que cambia con el horario de
      verano igual que la de cualquiera (ADR-0017)
    decision: ADR-0017
    forma:
      cuando:
        todos_de:
          - alcanza_hora: {hora: ventana_fin, huso: huso_operativa}
          - hecho: operacion_abierta
            liga: OP
      entonces:
        hace:
          - cerrar_a_mercado: {de: OP, si: cierre_forzoso_fin_ventana}
    clase: terminal
    estado: VIGENTE

  - id: RN-003
    titulo: el sesgo lo fija la vela H4 previa, y solo cambia si rompe su extremo
    cuando: abre una sesion operativa
    entonces: >-
      el sesgo es el de la vela H4 previa cerrada segun sesgo_h4_regla; cambia solo si esa vela
      rompio el extremo de la anterior, y basta con la mecha; un equal no lo cambia
    parametros: [sesgo_h4_regla, anclaje_h4, sesgo_h4_criterio_ruptura]
    cita: fb-2026-09-09-sesion-01-8eccf5c0
    literal: >-
      si no genera un rompimiento por encima, o sea, al menos por un pip o una milésima de pip,
      entonces seguiríamos operando bajista
    notas: >-
      el color de la vela NO decide: una vela que cierra roja pero cuya mecha rompio por encima
      deja el sesgo alcista. La rejilla H4 la fija anclaje_h4 -la medianoche del servidor- y NO
      huso_operativa: son relojes distintos y se separan 28 dias al año (ADR-0017)
    forma:
      cuando:
        todos_de:
          - abre_sesion_operativa: {}
          - rompe:
              que: vela_h4_previa
              contra: extremo_de_la_h4_anterior
              criterio: sesgo_h4_criterio_ruptura
      entonces:
        hace:
          - fijar: {hecho: sesgo, a: sentido_de_la_ruptura}
    clase: disparador
    estado: VIGENTE

  # ---------------------------------------------------------------- liquidez y entrada
  - id: RN-004
    titulo: la liquidez de M15 se toma con cuerpo
    cuando: el precio alcanza el alto o el bajo de M15 marcado
    entonces: >-
      se da por tomada solo si una vela cierra con cuerpo al otro lado segun
      liquidez_m15_criterio_toma; una mecha que lo perfore no cuenta
    parametros: [liquidez_m15_criterio_toma]
    cita: fb-2026-09-09-sesion-01-6e15504f
    literal: >-
      ¿Vale con que la vela cierre con el cuerpo por encima del máximo, por debajo del mínimo,
      o vale con que la mecha lo perfore? Con cuerpo
    notas: solo en M15; en M1 el rompimiento es indiferente
    forma:
      cuando:
        todos_de:
          - alcanza_nivel: {que: liquidez_m15}
          - cruza: {que: liquidez_m15, criterio: liquidez_m15_criterio_toma}
      entonces:
        hace:
          - fijar: {hecho: liquidez_tomada, a: "si"}
    clase: disparador
    estado: VIGENTE

  - id: RN-005
    titulo: lo que se desarrolla en el lado de ruido de la liquidez de M15 no es entrada
    cuando: >-
      el precio se desarrolla por encima de la liquidez de M15 en sesgo alcista, o por debajo de ella
      en sesgo bajista
    entonces: no hay entrada
    parametros: []
    cita: ev-v3-001725-bca9714b
    literal: >-
      la operativa está por encima no por debajo todo lo que haya por debajo es ruido
    notas: >-
      HASTA EL 2026-09-16 ESTA REGLA ESTABA AL REVES: prohibia abrir "por debajo de la liquidez de
      M15 en sesgo alcista, o al reves", que es justo donde el trader opera, en los dos sentidos
      (auditoria del 2026-09-13, hallazgo [2]; verificado otra vez en la revision de diseno de la rama
      de fidelidad). Es el unico filtro direccional de la spec -`sesgo` solo lo consume esta regla- y
      es un gate, la clase que gana siempre. LO QUE SOSTIENE CADA SENTIDO. Bajista: esta cita (v3
      0:17:25) y la que llevaba antes, ev-v3-001600-ed45b091 (v3 0:16:00, "por debajo de esta liquidez
      de m15 es ruido"), las dos sobre un ejemplo cuyo sesgo H4 es bajista por el contexto de v3
      0:15:08, no por la frase citada; la sesion 1 lo repite sin item de evidencia propio (v6
      0:18:16-0:19:08). Alcista: la cita del predicado, ev-v1-001306-f98e12e9 (v1 0:13:06, "nuestra
      operativa tiene que estar por debajo"), con el sesgo alcista dicho en v1 0:01:22 y 0:12:29.
      Ningun item junta en su propia frase el sesgo y el lado: la ligadura es lectura del tramo. Por
      eso el lado se nombra en el predicado (`lado_de_ruido`) y no se deduce de "el lado contrario al
      sesgo", que es la frase que se tradujo al reves
    forma:
      cuando:
        todos_de:
          - hecho: sesgo
            liga: S
          - se_desarrolla_en_el_lado_de_ruido: {que: liquidez_m15, sentido: S}
      entonces:
        prohibe: [abrir_operacion]
    clase: gate
    estado: VIGENTE

  - id: RN-006
    titulo: la orden limite se reubica al completarse cada zona de control
    cuando: >-
      hay una orden limite COLOCADA Y TODAVIA SIN LLENAR, y el precio rompe el extremo anterior,
      con lo que la zona de control en curso queda completada
    entonces: la orden limite se mueve a la zona recien completada segun reubicacion_cadencia
    parametros: [reubicacion_cadencia, zona_control_criterio_completada]
    cita: fb-2026-09-09-sesion-01-6b29059d
    literal: >-
      cuando ya me rompe a este nivel de aquí, entonces ya esta orden límite aquí se pasa aquí
    notas: >-
      no es por vela ni por tiempo; mientras la zona no se completa, el limite no se mueve. La
      precondicion de que la orden siga pendiente se anadio el 2026-09-10: sin ella esta regla se
      disparaba sobre EL MISMO evento que RN-014 -"se completa una zona de control"- y, con la
      operacion ya abierta, reubicaba una limite en paralelo (lo que RN-018 prohibe) en vez de
      poner el break even. El literal habla de una orden que aun no ha entrado.
      SEGUNDA CORRECCION, mismo dia: la precondicion se escribio primero como "las operaciones
      abiertas son cero", que es un PROXY FALSO -tras un stop o un break even la cuenta vuelve a
      cero y la orden limite ya no existe, porque se lleno-, y ademas metia un numero de negocio
      en un campo ejecutable. La condicion es que la orden exista y siga pendiente
    forma:
      cuando:
        todos_de:
          - hecho: orden_limite_pendiente
          - se_completa_zona_de_control:
              liga: Z
              criterio: zona_control_criterio_completada
      entonces:
        hace:
          - reubicar_orden_limite: {a: Z, cadencia: reubicacion_cadencia}
    clase: disparador
    estado: VIGENTE

  - id: RN-007
    titulo: varias velas de M1 que forman un order block mayor se mapean como una estructura
    cuando: se mapea la estructura en M1
    entonces: se agrupan segun mapeo_dos_velas y el resto se trata como ruido
    parametros: [mapeo_dos_velas]
    cita: fb-2026-09-09-sesion-01-7ee9cabc
    literal: sería considerado una estructura [...] en el lenguaje del bot sería considerado una estructura
    forma:
      cuando:
        todos_de:
          - se_mapea_estructura: {criterio: mapeo_dos_velas}
      entonces:
        hace:
          - agrupar_estructura: {criterio: mapeo_dos_velas}
    clase: disparador
    estado: VIGENTE

  - id: RN-008
    titulo: sin ninguno de los esquemas de entrada no hay entrada
    cuando: no se da el breaker ni el otro esquema de entrada
    entonces: no se opera
    parametros: []
    cita: ev-v4-001844-93dcb658
    literal: >-
      aquí no hay entrada por el hecho de que el precio no genera el esquema de entrada que ya
      sabemos cuál es [...] cualquiera de estos dos de aquí
    notas: >-
      el 2026-09-10 esta regla se marco `pendiente_definicion` porque el glosario definia breaker
      de forma circular y su cita dice "el que ya sabemos cual es". ERA UN ERROR DE BUSQUEDA: la
      definicion SI esta en el corpus, repartida en una docena de items -ev-v4-000243 (los dos
      esquemas), ev-v3-004201 (el primero no espera retroceso), ev-v3-004230 (el segundo deja zona
      de control y rompe), ev-v3-011653 (el breaker marca el bloque de origen, sin CHoCH),
      ev-v4-005910 (en M1 vale mecha o cuerpo; en M15 cuerpo)- y lo que faltaba era recogerla en
      el glosario. Afirmar una ausencia exige buscarla en la fuente, no en el indice
    forma:
      cuando:
        ninguno_de:
          - se_da_esquema: {cual: primer_esquema}
          - se_da_esquema: {cual: segundo_esquema}
      entonces:
        prohibe: [abrir_operacion]
    clase: gate
    estado: VIGENTE

  - id: RN-009
    titulo: mas zonas de control de las admitidas invalidan el esquema
    cuando: >-
      dentro del mismo esquema se desarrollan mas zonas de control de las que admite
      zonas_control_max_por_esquema
    entonces: no se opera
    parametros: [zonas_control_max_por_esquema]
    cita: fb-2026-09-09-sesion-01-1b2203b0
    literal: solo 1 zona control bro. si hay 2 se descarta
    notas: >-
      hasta el 2026-09-11 esta regla citaba `ev-v4-001909-54ac2edd` -"aqui no habria un trade
      usando este modelo aqui por el hecho de que te genera dos zonas de control [...] por lo
      general solo buscamos uno"-, que describe el caso pero remata con una TENDENCIA, no con una
      prohibicion; de ahi A-20 y el default. El trader la cierra por escrito y en duro, asi que la
      regla pasa a citar sus palabras y la evidencia se queda en A-20, que es donde documenta de
      donde venia la duda
    forma:
      cuando:
        todos_de:
          - zonas_desarrolladas_superan: {tope: zonas_control_max_por_esquema}
      entonces:
        prohibe: [abrir_operacion]
    clase: gate
    estado: VIGENTE

  - id: RN-010
    titulo: una entrada activada sin ruptura se gestiona como cualquier otra
    cuando: >-
      la orden se activa sin que la estructura llegue a romperse, lo que el trader acaba llamando un
      equal
    entonces: se protege y se deja correr segun salida_sin_ruptura, con el stop en su nivel
    parametros: [salida_sin_ruptura, stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-9626d3dd
    literal: >-
      se activa la entrada y apenas automáticamente [...] proteger a 0.80 [...] o continúa ya
      nos saca con menos 0.80
    notas: >-
      hasta el 2026-09-16 su forma decia `se_activa_entrada: {por: equal}` y ademas fijaba
      `operacion_abierta`. Lo primero usaba un token con tres significados -resultado de cierre,
      geometria y causa de activacion-; ahora es `activacion_sin_ruptura`. Lo segundo contradecia
      ADR-0028 §5 -la posicion viva la lee el motor del broker- y se quita (ADR-0032); F14b §0, que
      lo habia anadido, queda deshecho. Por que via llega una orden a activarse sin ruptura depende
      de cuando nace la orden, que no esta cerrado (A-29)
    forma:
      cuando:
        todos_de:
          - se_activa_entrada: {por: activacion_sin_ruptura}
      entonces:
        hace:
          - gestionar_salida: {segun: salida_sin_ruptura, stop: stop_fraccion_caja}
    clase: disparador
    estado: VIGENTE

  # ---------------------------------------------------------------- riesgo y gestion
  - id: RN-011
    titulo: al tocar colocar la orden limite, el lote se dimensiona hasta el stop y el stop se escribe en ella
    cuando: >-
      toca colocar la orden limite en la zona de control que la ancla segun orden_limite_nace, y no hay ni orden
      limite pendiente ni posicion viva
    entonces: >-
      el lote sale de la distancia que va de la entrada a stop_fraccion_caja segun lotaje_base y
      riesgo_por_operacion sobre base_calculo_riesgo; el stop se escribe EN LA ORDEN segun
      stop_en_orden_pendiente, en ese mismo stop_fraccion_caja, antes de enviarla; y la orden queda
      dimensionada en esa zona, a la espera de su objetivo y de su envio
    parametros:
      - lotaje_base
      - riesgo_por_operacion
      - base_calculo_riesgo
      - stop_en_orden_pendiente
      - stop_fraccion_caja
      - orden_limite_nace
    cita: fb-2026-09-09-sesion-01-76fd91ba
    literal: el SL se pone junto a la orden limite, no cuando se apertura recien
    notas: >-
      hasta el 2026-09-10 esta regla decia que el stop "se mueve inmediatamente" tras activarse la
      entrada, citando "El primer stop loss es para el calculo del lotaje y el segundo es para
      proteccion". El trader lo corrigio, y ese es el literal de ahora. Los dos stops de la frase
      anterior son el del CALCULO y el que se ESCRIBE en la orden, y desde ADR-0020 son EL
      MISMO: stop_fraccion_caja. El corpus describe lo mismo desde el lado del resultado -"me
      activa la entrada y si yo protejo a 0.80", ev-v5-000312- y por eso parecia un movimiento
      posterior. Importa en un caso concreto: un hueco de precio que atraviese la entrada NO
      puede saltar al stop de rango completo, porque ese nunca llega a estar vivo en el mercado.
      El 2026-09-11 el consultor cierra el acuerdo final y el lote deja de dimensionarse sobre la
      caja completa: lo que absorbe riesgo_por_operacion es la distancia hasta el stop, asi que el
      lote sube un 25 % con stop_fraccion_caja = 0,8. Esa parte de la regla NO la sostiene el
      literal del trader -que decia lo contrario- y por eso declara `decision`. DESDE EL 2026-09-16
      (ADR-0032) esta regla PREPARA la orden y no la da por colocada: su `cuando` era el evento
      `se_coloca_orden_limite`, que ninguna regla producia, asi que la jornada entera daba cero
      colocaciones (auditoria del 2026-09-13). Ahora dispara con la condicion de mercado
      (`toca_colocar_orden_limite`, cuyo momento es A-29) y deja la zona en `orden_dimensionada`;
      RN-015 escribe el objetivo y coloca. Son dos reglas para que entre las dos pasen los gates
      -RN-027 redondea el lote- sin depender de un orden entre disparadores que ADR-0028 no da. Tampoco
      fija ya `orden_limite_pendiente`: lo lee del broker (ADR-0028 §5). El `ninguno_de` evita una
      segunda orden con una pendiente viva, que RN-018 no ve porque cuenta posiciones y no ordenes
    decision: ADR-0020
    forma:
      cuando:
        todos_de:
          - toca_colocar_orden_limite:
              liga: Z
              momento: orden_limite_nace
          - ninguno_de:
              - hecho: orden_limite_pendiente
              - hecho: operacion_abierta
      entonces:
        hace:
          - dimensionar_lote:
              base: lotaje_base
              riesgo: riesgo_por_operacion
              sobre: base_calculo_riesgo
          - escribir_stop_en_la_orden:
              donde: stop_en_orden_pendiente
              nivel: stop_fraccion_caja
          - fijar: {hecho: orden_dimensionada, a: Z}
    clase: disparador
    estado: VIGENTE

  - id: RN-012
    titulo: el stop cuesta el riesgo entero, y el resto de la caja no es presupuesto
    cuando: el stop salta
    entonces: >-
      la perdida es riesgo_por_operacion sobre base_calculo_riesgo, entera y sin fraccion,
      porque el lote se dimensiono sobre la distancia hasta stop_fraccion_caja. El tramo que va
      de stop_fraccion_caja al extremo de la caja no se arriesga nunca: ahi ya esta cerrada
    parametros: [riesgo_por_operacion, base_calculo_riesgo, stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-17ed6193
    literal: >-
      el 0.5% de riesgo de la cuenta se calcula sobre el nivel 0.8 de la cuenta, ese es el
      acuerdo final
    notas: >-
      HASTA EL 2026-09-11 esta regla decia lo contrario: que la perdida real era MENOR que el
      riesgo nominal -riesgo_por_operacion x stop_fraccion_caja, 0,4 % con 0,5 y 0,8- porque el
      lote se dimensionaba sobre la caja completa, y citaba al trader: "La operativa se calcula
      con el SL normal, pero apenas de abre la operacion se mueve el SL hasta el nivel 0.8 para
      todos los modelos de entrada" (fb-2026-09-09-sesion-01-c4922acb). El acuerdo final del
      consultor invierte la base del lotaje (ADR-0020) y con ella esta regla: el stop cuesta el
      0,5 % completo. El RR realizado no cambia -sigue siendo objetivo_rr / stop_fraccion_caja =
      3,75- porque las dos distancias se escalan igual; lo que cambia es el tamano del lote.
      INVARIANTE, no parametro: `stop_proteccion_capital` sigue UNKNOWN a proposito para que no
      haya dos puertas para el mismo numero. Un motor que guarde el riesgo real como dato aparte
      puede desincronizarlo del stop
    complementa: [RN-011]
    forma:
      cuando:
        todos_de:
          - salta_stop: {}
      entonces:
        hace:
          - realizar_perdida:
              riesgo: riesgo_por_operacion
              sobre: base_calculo_riesgo
    decision: ADR-0020
    clase: disparador
    estado: VIGENTE

  - id: RN-013
    titulo: hay un unico esquema de stop, y vale para cualquier esquema de entrada
    cuando: se abre la operacion, por el esquema de entrada que sea
    entonces: el stop va a stop_fraccion_caja, sea cual sea el esquema
    parametros: [stop_fraccion_caja, stop_en_orden_pendiente]
    cita: fb-2026-09-09-sesion-01-bc829942
    literal: tanto primero como segundo esquema de entrada en 0.80, ¿verdad? Sí
    notas: >-
      hasta el 2026-09-10 existia `stop_segundo_esquema` con el MISMO valor que
      stop_fraccion_caja: dos puertas para el mismo numero, que es lo que RN-012 prohibe
      expresamente y ADR-0002 para todo. Ahora es cierto por construccion, no por coincidencia:
      el parametro del segundo esquema queda UNKNOWN a proposito. DESCARTADA EL 2026-09-16 SIN QUE
      CAMBIE LO QUE DICE: queda absorbida (ADR-0032). Su forma escribia el stop al LLENARSE la orden
      -dentro de `se_activa_entrada`, contra su propio verbo "antes de que se active"- y fijaba dos
      hechos del broker. Quitadas las dos cosas, su `hace` se quedaba vacio. Lo que afirma sigue
      siendo cierto, y ahora por construccion: RN-011 escribe el stop en la orden sin leer el
      esquema, asi que no puede haber dos
    complementa: [RN-010, RN-011, RN-012]
    clase: disparador
    estado: DESCARTADA

  - id: RN-014
    titulo: el break even se pone al romperse la zona de control posterior
    cuando: tras la entrada se desarrolla otra zona de control y el precio la rompe
    entonces: el stop pasa a la entrada, en el instante del toque segun break_even_condicion
    parametros: [break_even_condicion, break_even_criterio_ruptura]
    cita: fb-2026-09-09-sesion-01-0ccafcba
    literal: yo siempre lo he estado trabajando, o sea, apenas toca
    notas: >-
      el disparador NO es un nivel de precio sino la ruptura de la zona de control que se forma
      despues de la entrada. A-13 pregunta si esa ruptura deberia exigir cuerpo
    forma:
      cuando:
        todos_de:
          - hecho: operacion_abierta
            liga: OP
          - se_completa_zona_de_control:
              liga: Z
              criterio: break_even_criterio_ruptura
              distinta_de: OP.zona_de_entrada
              posterior_a: OP.instante_entrada
      entonces:
        hace:
          - mover_stop: {de: OP, a: OP.precio_entrada, cuando: break_even_condicion}
    clase: disparador
    estado: VIGENTE

  - id: RN-015
    titulo: el objetivo es fijo, se traza con la orden antes de enviarla y no se mueve
    cuando: la orden limite ya esta dimensionada en su zona, con su lote y su stop
    entonces: >-
      el objetivo se fija en objetivo_rr sobre la distancia que declara base_calculo_objetivo, en la
      misma orden que ya lleva el stop, y no se extiende (objetivo_extension_activa) ni se sacan
      parciales (parciales); la orden se coloca en esa zona
    parametros: [objetivo_rr, base_calculo_objetivo, objetivo_extension_activa, parciales]
    complementa: [RN-011]
    cita: fb-2026-09-09-sesion-01-7fbbb2e7
    literal: Siempre se fija el 1:3, no importa en que escenario nos encontremos
    notas: >-
      la BASE del 1:3 no la dice el literal, y por eso vive en base_calculo_objetivo y no en
      esta frase (ADR-0014). El objetivo se traza sobre la caja completa y el lote YA NO: desde
      ADR-0020 el lote se dimensiona hasta stop_fraccion_caja, asi que las dos distancias dejaron
      de ser la misma. El RR REALIZADO sigue siendo objetivo_rr / stop_fraccion_caja, no
      objetivo_rr, porque esa razon no depende del lote. Quien mida fidelidad en F26 no debe
      leer esa diferencia como un fallo del bot: es la mecanica. ev-v4-011951 empuja al otro
      lado -el trader dice que un ganador cubre "2 o 3" perdidas, que cuadra mejor con medir
      sobre el riesgo real-, pero es una estimacion redonda hablando de margenes, no una
      descripcion del calculo; A-18 lo deja a la vista hasta ratificarlo. LA BASE, ANOTADA Y NO
      CAMBIADA (2026-09-16): las dos premisas con las que ADR-0014 eligio la caja completa estan
      revocadas -que el stop se mueve tras el llenado (A-11) y que el lote se dimensiona sobre la caja
      (ADR-0020)-, asi que el argumento "en el instante de trazar la orden solo existe la caja
      completa" ya no discrimina: en ese instante el stop ya esta escrito en la misma orden. Cambiar
      la base cambia el RR realizado y queda para el consultor. EL INSTANTE (2026-09-16, ADR-0032):
      hasta entonces esta regla disparaba al ACTIVARSE la entrada `por: cualquier_esquema`, a pesar de
      su titulo, y una activacion sin ruptura (RN-010) no casaba con ese token: la posicion nacia y
      vivia sin objetivo. Ahora el objetivo se escribe en la orden antes de enviarla, en la regla que
      la coloca, asi que ninguna posicion puede existir sin el. Coloca aqui y no en RN-011 porque los
      gates tienen que ver la orden con el objetivo ya escrito -RN-026 compara stop y objetivo con el
      minimo del broker- y porque `colocar_orden_limite` lleva `efecto`: si un gate prohibe abrir, no
      se envia, y `orden_dimensionada` se apaga igual
    forma:
      cuando:
        todos_de:
          - hecho: orden_dimensionada
            liga: Z
      entonces:
        hace:
          - fijar_objetivo:
              multiplo: objetivo_rr
              sobre: base_calculo_objetivo
              extension: objetivo_extension_activa
              parciales: parciales
          - colocar_orden_limite: {en: Z}
          - fijar: {hecho: orden_dimensionada, a: "no"}
    clase: disparador
    estado: VIGENTE

  # ---------------------------------------------------------------- limites del dia
  - id: RN-016
    titulo: el dia se limita por cartuchos, y solo una perdida gasta uno
    cuando: se cierra la operacion
    entonces: >-
      suma al contador solo si fue perdida (cartucho_criterio); al llegar a cartuchos_max se deja
      de operar hasta cartuchos_reinicio
    parametros: [cartuchos_max, cartucho_criterio, cartuchos_reinicio]
    cita: fb-2026-09-09-sesion-01-aa2abe65
    literal: >-
      un intento no es considerado un break even, ¿vale? una entrada invalidada pues tampoco es
      considerado un intento [...] reentrada después de equal, tampoco es considerado un intento
    notas: >-
      el contador NO es diario; se reinicia con la siguiente liquidez de M15. DESDE EL 2026-09-16 el
      cierre lleva `por`: una perdida de una operacion activada SIN RUPTURA no suma -es lo que el
      trader llama cerrar un equal, "te genera una perdida" (v6 1:23:13-1:23:19), y la reentrada
      despues de un equal no es un intento (el literal)-; y el break even es su propio resultado
      (`break_even`), clasificado por mecanismo, asi que unos dolares de comision no lo convierten
      en perdida. Hasta entonces esa perdida llegaba como `perdida` y gastaba cartucho, contra el
      literal de esta misma regla
    forma:
      cuando:
        cualquiera_de:
          - todos_de:
              - se_cierra_operacion: {resultado: perdida, por: cualquier_esquema}
              - alcanza_tope: {acumulador: cartuchos, tope: cartuchos_max}
          - hecho: detenido_por_cartuchos
      entonces:
        prohibe: [abrir_operacion]
        hace:
          - fijar: {hecho: detenido_por_cartuchos, a: hasta_cartuchos_reinicio}
    clase: gate
    estado: VIGENTE

  - id: RN-017
    titulo: un trade ganador no apaga el dia
    cuando: la operacion cierra en positivo
    entonces: se sigue operando, con el limite de cartuchos intacto
    parametros: [cartuchos_max]
    cita: fb-2026-09-09-sesion-01-af02495f
    literal: >-
      que siga operando, pero que respete la regla de los 3 cartuchos de perdida
    notas: >-
      corrige lo que se daba por sabido antes de la sesion: la confirmacion R-07 de la hoja,
      que apunta a ev-v4-004936-d7004417 (ver el anexo del informe de la sesion)
    forma:
      cuando:
        todos_de:
          - se_cierra_operacion: {resultado: ganancia, por: cualquier_activacion}
      entonces:
        permite: [buscar_entradas]
    clase: disparador
    estado: VIGENTE

  - id: RN-018
    titulo: no hay operaciones en paralelo
    cuando: el numero de operaciones abiertas alcanza operaciones_simultaneas_max
    entonces: no se abre ninguna mas; para reentrar hay que haber salido antes
    parametros: [operaciones_simultaneas_max]
    cita: ev-v4-003710-c753f3d3
    literal: >-
      para que tú puedas entrar nuevamente o bien te ha tocado stop loss
    notas: >-
      la cita sigue en el item hasta "con el profit ya no operas mas", pero ESA MITAD quedo
      revocada en la sesion 1 (RN-017): el trader dijo que un ganador no apaga el dia. El literal
      se corta donde sigue siendo cierto
    forma:
      cuando:
        todos_de:
          - operaciones_abiertas_alcanzan: {tope: operaciones_simultaneas_max}
      entonces:
        prohibe: [abrir_operacion]
    clase: gate
    estado: VIGENTE

  - id: RN-019
    titulo: se puede reentrar tras un equal sin gastar cartucho
    cuando: se cierra la operacion en curso y se habia activado sin ruptura, lo que el trader llama cerrar un equal
    entonces: >-
      se puede volver a entrar segun reentrada_tras_equal, por la via normal de colocacion, y ese
      cierre no suma al contador
    parametros: [reentrada_tras_equal, cartucho_criterio]
    cita: fb-2026-09-09-sesion-01-060cd801
    literal: Sí, esto no gasta intentos, me dijiste, ¿no? No
    notas: >-
      HASTA EL 2026-09-16 NO PODIA DISPARAR NUNCA, por dos motivos. Su forma pedia
      `se_cierra_operacion: {resultado: equal}`, y el caso que el trader describe cierra con perdida
      -"te genera una perdida" (v6 1:23:13-1:23:19)-, asi que llegaba como `perdida`, y encima RN-016
      gastaba cartucho. Y unia en un `todos_de` ese cierre, que es un evento del broker, con
      `vuelve_a_dar_el_esquema`, que se evalua al cierre de M1: con las fases de ADR-0028 los dos
      pulsos no coinciden nunca. Ahora dispara con el cierre solo, reconocido por COMO se activo la
      operacion, y la reentrada la hace la colocacion de siempre (RN-011 y RN-015) cuando vuelva a
      tocar, con los gates delante: `reentrar` ya no envia nada. LECTURA NUESTRA, declarada: el
      trader habla de una entrada activada sin validar que un equal saca (v6 1:22:25-1:23:19); la
      spec no tiene forma de reconocer el equal en si, y trata igual todo cierre de una operacion
      activada sin ruptura. Cuando se reentra -en cuanto se cierra o al volver a darse la condicion de
      colocar- depende de A-29
    forma:
      cuando:
        todos_de:
          - se_cierra_operacion: {resultado: cualquier_resultado, por: activacion_sin_ruptura}
      entonces:
        hace:
          - reentrar: {segun: reentrada_tras_equal, cuenta_como: cartucho_criterio}
    clase: disparador
    estado: VIGENTE

  - id: RN-020
    titulo: el tope porcentual del trader es el unico freno del dia de su operativa
    cuando: >-
      la perdida acumulada desde el corte que marca reloj_dia_riesgo -la medianoche civil en
      huso_operativa, que es tambien la de la firma- alcanza perdida_maxima_diaria sobre
      base_calculo_perdida_diaria, o perdida_maxima_semanal sobre base_calculo_perdida_semanal
    entonces: se deja de operar hasta el corte siguiente
    parametros:
      - perdida_maxima_diaria
      - base_calculo_perdida_diaria
      - perdida_maxima_semanal
      - base_calculo_perdida_semanal
      - reloj_dia_riesgo
    cita: fb-2026-09-09-sesion-01-bff260ea
    literal: >-
      De la cuenta basado en el saldo, y que sea en el saldo inicial del día
    notas: >-
      OJO a la aritmetica, corregida en la auditoria del 2026-09-09: agotar los cartuchos cuesta
      tres perdidas, pero el contador NO es diario -se reinicia con la siguiente liquidez de M15
      (cartuchos_reinicio)-, asi que no hay cota diaria por esa via: son tres perdidas POR ZONA, y
      nada limita cuantas zonas se desarrollan entre la apertura y el cierre de la ventana. El
      tope porcentual no es una red que nunca se toca: es el unico freno del dia DE LA OPERATIVA, y
      el titulo de esta regla decia lo contrario hasta la auditoria del 2026-09-10. Las dos bases NO
      son la misma -el dia sobre el saldo inicial del dia, la semana sobre el saldo actual, que es
      lo que dijo el trader en cada caso-. El corte lo marca reloj_dia_riesgo, que fue un default
      nuestro en el reloj del servidor hasta el 2026-09-14 (A-19) y ahora es la medianoche civil
      que dice el reglamento de FTMO (ADR-0027): por eso esta regla ya no nombra broker_dst ni
      broker_offset_base. Desde ADR-0026 hay OTRO freno, el de la firma (RN-029): no es de la
      operativa del trader sino de la cuenta, y el motor respeta siempre el mas restrictivo de los
      dos. LO QUE ESTE TOPE NO HACE (2026-09-16): se comprueba antes de abrir sin descontar la
      operacion que se abre, asi que se rebasa por construccion -la auditoria del 2026-09-13 lo
      midio en 4,865 % sobre el 4,5 % ([d1-interprete-04])-. No se cambia su lectura, porque es la
      que dijo el trader. Lo que impide que ese desbordamiento cueste la cuenta son los frenos de la
      firma, que saltan antes de su limite y no abren una operacion que no cabe (RN-029, RN-031 y
      RN-032, ADR-0031)
    decision: ADR-0027
    forma:
      cuando:
        cualquiera_de:
          - alcanza_tope: {acumulador: perdida_dia, tope: perdida_maxima_diaria}
          - alcanza_tope: {acumulador: perdida_semana, tope: perdida_maxima_semanal}
          - hecho: detenido_por_tope
      entonces:
        prohibe: [abrir_operacion]
        hace:
          - fijar: {hecho: detenido_por_tope, a: hasta_el_corte_siguiente}
    clase: gate
    estado: VIGENTE

  - id: RN-021
    titulo: el spread no se filtra
    cuando: el spread se ensancha
    entonces: no se filtra (filtro_spread); se opera igual
    parametros: [filtro_spread]
    cita: fb-2026-09-09-sesion-01-3565552d
    literal: >-
      a mí me es indiferente si hay noticia o no [...] Sí, incluimos noticias
    notas: >-
      HASTA EL 2026-09-12 esta regla decia tambien que se opera DURANTE LAS NOTICIAS, y para el
      trader sigue siendo cierto: opera cuentas propias que no lo prohiben y su estrategia funciona
      dentro de esos eventos. Del 2026-09-12 al 2026-09-14 esa mitad se fue a RN-028 (ADR-0022)
      porque la cuenta fondeada podia prohibirlo. Desde ADR-0026 la cuenta es FTMO 2-Step Swing,
      que no lo restringe: el bot vuelve a operar noticias como el trader, RN-028 queda DESCARTADA
      y filtro_noticias vale `no`. Esta regla sigue diciendo solo lo del spread
    forma:
      cuando:
        todos_de:
          - contexto_filtrable: {spread: filtro_spread}
      entonces:
        permite: [buscar_entradas, abrir_operacion]
    clase: disparador
    estado: VIGENTE

  - id: RN-022
    titulo: cuando la situacion no encaja, el bot se abstiene
    cuando: no se cumple ninguna regla de entrada
    entonces: no se opera (comportamiento_sin_regla)
    parametros: [comportamiento_sin_regla]
    cita: fb-2026-09-09-sesion-01-c698bc6a
    literal: Que sea fiel a la operativa y no busque nada adicional.
    forma:
      cuando:
        todos_de:
          - ninguna_regla_de_entrada_aplica: {}
      entonces:
        prohibe: [abrir_operacion]
        hace:
          - abstenerse: {segun: comportamiento_sin_regla}
    clase: fallback
    estado: VIGENTE

  # ---------------------------------------------------------------- reglas descartadas
  - id: RN-023
    titulo: no hay colchon de spread separado del stop
    cuando: se coloca el stop
    entonces: >-
      no se suma ningun margen; el nivel del stop ya lo incorpora
    parametros: [stop_fraccion_caja]
    cita: fb-2026-09-09-sesion-01-08761847
    literal: Por temas de Spread ... se reduce al 0.8
    notas: >-
      por eso `stop_colchon_spread` se queda UNKNOWN. Cierra A-10. La contradiccion mecanica
      `stop.nivel` sigue ABIERTA a proposito: los items que dicen 0,75 son citas ciertas de lo que
      el trader hacia antes, y cerrarla exige superseder esos items (F06/F07), no una regla
    clase: disparador
    estado: DESCARTADA

