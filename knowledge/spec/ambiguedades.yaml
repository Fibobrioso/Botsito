  - id: A-17
    titulo: noticias frente a la regla de la cuenta de fondeo
    pregunta: >-
      DESCARTADA una via el 2026-09-12: se penso que la pestaña `Prop firm` de FX Replay -que el
      trader tiene con el plan Pro- podria llevar dentro la ventana de noticias y el corte del dia
      de riesgo, y cerrar esta y A-19 de golpe. El trader responde que NO la tiene configurada con
      FundedNext. Sigue haciendo falta el reglamento.
      ¿QUE prohibe exactamente el reglamento de FundedNext sobre operar en noticias: que eventos,
      cuantos minutos antes y despues, y que sancion? Es un HECHO que se verifica en su reglamento,
      no una decision. Partida en dos el 2026-09-12 (ADR-0022): la decision de alcance -el bot no
      opera noticias en la v1 aunque la estrategia del trader si funcione dentro de ellas- se fue a
      A-22 y esta DECIDIDA; aqui se queda lo que hay que leer y medir. Sin esta respuesta, RN-028
      sabe QUE bloquea y no CON QUE VENTANA.
      DECIDIDA el 2026-09-14 por ADR-0026, que cambia de firma. El reglamento se leyo ese dia y el
      supuesto era cierto donde se miro: FTMO Standard prohibe abrir o cerrar -incluida la ejecucion
      de un stop o un objetivo- de dos minutos antes a dos despues de noticias seleccionadas, con la
      cuenta como sancion, y FundedNext recorta el 40 % del beneficio operado cinco minutos antes y
      despues. Pero la cuenta elegida es FTMO 2-Step SWING, que no tiene restricciones de noticias,
      asi que la ventana deja de importar: filtro_noticias vuelve a `no` y RN-028 se descarta
    resuelve_en: [F11, F33]
    evidencia:
      - ev-v6-020029-aa86963a
      - ev-v6-020114-a0e0b419
      - ev-v6-020200-a957aa03
    parametros: [filtro_noticias]
    contradiccion: null
    estado: DECIDIDA
    decision: ADR-0026
    decidida_el: '2026-09-14'
    bloqueante: false
  - id: A-18
    titulo: base sobre la que se mide el objetivo 1:3
    pregunta: >-
      ¿el 1:3 se mide sobre la caja completa o sobre la distancia hasta el stop, que es la que
      dimensiona el lote? Hasta el 2026-09-11 las dos eran la MISMA distancia y la pregunta
      sonaba academica; desde ADR-0020 el lote se dimensiona hasta stop_fraccion_caja y el
      objetivo sigue midiendose sobre la caja entera, asi que la respuesta cambia el RR
      realizado de verdad. PRIMERA MEDIDA, y no sale de la sesion sino del material
      (2026-09-21, agosto, ADR-0037): las dos lecturas predicen RR distintos sobre la distancia
      entrada-stop -`caja_completa` da objetivo_rr/stop_fraccion_caja = 3,75; `riesgo_real` da
      3,00- y las 18 filas de agosto con `maxTP` e `initialSL` tienen SUELO EN 3,00 (minimo
      2,50, tres clavadas en 3,00, 16 de 18 por debajo de 3,75). La combinacion CONFIRMED de hoy
      -caja_completa con stop a 0,8- no cuadra con el material: o la base es `riesgo_real`, o el
      stop del trader en su backtest no esta a 0,8 de la caja. NO DECIDE NADA: es un mes, son 18
      filas, y LA CAJA NO ESTA EN EL FICHERO -el RR medido es riesgo real por construccion, asi
      que si el stop viviera en el borde de la caja las dos lecturas coincidirian y la medida no
      discriminaria-. Se repite sobre mayo al ingerirlo.
      v5 (2026-09-05 21-03-59.mkv), 36 fotogramas en ventanas fijas de los instantes 1, 2, 3, 4, 6
      y 7: ninguno cumple la condicion congelada; la medida no esta en v5; via cerrada.
      Transcripciones v1–v5: 42 pasajes, ninguno responde con la regla congelada; se pregunta al
      trader. En v1–v4 el stop se describe en dos tiempos (lote sobre la caja entera, stop
      protegido a 0,75 tras la entrada), anterior al lineamiento del 9 de septiembre; las dos
      hipótesis vigentes suponen un solo stop.
    resuelve_en: [F11, F26]
