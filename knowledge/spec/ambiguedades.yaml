  - id: A-42
    titulo: con qué reloj cuenta el trader su horario de operar de 07:00 a 15:00
    pregunta: >-
      Tu horario de operar, de 7 a 15, ¿con qué reloj lo cuentas? ¿Cambia algo en invierno?
    resuelve_en: [F14, F26]
    # NACE EL 2026-09-25 (rama trabajo/sesion-02, decision del consultor tras K-07,
    # docs/validation/SESION-02-DECISIONES.md §2 y §8). El grafico de FX Replay es UTC+2 fijo: lo
    # marca un fotograma de ENERO de v4, fr-v4-9ad0ebb8/1200000 ("14:29:59 UTC+2" sobre "Thu 29 Jan
    # '26", docs/validation/ABRIL-Y-LA-CAJA.md R0), y huso_grafico vale Etc/GMT-2. El corpus cuenta
    # el horario de dos maneras: "de 7 a 15 por españa" (v3 0:01:36, ev-v3-000136-6160fcea; la cruda
    # lo escribe en minuscula) y "De UTC más 2, de 7, claro" (v4 1:14:34, segmento #1280, dentro de
    # ev-v4-011425-ae028b78, contestando a la pregunta del interlocutor). En verano dan la misma
    # hora; en invierno se separan una hora: las 07:00 de su grafico son las 06:00 de Madrid.
    # huso_operativa SE QUEDA en Europe/Madrid hasta que se resuelva (decision del consultor).
    # BLOQUEANTE DE LA ENTRADA DE MESES DE INVIERNO, DESDE EL SORTEO: docs/runbooks/ENTRADA-MARZO.md
    # para antes del paso b (PARADA B0) si no esta RESUELTA, porque el sorteo congela huso_operativa
    # en ventanas.yaml y no se repite (ADR-0046 §5). Nacio parando antes de la ingesta y el consultor
    # la adelanto el mismo dia. En 2026 el horario de verano europeo empieza el 29 de marzo, asi que
    # casi todo marzo es invierno
    evidencia:
      - ev-v3-000136-6160fcea
      - ev-v4-011425-ae028b78
    parametros: [huso_operativa]
    contradiccion: null
    estado: ABIERTA
    decision: null
    decidida_el: null
    clase: pregunta
    bloqueante: true
