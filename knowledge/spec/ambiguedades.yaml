  - id: A-18
    titulo: base sobre la que se mide el objetivo 1:3
    pregunta: >-
      ¿Cómo decides dónde va el stop y dónde va el objetivo? En algún vídeo hablas de poner el stop
      en dos tiempos: ¿cómo funciona eso?
    # PREGUNTA ANTERIOR, SUSTITUIDA EN LA SEGUNDA REVISION DEL CONSULTOR (2026-09-25, rama
    # trabajo/sesion-02):
    # "Cuando trazas el objetivo de una operación, ¿qué distancia tomas como referencia para
    # calcularlo?"
    # PREGUNTA ANTERIOR, SUSTITUIDA PORQUE SUGERIA RESPUESTA (2026-09-25, decision del consultor,
    # rama trabajo/sesion-02):
    # "¿el 1:3 se mide sobre la caja completa o sobre la distancia hasta el stop, que es la que
    # dimensiona el lote? Hasta el 2026-09-11 las dos eran la MISMA distancia y la pregunta sonaba
    # academica; desde ADR-0020 el lote se dimensiona hasta stop_fraccion_caja y el objetivo sigue
    # midiendose sobre la caja entera, asi que la respuesta cambia el RR realizado de verdad.
    # PRIMERA MEDIDA, y no sale de la sesion sino del material (2026-09-21, agosto, ADR-0037): las
    # dos lecturas predicen RR distintos sobre la distancia entrada-stop -`caja_completa` da
    # objetivo_rr/stop_fraccion_caja = 3,75; `riesgo_real` da 3,00- y las 18 filas de agosto con
    # `maxTP` e `initialSL` tienen SUELO EN 3,00 (minimo 2,50, tres clavadas en 3,00, 16 de 18 por
    # debajo de 3,75). La combinacion CONFIRMED de hoy -caja_completa con stop a 0,8- no cuadra con
    # el material: o la base es `riesgo_real`, o el stop del trader en su backtest no esta a 0,8 de
    # la caja. NO DECIDE NADA: es un mes, son 18 filas, y LA CAJA NO ESTA EN EL FICHERO -el RR
    # medido es riesgo real por construccion, asi que si el stop viviera en el borde de la caja las
    # dos lecturas coincidirian y la medida no discriminaria-. Se repite sobre mayo al ingerirlo. v5
    # (2026-09-05 21-03-59.mkv), 36 fotogramas en ventanas fijas de los instantes 1, 2, 3, 4, 6 y 7:
    # ninguno cumple la condicion congelada; la medida no esta en v5; via cerrada. Transcripciones
    # v1–v5: 42 pasajes, ninguno responde con la regla congelada; se pregunta al trader. En v1–v4 el
    # stop se describe en dos tiempos (lote sobre la caja entera, stop protegido a 0,75 tras la
    # entrada), anterior al lineamiento del 9 de septiembre; las dos hipótesis vigentes suponen un
    # solo stop."
    resuelve_en: [F11, F26]
