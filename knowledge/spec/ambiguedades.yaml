  - id: A-29
    titulo: cuando nace la orden limite
    pregunta: >-
      ¿cuando colocas la orden limite por primera vez en una zona: cuando ya se ha dado el esquema de
      entrada ("apenas el breaker, o sea, marco mi orden limit"), o en cuanto tomas la liquidez de M15,
      en la primera zona de control que se completa, y desde ahi la vas moviendo? El corpus dice las
      dos: v3 0:42:01 marca la orden con el breaker; v1 0:13:58 la va "bajando" en cuanto rompe la
      liquidez; v3 0:25:11 la tiene "predefinida" esperando el breaker; y en la sesion 1 (v6 1:22:14)
      la orden ya esta en la zona de "posible breaker" y se activa sin validar, que es el caso de
      RN-010. La spec corre con la primera como default (orden_limite_nace). Con la segunda hay que
      reescribir RN-008, que hoy prohibe abrir sin esquema y frenaria la propia colocacion.
      PRIORIDAD DE LA SESION 2 (consultor, 2026-09-17): el default se queda hasta que el trader
      responda
    resuelve_en: [F20, F22]
    evidencia:
