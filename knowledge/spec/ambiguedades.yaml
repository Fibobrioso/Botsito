    titulo: que es una zona de control limpia, sin ruido
    pregunta: >-
      el trader condiciona la entrada a que la zona de control "no haga mucho ruido, o sea, sea
      una zona limpia". Los dos esquemas SI estan definidos en el corpus -rompe directo sin
      retroceso, o pequeno retroceso con zona de control y luego rompe- pero "limpia" no: es lo
      unico de la geometria de entrada que sigue siendo cualitativo y que el motor no puede
      evaluar. ¿cuantas velas? ¿cuanto retroceso de mas la invalida? ¿o se mide por otra cosa?
      ESTA AMBIGUEDAD NACIO MAL el 2026-09-10, preguntando que es un breaker; la definicion ya
