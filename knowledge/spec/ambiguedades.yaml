# Ambiguedades abiertas del modelo del trader (F10, ADR-0011). Manual, versionado; cada commit
# cita `Fuente:` (evidencia o ADR). Es la version legible por maquina de la tabla "Known
# Ambiguities" de PROJECT_STATE.md (un test exige que ids y titulos coincidan). F09 valida el
# objetivo `ambiguedad` de un registro de feedback contra este fichero. Una ambiguedad se cierra
# (`estado: RESUELTA`) SOLO con un registro de feedback del trader (RESOLVE_UNKNOWN) y el commit
# que la cierra lo cita.
#
# Campos: id (A-N), titulo (el de PROJECT_STATE), pregunta (lo que se plantea al trader),
# resuelve_en (funcionalidades), evidencia (ids ev-* existentes), parametros (nombres del
# registro que la respuesta fija), contradiccion (tema con contradiccion mecanica, o null),
# estado (ABIERTA | RESUELTA), bloqueante (las 3 de la sesion 1, MASTER_PLAN G).
