  - id: A-19
    titulo: cuando empieza el dia y la semana de riesgo
    pregunta: >-
      DESCARTADA una via el 2026-09-12: la pestaña `Prop firm` de FX Replay no la tiene el
      trader configurada con FundedNext, asi que no hay atajo. Sigue siendo el panel de la
      cuenta (F17).
      ¿en que reloj cae la medianoche que reinicia el tope diario del 4,5 % y el domingo que
      reinicia el semanal: el del servidor del broker, que cambia con el calendario de Nueva
      York, o el del grafico? Hay que verificarlo en el panel de la cuenta, no suponerlo.
      DECIDIDA el 2026-09-14 por ADR-0027: con la firma elegida (ADR-0026) la contesta el
      reglamento, no el panel -"Account balance at midnight CE(S)T of the previous day"-. El corte
      es la medianoche CIVIL centroeuropea, que es el reloj del trader (huso_operativa), y no la del
      servidor, que era nuestro default. reloj_dia_riesgo pasa a `civil_operativa`, CONFIRMED. Lo
      que SI queda por medir -el reloj del servidor, que ya no decide el corte- es A-28
    resuelve_en: [F11, F33]
