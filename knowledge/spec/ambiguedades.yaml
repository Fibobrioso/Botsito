      ¿es regla o es tendencia? ¿dos zonas invalidan SIEMPRE el esquema, o hay casos en que
      opera igual? El valor 1 es un default nuestro hasta que lo diga. RESPONDIDA por escrito el
      2026-09-11: es REGLA -"solo 1 zona control bro. si hay 2 se descarta"- y ratifica tambien
