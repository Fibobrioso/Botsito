  - id: A-31
    titulo: el stop entero de una entrada que se activo sin ruptura
    pregunta: >-
      una entrada que se activo sin ruptura y se fue al stop entero, ¿gasta intento? Dijiste que no
      cuentan como intento "un break even [...] una entrada invalidada [...] reentrada despues de
      equal" (RN-016, v6 0:52:19), y el equal que describes en v6 1:22:25-1:23:19 es una salida que no
      llega al stop: se activa sin validar, un equal "te saque la entrada, te genera una perdida" y
      actualizas el limit para reentrar. Del stop entero de esa misma entrada no hablaste. La spec
      corre con que SI gasta, porque cuesta el riesgo entero y ninguno de tus tres casos lo exime; y
      con que la salida en negativo sin stop NO gasta. Las dos cosas son lectura nuestra
      (cartucho_criterio, RN-016, RN-019). Se lleva a la sesion 2
    resuelve_en: [F21, F22]
