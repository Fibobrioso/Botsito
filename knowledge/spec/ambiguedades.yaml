  - id: A-23
    titulo: que proveedor es la referencia para medir la fidelidad
    pregunta: >-
      el trader decide sobre velas de Oanda (FX Replay) y el bot se mide sobre otras. ¿cual es la
      referencia? DECIDIDO por el consultor el 2026-09-12: DUKASCOPY (ADR-0005), porque cubre 2026
      entero, es publico y reproducible, y donde se puede comparar esta a 2 puntos del feed del
      broker. MT5/FundedNext no puede sustituirlo -no sirve los meses del paquete: cero velas M1
      de mayo- y se usa para lo que si aporta: spread real, condiciones de ejecucion, reloj de
      servidor y paridad con Strategy Tester. La divergencia entre proveedores entra en F26 como
      MARGEN DECLARADO y no como ruido ignorado: una regla que depende de romper por una milesima
      puede cambiar de decision dentro de ese margen. Cuanto vale ese margen frente a Oanda es
      A-16, que sigue abierta
    resuelve_en: [F26, F17, F24]
    evidencia:
      - ev-v6-002414-d59b1c82
    parametros: []
