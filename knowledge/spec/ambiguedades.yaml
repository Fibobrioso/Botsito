  - id: A-22
    titulo: si el bot opera noticias, y que pasa con la capacidad para otras cuentas
    pregunta: >-
      el trader opera noticias en sus cuentas propias -que no lo prohiben- y su estrategia funciona
      dentro de esos eventos. ¿el bot hace lo mismo? DECIDIDO por el consultor el 2026-09-12: NO en
      la primera version, porque va a una cuenta fondeada que puede prohibirlo como norma y la
      sancion es perder la cuenta aunque la operacion acabe en profit. La CAPACIDAD se conserva:
      `filtro_noticias` mantiene la opcion `no`, asi que el dia que el bot corra en una cuenta que
      lo permita se cambia el valor y nada mas. Lo que falta por saber -que ventana exacta- es A-17.
      SENTIDO INVERTIDO el 2026-09-14 por la enmienda de ADR-0022 (que la nombra, y por eso sigue
      siendo su decision): la cuenta elegida es FTMO 2-Step Swing, sin restriccion de noticias
