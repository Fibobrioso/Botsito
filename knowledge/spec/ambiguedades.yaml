  - id: A-33
    titulo: tres ganadoras que cierran por debajo de 3R
    pregunta: >-
      en la sesion 1 dijiste "sin toma de parciales y que tiene que llegar al ratio 1.3 si o si"
      (v6 0:17:07). Pero en tu material hay TRES operaciones GANADORAS que CIERRAN por debajo de
      3R: una en agosto (2,50) y dos en abril (2,57 y 2,94), en dos meses independientes.
      ¿cerraste esas a mano? ¿tomaste parciales en ellas? ¿o hubo otro motivo -un break even que
      salto, una noticia, cerrar antes de una sesion-? No te preguntamos si tomas parciales EN
      GENERAL, que ya lo contestaste: te preguntamos que paso en esas. MEDIDO ANTES DE
      PREGUNTAR, y es lo que hace que la pregunta exista: `maxTP` es el PRECIO DE CIERRE de las
      ganadoras y no la excursion maxima -`== avgClosePrice` en 17 de 17 filas de abril donde
      existen las dos, y presente si y solo si `rPnL > 0`-, asi que esas tres no son operaciones
      que NO LLEGARON a 3R: son operaciones que CERRARON en ganancia por debajo de 3R. En F14a
      esa columna se habia SUPUESTO al reves (ADR-0037 y su correccion del 2026-09-22).
      OBSERVACION DESCRIPTIVA del 2026-09-22 (MAYO-DEV, ADR-0040), sin atribuir causa: ganadoras
      por debajo de 3R = agosto 1 (2,50), abril 2 (2,57; 2,94), mayo 1 (2,90), esta ultima
      sobre los 6 dias `dev` de mayo
    resuelve_en: [F20, F24, F26]
    # NO hay item de evidencia de v6 0:17:07: la cita vive en la `pregunta`, copiada literal de la
    # transcripcion CRUDA. Se citan los items REALES que hay sobre parciales; inventar un id seria
