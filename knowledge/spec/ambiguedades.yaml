  - id: A-28
    titulo: el reloj del servidor de FTMO y su regla de horario de verano
    pregunta: >-
      MEDICION, no pregunta al trader. ¿cuanto va el reloj del servidor de FTMO por delante de UTC
      en horario estandar, y con que calendario cambia de hora: el de Nueva York, el europeo o
      ninguno? La ficha de FTMO dice "GMT+2 +DST" sin nombrar el calendario, y lo que midio la demo
      de FundedNext (120 minutos, calendario de Nueva York) no se hereda (ADR-0026). Desde ADR-0027
      este reloj ya no decide el dia de riesgo, que es civil; decide la rejilla de velas del
      servidor y si anclaje_h4 (17:00 Nueva York) cae de verdad en su medianoche. COMPROBAR EL
      CALENDARIO EXIGE OBSERVAR UNA TRANSICION de hora en el terminal, asi que esta ambiguedad NO SE
      CIERRA ANTES DEL CAMBIO DE HORA DE OCTUBRE: el desfase base se puede medir cualquier dia, la
      regla de horario de verano no.
      VERIFICACION EXPLICITA (añadida el 2026-09-14 al validar la rama): confirmar EN EL PANEL de la
      prueba gratuita de FTMO que el corte del dia de riesgo -cuando se recalcula el limite diario-
      cae a medianoche CE(S)T y NO a la medianoche del servidor. Las dos se separan una hora (el
      servidor va a GMT+2/+3 y CE(S)T a GMT+1/+2) y equivocarse cuesta la cuenta. reloj_dia_riesgo
      se queda CONFIRMED en `civil_operativa` por el reglamento (ADR-0027); si el panel dijera otra
      cosa, se reabre A-19 y el parametro vuelve a DEFAULT_AMBIGUOUS
    resuelve_en: [F17]
