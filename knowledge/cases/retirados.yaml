# LOS DIAS RETIRADOS DEL HOLDOUT (ADR-0041). Un dia reservado cuya exposicion no se puede descartar
# sale del holdout: deja de MEDIRSE y sigue OCULTO -la puerta lo rechaza siempre, con o sin
# autorizacion-. No pasa a desarrollo y no se sustituye por ningun otro dia.
#
# SOLO ANADIR, como `knowledge/corpus/libros.yaml`: una entrada commiteada no se edita ni se borra
# (`knowledge validate` lo comprueba version a version contra el historial). Cada entrada va por la
# HUELLA del id del caso -sha256 del id, `holdout.huella_de_caso`-, nunca por el id ni por la
# fecha, y la huella tiene que ser la de un caso que este en una particion reservada.
#
# EL REPARTO NO SE TOCA (ADR-0036): `particiones.yaml` sigue declarando su cupo. Por eso la
# diferencia se escribe aqui: el artefacto de fidelidad `eurusd-2026-09` declara 10 dias en
# `fidelidad-1` y, con las retiradas de abajo (una del 2026-09-23 y tres del 2026-10-17, rama
# trabajo/sesgo-h4-color), la medida de `fidelidad-1` se hace sobre 6. Ningun dia sustituye a un
# retirado.
