# Mapa parametro -> evidencia (F10, ADR-0011; podado en F13). Manual, versionado con `Fuente:`.
# El registro (knowledge/spec/parametros.yaml) no admite claves extra, asi que el enlace con la
# evidencia vive aqui: `temas` son raices o temas de knowledge/evidence/_temas.yaml (lo que
# `retrieval.buscar(tema=...)` acepta) y dicen QUE SE LE ENSENA AL TRADER cuando se le pregunta
# por este parametro. Es lo unico que queda, y es lo unico que no tiene otra casa.
#
# En F13 murieron las otras dos columnas, cada una porque su dato ya vivia en otro sitio:
#   - `opciones` -> las da el registro (`opciones` del parametro enum). Eran identicas donde
#     coincidian, pero `dias_operables` tenia enum en el registro y nada aqui: el cuestionario
#     preguntaba abierto por algo que el registro solo admite cerrado.
#   - `ambiguedad` -> la da `knowledge/spec/ambiguedades.yaml` (`parametros` de cada A-N), que es
#     donde el consultor abre y cierra preguntas. Esta columna llevaba parada desde F10: de las
#     diez A-N nacidas despues, NINGUNA figuraba aqui, y en A-7 ademas decia otra cosa. Antes de
#     borrarla, su unica arista viva (A-7 -> stop_segundo_esquema) se mudo a ambiguedades.yaml.
parametros:
  ventana_inicio: {temas: [ventana.velas_h4_7_11_15, ventana.ficha_fila_1, ventana.sesiones, ventana.solo_londres]}
  ventana_fin: {temas: [ventana]}
  cierre_forzoso_fin_ventana: {temas: [ventana]}
  sesgo_h4_regla: {temas: [sesgo]}
  liquidez_m15_criterio_toma: {temas: [liquidez]}
  stop_fraccion_caja: {temas: [stop.nivel, stop.075_suficiente, stop.introducido_en_operacion_075]}
  stop_colchon_spread: {temas: [stop.colchon_spread_075_080, stop.acordado_075_mas_spread, stop.075_desplazado_por_spread_y_lotaje]}
  stop_reduccion_fraccion: {temas: [stop.bajar_050]}
  stop_reduccion_umbral_vela: {temas: [stop.bajar_050]}
  stop_proteccion_capital: {temas: [stop.proteger_025_capital, stop.proteger_inmediato_guarda_025, stop.reduccion_limite_025]}
  stop_segundo_esquema: {temas: [stop.segundo_esquema_bajo_zona_control, stop.esquema2_depende_del_precio, stop.075_esquema1_variable_esquema2]}
  stop_en_orden_pendiente: {temas: [stop.introducido_en_operacion_075, stop.proteger_al_entrar]}
  break_even_condicion: {temas: [break_even]}
  objetivo_rr: {temas: [objetivo.rr, objetivo.rr_fijo_tras_stop, objetivo.rr_minimo]}
  objetivo_extension: {temas: [objetivo.maximizar_hasta_050_liquidez, objetivo.target_maximo_liquidez_m15, objetivo.extension_subjetiva]}
  cartuchos_max: {temas: [cartuchos]}
  reentrada_tras_equal: {temas: [reentrada]}
  reubicacion_cadencia: {temas: [entrada.orden_limite]}
  salida_sin_ruptura: {temas: [entrada.equal_cierre_anticipado, entrada.equal_preferir_proteger]}
  mapeo_dos_velas: {temas: [mapeo.dos_velas_como_una, mapeo.m1.vela_contraria_marca_extremo]}
  parciales: {temas: [parciales]}
  riesgo_por_operacion: {temas: [riesgo.por_operacion, riesgo.fondeo.por_operacion, riesgo.crecimiento_geometrico]}
  lotaje_base: {temas: [lotaje.distancia_completa, lotaje.no_desde_075, lotaje]}
  anclaje_h4: {temas: [reloj, ventana.velas_h4_7_11_15]}
  dias_operables: {temas: [ventana.sesiones, ventana.velas_h4_7_11_15, ventana]}
  filtro_noticias: {temas: [herramientas.sin_noticias, stop.respiro_con_noticias]}
  spread_maximo: {temas: [stop.colchon_spread_075_080, stop.respiro_con_noticias, stop.075_desplazado_por_spread_y_lotaje]}
  perdida_maxima_diaria: {temas: [riesgo.por_operacion.calculo_racha, riesgo.fondeo]}
  perdida_maxima_semanal: {temas: [riesgo.fondeo, riesgo.por_operacion.calculo_racha]}
  comportamiento_sin_regla: {temas: [no_trade]}
