# Contexto humano de cada pregunta del kit (F10, ADR-0011). Manual, versionado con `Fuente:`.
#
# El cuestionario generado (`<sesion>/cuestionario.yaml`) tiene el enunciado corto y las citas
# exactas; aqui esta lo que el TRADER necesita para entender que le preguntamos y por que, y lo
# que el consultor necesita para saber si una respuesta sirve. Lo consume
# `scripts/hoja_sesion_docx.py` para generar la hoja de respuestas en Word.
#
# La clave es el ORIGEN de la pregunta: el id de la ambiguedad (`A-N`) cuando la pregunta nace de
# una, o el nombre del parametro del registro cuando nace de un UNKNOWN suelto. Asi el contexto
# sobrevive a que el cuestionario se regenere y cambien los numeros `P-NN`.
#
# EXCEPCION de estilo: este fichero es texto que LEE EL TRADER, asi que va con acentos, al
# contrario que el resto del repositorio.
#
# Campos: `titulo` (encabezado corto para la hoja), `pregunta` (completa, en lenguaje del
# trader), `porque` (que sabemos y que falta), `respuesta_util` (que forma tiene una respuesta
# que podamos usar).

precondicion:
  titulo: "Confirmación previa sobre los meses del paquete"
  pregunta: >-
    Antes de empezar con las ventanas: ¿has operado, backtesteado o revisado en replay algún día
    de {meses} en EURUSD? Da igual si fue una sesión suelta o un backtest completo.
  porque: >-
    Los días que vas a etiquetar salen de esos meses precisamente porque no aparecen en ninguna de
    las grabaciones que tenemos. Si ya los has visto, tus decisiones serían recuerdos en vez de
    decisiones, y la medida de fidelidad del bot saldría inflada. Preferimos cambiar de meses
    antes que medir mal.
  respuesta_util: >-
    Un sí o un no claro. Si la respuesta es sí, dinos qué mes y con qué profundidad lo viste, y
    cambiamos el paquete por otros meses antes de etiquetar nada.

preguntas:
  A-2:
    titulo: "Cartuchos por zona de liquidez"
    pregunta: >-
      Cuando el precio barre una zona de liquidez de M15 y se te da el esquema de entrada,
      ¿cuántos intentos te permites en esa misma zona antes de parar y esperar a que se forme
      otra? Y acláranos qué cuenta como intento: ¿una salida en break even gasta intento?, ¿y una
      entrada que se invalida antes de activarse?
    porque: >-
      En la ficha de reglas que respondiste marcaste límite estricto de dos cartuchos, y en la
      entrevista del 30 de agosto dijiste que sueles hacer hasta un tercer trade y que un break
      even no consume cartucho. Son dos números distintos para la misma regla. El bot tiene que
      elegir uno: con dos deja de operar antes, con tres arriesga una vez más cada día.
    respuesta_util: >-
      Un número, 2 o 3, y una frase sobre qué cuenta como intento (break even, entrada invalidada,
      reentrada después de un equal).
  A-4:
    titulo: "Break even: al tocar o al cierre"
    pregunta: >-
      Cuando el precio llega al nivel que te hace mover el stop a break even, ¿lo mueves en el
      instante en que el precio toca ese nivel, o esperas a que la vela cierre por encima o por
      debajo de él? Si depende del esquema de entrada, dinos cuál es cuál.
    porque: >-
      Has dicho tres cosas que no se contradicen entre sí pero que dejan el disparador sin
      definir: que pones break even cuando se genera la otra zona de control, que la entrada se
      pone en break even apenas se genera el bloque, y que lo pones cuando se cumplen las
      condiciones. El bot necesita un disparador exacto: si es el toque, protege antes y te sacan
      más veces; si es el cierre, aguanta las mechas y a veces pierde la protección.
    respuesta_util: >-
      Una de las dos palabras, tocar o cierre. Si cambia según el esquema, dilo así: esquema 1
      tocar, esquema 2 cierre.
  A-9:
    titulo: "Anclaje de la vela de 4 horas"
    pregunta: >-
      ¿A qué hora abre la primera vela de 4 horas del día en tu gráfico, y en qué huso horario
      está configurado ese gráfico? Necesitamos además una captura de pantalla de esa
      configuración. Y una segunda parte: en las semanas de marzo y octubre en que Europa y
      Estados Unidos cambian la hora en fechas distintas, ¿tus velas H4 se desplazan o siguen
      abriendo a la misma hora de tu reloj?
    porque: >-
      Nos dijiste que tienes el gráfico en UTC+2 y que tus velas van de 7 a 11 y de 11 a 3. Si el
      bot ancla las velas a medianoche de Madrid le salen a las 00, 04, 08, 12 y 16, que no es lo
      que tú ves; si las ancla al cierre de Nueva York le salen a las 23, 03, 07, 11 y 15, que sí
      coincide contigo. De esto depende qué vela fija el sesgo, o sea la dirección de la mitad de
      los días. No se puede deducir mirando grabaciones: hay que ver tu configuración.
    respuesta_util: >-
      La hora de apertura y el huso tal como aparecen en tu plataforma, más la captura de
      pantalla. Y una frase sobre qué pasa en las semanas del cambio de hora.
  A-1:
    titulo: "Qué vela H4 fija el sesgo"
    pregunta: >-
      ¿Qué vela de 4 horas te dice si hoy solo buscas compras o solo ventas, y qué tiene que pasar
      exactamente para que ese sesgo cambie de dirección? ¿Basta con que la vela anterior cierre
      en el color contrario, o hace falta que cierre por encima o por debajo de la anterior,
      contando las mechas?
    porque: >-
      Sobre esto tenemos tres versiones tuyas: que la vela H4 previa cerrada fija el sesgo; que
      una vela verde no lo cambia salvo que cierre con mecha por encima y genere el breaker; y que
      el sesgo sigue alcista mientras ninguna vela termine por debajo, al menos con la mecha.
      Además dejaste abierta una simplificación: ignorar las envolventes y quedarte solo con el
      color de la vela anterior. El bot solo puede aplicar una regla.
    respuesta_util: >-
      La regla en una frase, con el criterio exacto de cambio. Si la simplificación de mirar solo
      el color de la vela anterior te vale, dilo, porque es mucho más fácil de automatizar y de
      auditar después.
  A-3:
    titulo: "Qué hacer si la entrada se activa sin ruptura"
    pregunta: >-
      Si tu orden límite se activa porque el precio llega al nivel, pero la estructura no llega a
      romperse, ¿cierras esa operación o la dejas correr protegida? Si la cierras, ¿en qué momento
      exacto: al cierre de esa vela, después de varias velas, o al llegar la hora de cierre?
    porque: >-
      En la misma entrevista dices que lo objetivo sería cerrar cuando la vela cierre sin rotura,
      y poco después que también puede darse el trade sin tocar el 0,75 y que prefieres proteger y
      dejarlo. Son dos comportamientos incompatibles y el bot solo puede hacer uno.
    respuesta_util: >-
      Cerrar o dejar. Si cierras, el momento exacto.
  A-5:
    titulo: "Cada cuánto se reubica la orden límite"
    pregunta: >-
      Mientras tu orden límite todavía no se ha activado y el precio se sigue desarrollando,
      ¿cada cuánto la cambias de sitio? ¿En cada vela nueva de M1, solo cuando aparece una
      estructura nueva, o cuando se rompe algo concreto?
    porque: >-
      Dices que la orden se va bajando conforme se desarrolla el precio y que se va moviendo con
      el flujo hasta que se rompa, pero nunca dices con qué frecuencia. Un bot tiene que hacerlo
      en un momento definido: si la mueve en cada vela persigue el precio, si solo la mueve al
      aparecer una estructura se queda quieto mucho más tiempo, y el resultado no es el mismo.
    respuesta_util: >-
      Un disparador concreto: cada vela, cada nueva zona de control, cada nuevo mínimo o máximo
      del flujo, u otro que nos digas.
  A-6:
    titulo: "Hora de cierre y cierre forzoso"
    pregunta: >-
      ¿A qué hora dejas de operar y qué haces con una operación que sigue abierta a esa hora: la
      cierras en el momento o la dejas hasta que llegue a su objetivo o a su stop? Dinos también
      en qué reloj está esa hora, el tuyo de España o el del bróker.
    porque: >-
      Dices que a las 3 de la tarde en punto se cierra el trade, y en otro momento hablas de dejar
      correr hasta que venza la vela H4. El huso importa más de lo que parece: si tu reloj y el
      del bróker se separan una semana al año por el cambio de hora, esa hora se mueve y el bot
      cerraría a destiempo.
    respuesta_util: >-
      Una hora con su huso, y un sí o un no al cierre forzoso.
  A-7:
    titulo: "Dónde va el stop en el segundo esquema"
    pregunta: >-
      En el segundo esquema de entrada, ¿dónde colocas exactamente el stop? ¿En el mismo 0,75 de
      la caja que usas en el primero, o por debajo de la zona de control aunque eso cambie la
      distancia en cada operación? Si es lo segundo, ¿cómo decides el punto?
    porque: >-
      Aquí has dicho varias cosas: que usualmente va en 0,75; que proteges por debajo de la zona
      de control y que a veces eso es 0,50; que puede quedar en 0,60 aproximadamente; y luego
      aceptaste como opción simple dejarlo estático en 0,75 para los dos esquemas. Queremos saber
      si esa opción simple te vale de verdad, porque la distancia del stop es lo que fija el
      lotaje de cada operación.
    respuesta_util: >-
      O una fracción fija, o la regla para encontrar el punto. Si aceptas 0,75 fijo para empezar,
      dilo explícitamente y lo anotamos como decisión tuya, no como suposición nuestra.
  A-8:
    titulo: "Cuándo dos velas cuentan como una"
    pregunta: >-
      Cuando mapeas la estructura en M1, a veces tratas dos velas seguidas como si fueran una
      sola. ¿Cuál es la condición para agruparlas? ¿Que en una temporalidad mayor sean una única
      vela, que juntas formen un order block, u otra cosa?
    porque: >-
      Dijiste que un tramo que en una temporalidad mayor es una vela se considera una vela, y que
      en un flujo alcista una vela roja marca un mínimo. Para el bot esto es la diferencia entre
      ver una estructura o ver dos, y de ahí sale dónde coloca la orden.
    respuesta_util: >-
      La condición exacta. Si te resulta más fácil, señálala sobre un ejemplo del gráfico durante
      la sesión y lo grabamos.
  A-10:
    titulo: "El stop en 0,75 o en 0,80"
    pregunta: >-
      El stop dentro de la caja: ¿va en el 0,75 o en el 0,80? Y si es 0,80, ¿es un número fijo o
      es el 0,75 más el spread que haya en ese momento? Si es lo segundo, ¿cuánto margen das y qué
      haces cuando hay noticias y el spread se dispara?
    porque: >-
      En dos grabaciones dices 0,75 y en la de septiembre dices que proteges a 0,80 y que ese es
      el SL por defecto. También hablas de dar un pequeño respiro de uno o dos pips. El sistema lo
      ha marcado como contradicción abierta porque es el mismo parámetro con dos valores. Si es
      fijo, el bot pone un número; si es spread, tiene que leerlo del bróker en cada operación y
      el resultado cambia.
    respuesta_util: >-
      Una fracción, y la palabra fijo o spread. Si es spread, el margen en pips y qué se hace con
      noticias.
  A-11:
    titulo: "El stop en la orden pendiente o después del llenado"
    pregunta: >-
      Cuando dejas la orden límite puesta esperando, ¿el stop loss ya va dentro de esa orden, o lo
      colocas a mano después de que la orden se llene?
    porque: >-
      Dices que el stop que se introduce en la operación es el 0,75 y que hay que proteger el
      trade apenas se genera la entrada, pero no queda claro si el stop viaja dentro de la orden
      pendiente. Para el bot es una diferencia de seguridad: si va en la orden, una desconexión no
      te deja desprotegido; si se pone después, hay un hueco de tiempo sin stop.
    respuesta_util: >-
      En la orden, o tras el llenado. Si te da igual, dinos que te da igual y lo ponemos en la
      orden por seguridad.
  A-12:
    titulo: "Cuándo bajar la protección y hasta dónde"
    pregunta: >-
      Dices que cuando ha pasado buena parte de la vela sin que el precio avance bajas la
      protección. ¿A partir de qué parte de la vela lo haces, y a qué nivel bajas el stop?
    porque: >-
      La transcripción antigua decía 40 por ciento de la vela y la transcripción nueva, mucho más
      fiable, dice más del 50 por ciento. También dices que como mucho se reduce de 0,75 a 0,50.
      Necesitamos el número que usas de verdad, porque el bot tiene que mirar el reloj de la vela
      para aplicarlo.
    respuesta_util: >-
      Un porcentaje de la vela transcurrido y la fracción de la caja a la que bajas.
  ventana_inicio:
    titulo: "Hora de inicio de la ventana operativa"
    pregunta: >-
      ¿A qué hora empiezas a buscar entradas cada día, en tu reloj?
    porque: >-
      Todo lo que has dicho apunta a las 7 de la mañana hora de España, pero nunca lo hemos fijado
      como dato con tu firma. Es la hora a la que el bot se despierta y empieza a mirar.
    respuesta_util: >-
      Una hora con su huso.
  liquidez_m15_criterio_toma:
    titulo: "Cómo se da por tomada la liquidez de M15"
    pregunta: >-
      Para dar por tomada la liquidez de M15, ¿hace falta que la vela cierre con el cuerpo por
      encima del máximo o por debajo del mínimo, o basta con que la mecha lo perfore?
    porque: >-
      Dices que la liquidez de M15 se toma por encima del alto y con cuerpo, y en otros momentos
      hablas de barridos con mecha. Es el disparador de todo el proceso que viene después: si vale
      la mecha, hay bastantes más señales al día.
    respuesta_util: >-
      Cuerpo o mecha. Si depende de algo, dinos de qué.
  stop_proteccion_capital:
    titulo: "Cuánto riesgo se guarda al proteger"
    pregunta: >-
      Cuando mueves el stop nada más entrar, dices que guardas una parte del riesgo. ¿Qué parte
      exactamente, y cómo se refleja en el resultado de una operación ganadora?
    porque: >-
      Hablas de proteger 0,25 del capital y de que una ganadora acaba en 3,25 en vez de 3 sumando
      ese 0,25. Queremos confirmar el número y que la cuenta se hace así, porque es lo que el bot
      va a registrar como resultado de cada trade.
    respuesta_util: >-
      Una fracción, y una frase confirmando el efecto en el resultado.
  objetivo_rr:
    titulo: "Objetivo de riesgo beneficio"
    pregunta: >-
      ¿Cuál es tu objetivo de riesgo beneficio, y es fijo o lo mueves según lo que veas? Si a
      veces lo amplías, ¿bajo qué condición exacta?
    porque: >-
      Dices que 1 a 3 es lo mínimo y lo que buscas en todos los backtest, y también que existe la
      posibilidad de ampliar a 1 a 4 más adelante. El bot necesita saber si el objetivo es un
      número fijo o si hay una regla para extenderlo, porque una cosa se automatiza y la otra no.
    respuesta_util: >-
      Un número. Si hay extensión, la condición que la dispara.
  objetivo_extension:
    titulo: "Hasta dónde se extiende el objetivo"
    pregunta: >-
      Cuando decides ir a por más de tu objetivo normal, ¿hasta dónde llevas el objetivo? ¿Hasta
      la liquidez de M15 entera, hasta la mitad de esa distancia, o hasta otro punto?
    porque: >-
      Dices que el profit máximo que sueles buscar es la liquidez de M15, y en otro momento hablas
      de maximizar hasta el 0,50 de esa distancia. Si esto es puramente subjetivo, es mejor que
      nos lo digas: lo dejamos fuera del bot en vez de inventar una regla que no cumples.
    respuesta_util: >-
      Una fracción de la distancia hasta la liquidez, o decirnos que es discrecional y que el bot
      no debe hacerlo.
  reentrada_tras_equal:
    titulo: "Reentrada después de un equal"
    pregunta: >-
      Cuando el precio activa tu orden sin llegar a romper la estructura, lo que llamas un equal,
      ¿vuelves a entrar si después rompe de verdad? ¿Y esa reentrada gasta uno de tus intentos del
      día?
    porque: >-
      Dices que el equal se cuenta como pérdida, que se reentra si el precio rompe de nuevo la
      zona y que hay que esperar a que rompa por arriba. Falta lo segundo: si la reentrada consume
      cartucho, porque eso conecta directamente con la pregunta de los intentos por zona.
    respuesta_util: >-
      Un sí o un no a la reentrada, y un sí o un no a que gaste intento.
  parciales:
    titulo: "Parciales"
    pregunta: >-
      ¿Tomas parciales durante la operación? Si hoy no los tomas pero piensas hacerlo, dinos en
      qué punto y qué porcentaje, para dejarlo anotado sin meterlo todavía.
    porque: >-
      Dices que no tomas parciales por ahora, que no los has probado, que si los tomaras serían
      del 30 al 40 por ciento y que sería discrecional, y además lanzaste la idea de un 50 por
      ciento al llegar a 1 a 2. Para la primera versión del bot necesitamos un sí o un no claro.
    respuesta_util: >-
      Sí o no. Si es no por ahora, dilo así y anotamos la idea aparte para probarla más adelante.
  riesgo_por_operacion:
    titulo: "Riesgo por operación"
    pregunta: >-
      ¿Qué porcentaje de la cuenta arriesgas por operación, y es el mismo en tu cuenta de fondeo
      que en backtest? Si lo escalas sobre el saldo en vez de dejarlo fijo, dilo.
    porque: >-
      En backtest calculas el RR sobre el 1 por ciento, y para la cuenta de fondeo hablaste de
      entrar con 0,50 o 0,40 escalado, porque con siete pérdidas seguidas un 1 por ciento quemaría
      la cuenta. El bot necesita el número con el que va a operar de verdad, no el de las pruebas.
    respuesta_util: >-
      Un porcentaje, y la palabra fijo o escalado.
  lotaje_base:
    titulo: "Sobre qué distancia se calcula el lotaje"
    pregunta: >-
      Para calcular el lote, ¿mides la distancia completa de la caja, del nivel 0 al nivel 1, o
      mides solo hasta el 0,75, que es donde acabará el stop?
    porque: >-
      Dices que el lotaje se calcula sobre la distancia completa y que probaste calcularlo desde
      el 0,75 y no te fue bien por el drawdown. Queremos confirmarlo con tu firma, porque de aquí
      sale el tamaño de cada operación y cualquier error se multiplica.
    respuesta_util: >-
      Distancia completa, o desde el 0,75.
