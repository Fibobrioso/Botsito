# Datos de negocio del kit de elicitacion (F10, ADR-0011). Manual, versionado; cada commit cita
# `Fuente:`. Viven aqui como DATOS porque src/botsito no puede contener cifras de negocio
# (tests/contract/test_no_business_literals.py): el paquete de cada sesion copia esta cabecera y
# `botsito kit check` recompone desde ella. Las horas van en `huso_operativa` (registro).
simbolo: EURUSD
dataset_prefijo: eurusd-m1-
# Dia operativo de un caso: contexto de mapeo desde medianoche hasta el cierre de la ventana
# operativa (ev-v3-000138-567dc5d7, ev-v3-000157-b26147c7, ev-v4-011514-fe34ac7e).
ventana_local:
  desde: "00:00"
  hasta: "15:00"
# Unidades de etiqueta: las dos sesiones H4 que el trader declara (ev-v3-000157-b26147c7,
# ev-v4-011425-ae028b78, ev-v1-000049-6a31caa6). La sesion 1 confirma si es su unidad.
sesiones:
  - nombre: "07-11"
    desde: "07:00"
    hasta: "11:00"
  - nombre: "11-15"
    desde: "11:00"
    hasta: "15:00"
# Anclajes candidatos de la vela H4 mientras A-9 siga abierta (MASTER_PLAN H.2, ADR-0005). Solo
# el de Nueva York reproduce las H4 de 07/11/15 Madrid que el trader describe.
anclajes_candidatos:
  - etiqueta: madrid-00
    hora: "00:00"
    huso: Europe/Madrid
    coincide_con_sesiones: false
  - etiqueta: servidor-ny-17
    hora: "17:00"
    huso: America/New_York
    coincide_con_sesiones: true
# Un dia entra en el universo solo si su ventana completa esta dentro del dataset y tiene al
# menos estas velas M1 (15 h = 900 minutos; el margen absorbe minutos sin ticks).
min_velas_ventana: 850
# Conjunto cerrado de decisiones por sesion (kappa).
etiquetas: [compra, venta, no_trade]
# Hasta donde llega el MATERIAL DEL TRADER, por mes (ADR-0036, ampliado el 2026-09-21). Responde
# una pregunta DISTINTA de la de `vistos.yaml`, y las dos hacen falta porque son ortogonales:
#
#   vistos.yaml         ->  ¿ES CIEGO?       abril: NO.  junio: SI.
#   cobertura_material  ->  ¿HAY MATERIAL?   abril: SI.  junio: NO.
#
# SOLO TRAMOS, nunca una lista de dias: un dia laborable dentro del rango que no aparezca en la
# columna de fechas del backtest es un dia sin operaciones, y eso ES su etiqueta.
#
# UN MES CON CERO TRAMOS dice "hay decision sobre este mes y NO hay material". Un mes que NO
# aparece aqui queda SIN ACOTAR, no excluido (`solo_con_cobertura` sigue en False): asi un mes
# legitimo que nadie haya declarado todavia no se niega solo.
#
# NO SE DECLARAN enero, abril, julio ni agosto, y el motivo es de proceso y no de olvido: sus
# tramos saldrian de leer la columna de fechas de sus backtests, y eso lo hace EL CONSULTOR una
# sola vez antes del sorteo y lo declara el mismo dia (ADR-0021 §1, CLAUDE.md). Los cuatro estan
# en `vistos.yaml`, asi que ningun paquete ciego los sortea; el dia que hagan falta aqui, se
# declaran con su lectura y su exposicion.
cobertura_material:
  # El trader backtesteo mayo ENTERO y lo entrego el 2026-09-11 (68 operaciones). El tramo no sale
  # de leer el fichero: sale de esa declaracion, que ya estaba escrita en `vistos.yaml`.
  "2026-05":
    - desde: "2026-05-01"
      hasta: "2026-05-31"
      entregado_el: "2026-09-11"
      fuente: [8fb2323]
      # EL MES DEL MATERIAL, DECLARADO (2026-09-22): el sha del libro, COPIADO del manifiesto del
      # corpus (`knowledge/corpus/manifest.yaml`), no recalculado. `casos ingerir` compara el sha
      # del `--material` con este y solo pide los dias de ESTE mes, sin leer una fila.
      material_sha256: "ba3aeceb6c496c2f4191540a9d79ca4a0bda078254a39c0290ed4d714a3aa74c"
  # CERO TRAMOS: junio NO tiene material y nunca lo tendra. El trader se comprometio a dos meses y
  # entrego uno, asi que para junio no hay ninguna decision suya (ADR-0025 §1). NO esta en
  # `vistos.yaml` y es CORRECTO que no este -el trader no lo vio-: es ciego y esta vacio, que es
  # justo la combinacion que hasta hoy no se podia expresar. Sin esto, sus 10 dias `dev` del
  # reparto de la sesion 1 siguen siendo ingeribles y un `kit build` nuevo volveria a sortearlo.
  "2026-06": []
  # El material de septiembre cubre del 1 al 18. Ya declarado en `knowledge/cases/fidelidad/
  # config.yaml` y en `vistos.yaml`: aqui se repite, no se lee nada nuevo.
  "2026-09":
    - desde: "2026-09-01"
      hasta: "2026-09-18"
      entregado_el: "2026-09-20"
      fuente: [5c9fcc3, ADR-0034]
      # SIN `material_sha256`, a proposito (2026-09-22, ADR-0039): hay material de septiembre y
      # `casos ingerir` no lo lee. El sha vuelve cuando septiembre tenga su brief Y su medida en
      # `knowledge/corpus/libros.yaml`, los dos a la vez.
# Asignacion de los casos (MASTER_PLAN H "Tres particiones reservadas").
# OJO: estos cupos se dimensionaron para los 40 dias de mayo+junio. JUNIO QUEDA DESCARTADO
# (decision del consultor, 2026-09-12), asi que el reparto REAL de la sesion 1 es 6 dev y 13
# holdout (6/4/3) sobre los 19 dias de mayo. ADR-0025 decide DEJARLO ASI y no reparticionar,
# aunque todavia seria legitimo -no existe ningun LABEL_CASE-: `particiones.yaml` se reproduce
# byte a byte SIN exencion, y es la unica prueba mecanica de que las particiones se fijaron antes
# de etiquetar. Ese es el motivo, y es el unico que queda.
#
# DESDE EL 2026-09-21 (enmienda de ADR-0035) ESTE FICHERO SE PUEDE EDITAR. Hasta entonces habia
# ademas un motivo mecanico -`cases/paquete.py` comparaba el config que el paquete guardo contra
# este fichero, asi que cambiarlo rompia la comprobacion de la sesion 1 entera- y ya no es cierto:
# cada paquete se recompone con SU bloque `config:` congelado, y cambiar estos numeros para el
# paquete SIGUIENTE solo produce un aviso de deriva en `knowledge validate`. Es lo que septiembre
# exige: sus 14 dias laborables no dan para 40 cupos. Lo que cambie aqui vale para el PROXIMO
# `kit build` y para ninguno de los ya escritos.
particiones:
  dev: 16
  holdout-1: 8
  holdout-2: 8
  holdout-3: 8
