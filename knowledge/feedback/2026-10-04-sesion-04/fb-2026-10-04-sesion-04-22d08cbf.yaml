respuesta_literal: ¿una zona se limpia si hay velas verdes y rojas o terrenos rojos? ¿Es solo eso? Claro,
  exacto. [...] Para precisar, en el esquema 2, ¿cuántas velas puede tener como máximo el retroceso? ¿Una,
  dos, tres, no importa, u otra? Eso es indiferente, no importa [...] se alterna de una vela verde a una
  vela roja, entonces ya allí ya quedaría invalidado ya, o sea quedaría invalidado porque lo está haciendo
  antes de la ruptura del posible punto de breaker
