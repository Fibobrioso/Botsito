valor_resultante: 'una zona esta limpia si no hay velas verdes y rojas alternandose antes de la ruptura
  del posible punto de breaker, y es solo eso; el numero de velas del retroceso no importa. En el motor
  es solo_una_zona_de_control: cada alternancia forma una zona de control y RN-009 ya la rechaza (ADR-0076)'
notas: 'S-10 (A-21): ev-v10-011725-3741e266 (sin alternancia, «es solo eso»), ev-v10-011734-fedd3f8e (el
  numero de velas no importa) y ev-v10-011957-7ebb3453 (la alternancia antes de la ruptura invalida).
  Lo dijo tambien en la sesion 3 (v9 1:19:57, la lectura candidata de la pregunta). Medido en ADR-0076:
  la alternancia la filtra ya zonas_control_max_por_esquema = 1 (RN-009); las series con una vela sin
  cuerpo en medio y el breaker contrario con mecha son las dos preguntas de la sesion 5'
