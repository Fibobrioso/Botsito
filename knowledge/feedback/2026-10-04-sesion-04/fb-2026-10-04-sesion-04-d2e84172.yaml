notas: 'Primera respuesta por WhatsApp a la pregunta P1 de R3.1 (CORRIDA-CONSTRUCCION.md §4.5). «con mecha
  o con cuerpo es válido para un cambio de sesgo»: romper el extremo de la H4 anterior con la mecha basta,
  y con el cuerpo tambien (es un caso de la mecha), asi que sesgo_h4_criterio_ruptura sigue en mecha y
  CONFIRMED, y este registro pasa a ser su fuente en lugar de fb-2026-09-09-sesion-01-8eccf5c0, cuyo literal
  no decia mecha (re-expresion canonica del consultor en F11; CORRIDA-CONSTRUCCION.md §4.3 y §4.7 punto
  4). El trader ya habia dicho la mecha en voz: fb-2026-09-09-sesion-01-41f46b21 («o bien, con una mecha»),
  ev-v9-001312-19e45e4a («romper con mecha … inclusive con un pip») y ev-v9-000902-25db5bf5 («con mecha
  o con cuerpo por debajo»). Lo que el WhatsApp anade -cerrar del color de la ruptura- va en el CORRECT
  sobre RN-003 de la misma fecha (las 14:55). Captura en corpus: Material adicional de su operativa/Mensajes
