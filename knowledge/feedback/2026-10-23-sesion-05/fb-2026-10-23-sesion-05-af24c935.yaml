notas: 'S-1 (SESGO-H4-COLOR.md §4.4; ADR-0080 §9): con el sesgo bajista, una H4 que rompe el maximo de
  la anterior solo con la mecha y cierra roja deja el sesgo bajista, la opcion b, sobre un esquema dibujado
  (ev-v15-000049-3b294480). Es el caso 3 de la regla del color (fb-2026-10-04-sesion-04-6e7da456) y lo
  que hace el motor (domain/sesgo.py; test_sesgo_h4.py::test_caso_3_rompe_el_maximo_y_cierra_roja_sigue_el_sesgo_que_habia).
  CIERRA la contradiccion de ADR-0080 §9 con la sesion 1 (v6 1:04:30-1:05:35, fb-2026-09-09-sesion-01-41f46b21:
  «aunque fue roja la vela, pues es indiferente … la siguiente operativa es alcista») a favor de la regla
  del color; A-1 no se reabre. Para precisar: lo lejos que llega la mecha no importa («por un pip o un
  punto, pues sirve»), el tamano del cuerpo rojo tampoco, y el sesgo se decide al cierre de esa vela y
  no se cambia durante la siguiente (ev-v15-000138-ef123dfc). Solo el caso bajista; no lleva «creo»'
