notas: 'aclaracion del consultor, no cita del trader; se contrastara con la grabacion v6 cuando termine
  la transcripcion. El bot no debe frenar por porcentaje sino por cartuchos: 3 perdidas de 0,4 % son ~1,2
  %, muy por debajo del 4,5 %. El 4,5 % queda como red de seguridad, y conviene comprobarlo igualmente
  contra las reglas reales de FundedNext, que suelen medir sobre el balance de inicio de dia y no sobre
  el saldo del momento.'
