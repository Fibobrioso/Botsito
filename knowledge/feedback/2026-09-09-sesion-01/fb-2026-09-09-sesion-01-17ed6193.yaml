notas: 'corrige el registro de la sesion 1, cuyo literal decia lo contrario: El lotaje se pone sobre la
  caja completa de SL, pero automaticamente se mueve al 0.8 de la misma para que corra la operacion. Consecuencia:
  la perdida al saltar el stop pasa de riesgo_por_operacion x stop_fraccion_caja (0,4 % con 0,5 y 0,8)
