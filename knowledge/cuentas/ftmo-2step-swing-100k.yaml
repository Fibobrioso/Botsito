# Perfil de cuenta del simulador (ADR-0050): FTMO, programa 2-Step, tipo de cuenta Swing,
# 100.000 USD. Un perfil es UNA firma, UN programa, UN tipo y UN capital, en un fichero con el
# formato del registro (ADR-0002, ADR-0012) que lee `config.registro.cargar_registro`: la misma
# puerta, los mismos tipos y los mismos tres estados. Una firma nueva es OTRO fichero como este,
# nunca codigo nuevo. Lo lee `engine/perfil_cuenta.py`; el motor de cuenta es `engine/cuenta.py`.
#
# CADA CIFRA CITA SU REGLA de docs/validation/FTMO-REGLAS.md (R1..R20), leida de la fuente
# oficial de FTMO el 2026-09-25, y la fuente formal es ADR-0050, que las adopta. Lo que alli
# figura como NO ENCONTRADA va aqui en UNKNOWN: no tiene valor, leerlo falla nombrando el
# parametro, y el simulador se niega a correr si lo necesita. Ningun valor esta inventado.
#
# Los nombres que coinciden con parametros de knowledge/spec/parametros.yaml llevan el MISMO valor,
# y un test lo cruza (precedente: ADR-0012 §1). La spec sigue leyendo parametros.yaml; este perfil
# lo lee solo el simulador.
parametros:
  # ------------------------------------------------------------------ identidad del perfil
  - nombre: firma
    categoria: prop_firm
    tipo: enum
    unidad: prop firm
    opciones: [ftmo, fundednext]
    descripcion: >-
      la firma de este perfil. R8: el tipo Swing «is available exclusively within the FTMO
      Challenge: 2-Step». Igual que en parametros.yaml (ADR-0026)
    estado: CONFIRMED
    valor: ftmo
    consumido_por: [F33]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_programa
    categoria: prop_firm
    tipo: texto
    unidad: programa del reto
    descripcion: >-
      R1: «10% for the FTMO Challenge 5% for the Verification [...] There is no Profit Target on
      the subsequent FTMO Account (2-Step)». Tres fases: reto, verificacion y fondeada
    estado: CONFIRMED
    valor: "2-step"
    consumido_por: [F33]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_tipo_cuenta
    categoria: prop_firm
    tipo: enum
    unidad: tipo de cuenta elegido en la compra
    opciones: [standard, swing]
    descripcion: >-
      R8: se elige en la compra y de Standard a Swing no se cambia. R6 y R7: Swing no restringe
      noticias, noche ni fin de semana
    estado: CONFIRMED
    valor: swing
    consumido_por: [F33]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: saldo_inicial_cuenta
    categoria: prop_firm
    tipo: decimal
    unidad: USD
    descripcion: >-
      el «Initial Simulated Capital» sobre el que van los porcentajes de R1, R2 y R3. R1 pone el
      ejemplo de 100.000 (110.000 y 105.000). El tamano lo decide ADR-0026 §1
    estado: CONFIRMED
    valor: "100000"
    minimo: "0"
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_huso_corte
    categoria: prop_firm
    tipo: texto
    unidad: huso IANA del dia de la firma
    descripcion: >-
      el reloj con el que la firma corta el dia. R2: el limite diario «is recalculated daily at
      00:00 CE(S)T»; R4: un dia de trading va «from 00:00:00 to 23:59:59 CE(S)T». CE(S)T es la
      hora civil centroeuropea, con su horario de verano: Europe/Prague, la sede de FTMO (ADR-0027
      lo nombra). Hoy da los mismos instantes que huso_operativa (Europe/Madrid), y un test lo
      comprueba; si algun dia divergen, se vera ahi
    estado: CONFIRMED
    valor: "Europe/Prague"
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_fases
    categoria: prop_firm
    tipo: texto
    unidad: nombres de las fases, en orden y separados por espacios
    descripcion: >-
      las fases del programa, en el orden en que se pasan. R1: reto («FTMO Challenge»),
      verificacion («Verification») y fondeada («the subsequent FTMO Account»). Cada fase empieza
      con el capital inicial, y el simulador corre UNA fase por ejecucion. Es texto porque el
      registro no tiene tipo lista (ADR-0012 los crea cuando hacen falta; queda para el consultor)
    estado: CONFIRMED
    valor: "reto verificacion fondeada"
    fuente: {tipo: decision, id: ADR-0050}

  # ------------------------------------------------------------------ objetivo y dias minimos
  # Un booleano dice si la regla aplica y el umbral, cuando no aplica, se queda UNKNOWN (ADR-0012
  # §2: «la ausencia de valor no es un valor»).
  - nombre: firma_reto_objetivo_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la fase tiene objetivo de beneficio
    descripcion: >-
      R1: «10% for the FTMO Challenge»
    estado: CONFIRMED
    valor: true
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_reto_objetivo
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital inicial (saldo_inicial_cuenta)
    descripcion: >-
      R1: «The Profit Target is calculated as a percentage of your Initial Simulated Capital: 10%
      for the FTMO Challenge». Se cumple «once your account balance exceeds the Initial Simulated
      Capital by the required Profit Target with all positions closed»; ejemplo: 110.000
    estado: CONFIRMED
    valor: "10"
    minimo: "0"
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_reto_dias_minimos_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la fase exige dias minimos de trading
    descripcion: >-
      R4: «requires the trader to achieve at least 4 Trading Days», en las dos fases
    estado: CONFIRMED
    valor: true
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_reto_dias_minimos
    categoria: prop_firm
    tipo: entero
    unidad: dias de trading distintos
    descripcion: >-
      R4: «at least 4 Trading Days. A Trading Day is defined as any day – measured from 00:00:00
      to 23:59:59 CE(S)T – during which at least one position is opened»; «they do not need to be
      consecutive»
    estado: CONFIRMED
    valor: 4
    minimo: 0
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_verificacion_objetivo_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la fase tiene objetivo de beneficio
    descripcion: >-
      R1: «5% for the Verification»
    estado: CONFIRMED
    valor: true
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_verificacion_objetivo
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital inicial (saldo_inicial_cuenta)
    descripcion: >-
      R1: «5% for the Verification»; ejemplo: 105.000
    estado: CONFIRMED
    valor: "5"
    minimo: "0"
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_verificacion_dias_minimos_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la fase exige dias minimos de trading
    descripcion: >-
      R4: «at least 4 Trading Days», en las dos fases
    estado: CONFIRMED
    valor: true
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_verificacion_dias_minimos
    categoria: prop_firm
    tipo: entero
    unidad: dias de trading distintos
    descripcion: >-
      R4: «at least 4 Trading Days», contados como en el reto
    estado: CONFIRMED
    valor: 4
    minimo: 0
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_fondeada_objetivo_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la fase tiene objetivo de beneficio
    descripcion: >-
      R1: «There is no Profit Target on the subsequent FTMO Account (2-Step)»
    estado: CONFIRMED
    valor: false
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_fondeada_objetivo
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital inicial (saldo_inicial_cuenta)
    descripcion: >-
      sin valor a proposito: R1 dice que la fondeada no tiene objetivo, asi que no hay cifra que
      poner (ADR-0012 §2)
    estado: UNKNOWN
  - nombre: firma_fondeada_dias_minimos_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la fase exige dias minimos de trading
    descripcion: >-
      R4: «There is no Minimum Trading Days rule on the subsequent FTMO Account (2-Step)»
    estado: CONFIRMED
    valor: false
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_fondeada_dias_minimos
    categoria: prop_firm
    tipo: entero
    unidad: dias de trading distintos
    descripcion: >-
      sin valor a proposito: R4 dice que la fondeada no tiene dias minimos, asi que no hay cifra
      que poner (ADR-0012 §2)
    estado: UNKNOWN

  # ------------------------------------------------------------------ los dos limites de perdida
  - nombre: firma_perdida_diaria_max
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital inicial (saldo_inicial_cuenta)
    descripcion: >-
      R2: el limite del dia es «the account balance recorded at 00:00 CE(S)T of the current day»
      menos «the Maximum Daily Loss Amount, which is 5% of the Initial Simulated Capital». Se
      vigila sobre firma_magnitud_vigilada y se infringe al caer POR DEBAJO (R18: «If the equity
      drops below this limit, the rule is considered violated»). Igual que en parametros.yaml
    estado: CONFIRMED
    valor: "5"
    minimo: "0"
    maximo: "100"
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_base_perdida_diaria
    categoria: prop_firm
    tipo: enum
    unidad: sobre que saldo se fija el limite del dia
    opciones: [saldo_inicial_cuenta, saldo_corte_diario]
    descripcion: >-
      R2: el saldo «recorded at 00:00 CE(S)T of the current day»; y «On the first day of trading,
      the account balance used for this calculation is the Initial Simulated Capital». Igual que en
      parametros.yaml
    estado: CONFIRMED
    valor: saldo_corte_diario
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_perdida_total_max
    categoria: prop_firm
    tipo: porcentaje
    unidad: porcentaje del capital inicial (saldo_inicial_cuenta)
    descripcion: >-
      R3: «a static limit [...] the difference between: the Initial Simulated Capital and the
      Maximum Loss Amount, which is 10% of the Initial Simulated Capital»; ejemplo «Limit =
      $90,000». Igual que en parametros.yaml
    estado: CONFIRMED
    valor: "10"
    minimo: "0"
    maximo: "100"
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_perdida_total_arrastra
    categoria: prop_firm
    tipo: booleano
    unidad: si el limite total sigue al saldo maximo alcanzado
    descripcion: >-
      R3: «a static limit». No arrastra. Igual que en parametros.yaml
    estado: CONFIRMED
    valor: false
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_magnitud_vigilada
    categoria: prop_firm
    tipo: enum
    unidad: que magnitud no puede bajar del limite
    opciones: [saldo, equity]
    descripcion: >-
      R2 y R3: «your account equity (i.e., Balance + Open Positions P/L ± Swaps – Commissions)
      cannot drop» por debajo del limite. Comision y swaps van DENTRO de la equity vigilada
      (decision (b) del consultor, PROJECT_STATE Next Action 26). Igual que en parametros.yaml
    estado: CONFIRMED
    valor: equity
    fuente: {tipo: decision, id: ADR-0050}

  # ------------------------------------------------------------------ la cuenta y el servidor
  - nombre: firma_apalancamiento
    categoria: prop_firm
    tipo: entero
    unidad: apalancamiento maximo en forex (1:N)
    descripcion: >-
      R9: «The Swing account type has leverage set to up to 1:30»; API «leverageSwing: 30». Igual
      que en parametros.yaml. Lo consume el broker simulado (margen), no la capa de cuenta
    estado: CONFIRMED
    valor: 30
    minimo: 1
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_volumen_max_lotes
    categoria: prop_firm
    tipo: lotes
    unidad: lotes por operacion
    descripcion: >-
      R11: API de simbolos, «maxTradeVolume: 100» en la fila de EURUSD; FTMO avisa de que «The
      account specification can be seen directly in the trading platform». Va aqui como firma_*
      por decision (c) del consultor (Next Action 26). Lo consume el broker simulado
    estado: CONFIRMED
    valor: "100"
    minimo: "0"
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_ordenes_simultaneas_max
    categoria: prop_firm
    tipo: entero
    unidad: ordenes vivas a la vez
    descripcion: >-
      R13: «platform servers have 200 orders at a time [...] limitation». Decision (c) del
      consultor. Lo consume el broker simulado
    estado: CONFIRMED
    valor: 200
    minimo: 0
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_posiciones_dia_max
    categoria: prop_firm
    tipo: entero
    unidad: posiciones por dia
    descripcion: >-
      R13: «2000 max positions per day limitation». Decision (c) del consultor. Lo consume el
      broker simulado
    estado: CONFIRMED
    valor: 2000
    minimo: 0
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_mensajes_dia_max
    categoria: prop_firm
    tipo: entero
    unidad: peticiones al servidor por dia
    descripcion: >-
      R13: «an excessive number of more than 2,000 server requests per day» es practica prohibida.
      Igual que en parametros.yaml. Lo consume el broker simulado
    estado: CONFIRMED
    valor: 2000
    minimo: 0
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_noticias_restringe
    categoria: prop_firm
    tipo: booleano
    unidad: si la cuenta restringe operar alrededor de noticias
    descripcion: >-
      R6: «The Swing account type have no restrictions on trading during news releases». Igual que
      en parametros.yaml. R15 (gap trading) queda para Aleks con FTMO (Next Action 27) y no se
      modela. Lo consume el pre-vuelo
    estado: CONFIRMED
    valor: false
    consumido_por: [F33]
    fuente: {tipo: decision, id: ADR-0050}

  # ------------------------------------------------------------------ costes (R12)
  # Son la fila de EURUSD de la API de simbolos: costes de un instrumento EN esta firma. Los
  # consume el broker simulado, que los convierte en cargos con instante; la capa de cuenta recibe
  # los cargos ya calculados y los mete en la equity vigilada (decision (b)).
  - nombre: firma_comision_usd_por_lote
    categoria: prop_firm
    tipo: decimal
    unidad: USD por lote
    descripcion: >-
      R12: API «commission: 5, commissionType: flat_USD»; la web lo muestra como «USD/LOT*». Si
      es por lado o por operacion completa lo dice firma_comision_por_lado, que no tiene valor
    estado: CONFIRMED
    valor: "5"
    minimo: "0"
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_comision_por_lado
    categoria: prop_firm
    tipo: booleano
    unidad: si los USD por lote se cobran en cada lado (apertura y cierre) o una vez
    descripcion: >-
      R12: «Si la comision es por lado o por operacion completa, y que aclara el asterisco: NO
      ENCONTRADA». Sin valor hasta medirlo en la plataforma (FTMO-REGLAS §4, para datos). Lo
      consume el broker simulado
    estado: UNKNOWN
    consumido_por: [F24]
  - nombre: firma_swap_largo_puntos
    categoria: prop_firm
    tipo: decimal
    unidad: puntos por lote y noche, con signo
    descripcion: >-
      R12: API «swapLong: -9.49, swapType: points», fila de EURUSD
    estado: CONFIRMED
    valor: "-9.49"
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_swap_corto_puntos
    categoria: prop_firm
    tipo: decimal
    unidad: puntos por lote y noche, con signo
    descripcion: >-
      R12: API «swapShort: 0.36, swapType: points», fila de EURUSD
    estado: CONFIRMED
    valor: "0.36"
    consumido_por: [F24]
    fuente: {tipo: decision, id: ADR-0050}

  # ------------------------------------------------------------------ la guardia de tamano (R17)
  - nombre: firma_tamano_posicion_aviso_aplica
    categoria: prop_firm
    tipo: booleano
    unidad: si la firma pide coherencia en el tamano de posicion
    descripcion: >-
      R17: evitar «opening substantially larger position sizes compared to your other simulated
      trades». Decision (d) del consultor: guardia de AVISO, nunca de suspension
    estado: CONFIRMED
    valor: true
    fuente: {tipo: decision, id: ADR-0050}
  - nombre: firma_tamano_posicion_ratio_aviso
    categoria: prop_firm
    tipo: decimal
    unidad: veces la mediana de los lotes de las demas operaciones a partir de las que se avisa
    descripcion: >-
      R17 no da ninguna cifra para «substantially larger», y si un lote que varia con el stop a
      riesgo constante cuenta como tal esta PENDIENTE PARA ALEKS con FTMO (Next Action 27). Sin
      valor: la guardia queda NO EVALUABLE y el resultado lo dice nombrando este parametro
    estado: UNKNOWN
