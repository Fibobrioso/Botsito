rama: trabajo/filtradas-escenario-b
riesgo: medio  # rehace fuera del repo las filtradas de sesion y, solo si la fase 1 lo pide, anade tramos no citables; no cambia codigo, regla ni guion
artefacto: docs/validation/FILTRADAS-ESCENARIO-B.md
rutas_permitidas:
  - docs/validation/FILTRADAS-ESCENARIO-B.md
  - docs/validation/anexos/FILTRADAS-ESCENARIO-B/
  - docs/validation/CUARENTENA-POR-CONDICION.md
  - docs/validation/SESION-04-EXTRACCION.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - knowledge/corpus/tramos_no_citables.yaml
  - tests/unit/test_guardia_claude.py
  - .claude/hooks/ficheros_con_ocultos.txt
  - docs/runbooks/SESION-DE-PREGUNTAS.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - tests/unit/test_tramos_de_sesion.py
rutas_protegidas:
  - src/
  - scripts/
  - knowledge/cases/
  - knowledge/spec/
  - knowledge/feedback/
  - knowledge/evidence/
  - knowledge/corpus/transcripciones/
  - knowledge/corpus/fotogramas/
comprobaciones:
  - uv run python docs/validation/anexos/FILTRADAS-ESCENARIO-B/medir_fase0.py
  - uv run python scripts/ficheros_con_ocultos.py
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - make check > make-check.log 2>&1
