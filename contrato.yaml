rama: trabajo/cuarentena-por-defecto
riesgo: medio  # cambia la CLI que imprime el corpus, un hook y tests; no toca spec, motor, knowledge, datos ni cifras
artefacto: docs/validation/CUARENTENA-POR-DEFECTO.md
rutas_permitidas:
  - docs/validation/CUARENTENA-POR-DEFECTO.md
  - docs/validation/anexos/CUARENTENA-POR-DEFECTO/
  - docs/encargos/
  - docs/state/HISTORIA.md
  - docs/runbooks/
  - PROJECT_STATE.md
  - CLAUDE.md
  - .claude/hooks/guardia.py
  - .claude/skills/
  - src/botsito/cli.py
  - src/botsito/retrieval/
  - src/botsito/corpus/
  - src/botsito/comun/
  - src/botsito/validation/contexto_evidencia.py
  - tests/unit/
  - tests/contract/
  - tests/golden/
  - tests/conftest.py
  - scripts/
rutas_protegidas:
  - knowledge/
  - config/
  - data/manifests/
  - src/botsito/engine/
  - src/botsito/domain/
  - src/botsito/spec/
  - src/botsito/cases/
  - docs/adr/
  - tests/unit/test_contrato_rama.py
comprobaciones:
  - uv run pytest tests/unit/test_guardia_claude.py -q
  - uv run botsito state check
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - make check > make-check.log 2>&1
