rama: trabajo/guardia-ci
riesgo: alto  # cambia la guardia de Claude Code (.claude/hooks/guardia.py), que decide que se ejecuta y que se lee del material protegido; una regla nueva que niega comandos que hoy pasan; toca la plataforma de Claude Code y obliga a la CI de Linux por fix/
artefacto: docs/validation/GUARDIA-CI.md
tramo: "Carril: guardias y deuda"
rutas_permitidas:
  - docs/validation/GUARDIA-CI.md
  - docs/validation/anexos/GUARDIA-CI/
  - .claude/hooks/guardia.py
  - .claude/hooks/solo_lectura.py
  - .claude/skills/entregar-rama/
  - .claude/skills/cerrar-rama/
  - .claude/skills/abrir-rama/
  - tests/unit/test_guardia_ci.py
  - docs/runbooks/RITUAL.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - docs/runbooks/DECISIONES-DE-PROCESO.md
  - docs/plan/HOJA-DE-RUTA.md
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - Makefile
  - .github/
  - src/
  - config/
  - data/manifests/
  - knowledge/
  - docs/adr/
  - docs/spec/
  - scripts/
  - tools/mql5/
  - mql5/
comprobaciones:
  - uv run python scripts/contrato_rama.py
  - uv run pytest -q tests/unit/test_guardia_ci.py tests/unit/test_guardia_claude.py tests/unit/test_guardia_ffmpeg.py
  - make check > make-check.log 2>&1
