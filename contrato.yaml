rama: trabajo/skills-metodo
riesgo: bajo  # solo documentos: tres SKILL.md, PROJECT_STATE.md, HISTORIA y el informe; nada que se ejecute (encargo, punto 0)
artefacto: docs/validation/SKILLS-METODO.md
tramo: "Carril: guardias y deuda"
rutas_permitidas:
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - docs/validation/SKILLS-METODO.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md  # la fila del dia por los make check (encargo, punto 0)
  - .claude/skills/ingerir-sesion/SKILL.md
  - .claude/skills/activar-sesion/SKILL.md
  - .claude/skills/abrir-rama/SKILL.md
rutas_protegidas:
  # encargo, D5 («Lo que NO cambia»)
  - CLAUDE.md
  - docs/runbooks/
  - docs/adr/
  - docs/plan/
  - .claude/agents/
  - .claude/hooks/
  - .claude/settings.json
  - .gitignore
  - src/
  - mql5/
  - tests/
  - scripts/
  - knowledge/
  - data/
  - Makefile
comprobaciones:
  - uv run botsito state check
  - uv run python scripts/contrato_rama.py
  - wc -c PROJECT_STATE.md
  - make check > make-check.log 2>&1
