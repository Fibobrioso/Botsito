rama: trabajo/hoja-sesion-05
riesgo: medio  # cambia un guion (scripts/transcribir_sesion.py, la hoja 05 y la sesion en curso) y su test, y un runbook; no cambia motor, spec, ambiguedades, feedback, casos, corpus, fuentes.yaml ni la cuarentena
artefacto: docs/validation/HOJA-SESION-05.md
tramo: R4
rutas_permitidas:
  - docs/validation/HOJA-SESION-05.md
  - docs/validation/anexos/HOJA-SESION-05/
  - scripts/transcribir_sesion.py
  - tests/unit/test_transcribir_sesion.py
  - docs/runbooks/DECISIONES-DE-PROCESO.md
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - Makefile
  - .claude/
  - src/
  - config/
  - data/manifests/
  - knowledge/
  - docs/sesion-5/
  - docs/adr/
  - docs/spec/
  - tools/mql5/
  - mql5/
comprobaciones:
  - uv run python scripts/contrato_rama.py
  - uv run pytest -q tests/unit/test_transcribir_sesion.py
  - make check > make-check.log 2>&1
