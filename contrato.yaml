rama: trabajo/contraste-trader
riesgo: medio  # solo documentos y el registro del corpus (fuentes.yaml y manifest.yaml), sin codigo ni spec; pero registra material nuevo del trader (capturas y, por primera vez, audios), cita un ASR hecho fuera de rama y declara una exposicion tardia y lo que se le enseño al trader
artefacto: docs/validation/CONTRASTE-TRADER.md
tramo: R4  # R4.7 de docs/plan/HOJA-DE-RUTA.md
rutas_permitidas:
  - docs/encargos/trabajo-contraste-trader.md
  - docs/validation/CONTRASTE-TRADER.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md  # la fila del dia (G2)
  - knowledge/corpus/fuentes.yaml
  - knowledge/corpus/manifest.yaml
  - docs/adr/0100-la-premisa-se-mide-con-costes.md  # solo el recuadro de D6
  - docs/state/HISTORIA.md  # el Archivo 83 de la apertura
  - PROJECT_STATE.md  # solo Current Branch, Current Feature y el Archivo de la apertura
rutas_protegidas:
  - src/
  - scripts/
  - .claude/
  - Makefile
  - config/
  - corpus/
  - data/manifests/
  - tests/
  - tools/mql5/
  - mql5/
  - docs/plan/
  - docs/spec/
  - knowledge/cases/
  - knowledge/evidence/
  - knowledge/feedback/
  - knowledge/spec/
  - knowledge/_proposals/
  - knowledge/corpus/README.md
  - knowledge/corpus/criterio_huso.yaml
  - knowledge/corpus/fotogramas/
  - knowledge/corpus/fotogramas_obligatorios.yaml
  - knowledge/corpus/glosario_asr.yaml
  - knowledge/corpus/libros.yaml
  - knowledge/corpus/tramos_no_citables.yaml
  - knowledge/corpus/transcripciones/
  - docs/adr/00*
  - docs/adr/README.md
  - docs/adr/0101-*  # ningun ADR nuevo
  - docs/adr/0102-*
comprobaciones:
  - uv run botsito state check
  - uv run botsito knowledge validate (con su log en la carpeta de trabajo de la sesion, fuera del repo)
  - uv run python scripts/contrato_rama.py
  - make check > make-check.log 2>&1
