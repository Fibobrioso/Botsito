rama: trabajo/entrada-enero
riesgo: alto  # lee material nuevo (el libro de enero entero), cambia la ventana de ticks (scripts/ticks_spread.py) y la lista `construccion` de criterio_fidelidad.yaml con su ADR; ni motor ni spec
artefacto: docs/validation/ENTRADA-ENERO.md
tramo: R2
rutas_permitidas:
  - docs/validation/ENTRADA-ENERO.md
  - docs/validation/anexos/ENTRADA-ENERO/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/adr/0079-*.md
  - docs/adr/0043-*.md
  - docs/adr/README.md
  - docs/runbooks/ARNES-MOTOR.md
  - docs/runbooks/SESION-DE-PREGUNTAS.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  # ampliado el 2026-10-13 por la respuesta del consultor a la PARADA (punto 5): NOTAS en
  # ADR-0069 §5 y ADR-0051 DN-5 y la linea 9 de VISOR-DIAS.md, en el commit de ADR-0079
  - docs/adr/0069-*.md
  - docs/adr/0051-*.md
  - docs/runbooks/VISOR-DIAS.md
  - scripts/ticks_spread.py
  - tests/unit/test_ticks_spread.py
  - tests/unit/test_criterio_fidelidad.py
  - tests/contract/test_mes_del_material.py
  - knowledge/cases/criterio_fidelidad.yaml
  - knowledge/cases/kit/config.yaml
  - knowledge/cases/visto/
  - knowledge/cases/dev/
  - data/manifests/ticks/
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - Makefile
  - .claude/
  - src/botsito/engine/
  - src/botsito/domain/
  - knowledge/spec/
  - knowledge/cases/holdout/
  - knowledge/cases/meses_reservados.yaml
  - knowledge/simulador/
  - knowledge/evidence/
  - knowledge/feedback/
  - knowledge/cuentas/
  - knowledge/corpus/libros.yaml
  - knowledge/corpus/transcripciones/
  - knowledge/corpus/fotogramas/
  - config/
  - docs/plan/
  - docs/adr/0000-template.md
comprobaciones:
  - uv run python scripts/contrato_rama.py
  - uv run pytest tests/unit/test_ticks_spread.py -q
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - uv run botsito casos check
  - uv run botsito data check-ticks --dataset <id de enero> --hashes
  - make check > make-check.log 2>&1
