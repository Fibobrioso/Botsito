rama: trabajo/cuarentena-por-condicion
riesgo: alto  # cambia una guardia del holdout (que se tapa en el texto de las transcripciones) y puede crear la fuente de los meses reservados enteros
artefacto: docs/validation/CUARENTENA-POR-CONDICION.md
rutas_permitidas:
  - docs/validation/CUARENTENA-POR-CONDICION.md
  - docs/validation/anexos/CUARENTENA-POR-CONDICION/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - src/botsito/corpus/cuarentena.py
  - src/botsito/cases/holdout.py
  - src/botsito/cli.py
  - src/botsito/retrieval/
  - src/botsito/validation/
  - scripts/transcribir_sesion.py
  - scripts/ficheros_con_ocultos.py
  - tests/unit/test_cuarentena*.py
  - tests/unit/test_transcribir_sesion.py
  - tests/unit/test_guardia_claude.py
  - tests/unit/test_puerta_holdout.py
  - .claude/hooks/ficheros_con_ocultos.txt
  - knowledge/corpus/tramos_no_citables.yaml
rutas_protegidas:
  - knowledge/spec/
  - knowledge/feedback/
  - knowledge/evidence/
  - knowledge/corpus/transcripciones/
  - knowledge/corpus/fotogramas/
  - knowledge/corpus/libros.yaml
  - knowledge/cases/holdout/
  - src/botsito/engine/
  - src/botsito/domain/
comprobaciones:
  - uv run python docs/validation/anexos/CUARENTENA-POR-CONDICION/medir_fase0.py
  - uv run python scripts/ficheros_con_ocultos.py
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - make check > make-check.log 2>&1
