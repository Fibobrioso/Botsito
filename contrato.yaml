rama: trabajo/renovar-cierres-2026-11-26
riesgo: alto  # cambia el calendario de cierres de la cuenta, que es una cifra (CONTRATO-DE-RAMA.md, «Como elegir el riesgo»; precedente de docs/validation/RENOVAR-CIERRES.md); sin tocar motor, simulador, spec ni src/
artefacto: docs/validation/RENOVAR-CIERRES-2025.md
tramo: R5  # R5.4 y R5.6 de docs/plan/HOJA-DE-RUTA.md; la letra I de la Next Action
rutas_permitidas:
  - docs/encargos/trabajo-renovar-cierres-2026-11-26.md
  - docs/validation/RENOVAR-CIERRES-2025.md
  - docs/validation/anexos/RENOVAR-CIERRES-2025/
  - docs/validation/HOLDOUT-EXPOSICIONES.md  # la fila del dia (G2)
  - knowledge/cuentas/cierres/ftmo-2step-swing-100k.yaml
  - mql5/Include/Botsito/Capa/Generado.mqh  # regenerado con generar_capa.py, nunca a mano
  - docs/runbooks/RENOVAR-CIERRES.md  # solo el parrafo de D7
  - tests/unit/test_cierres_de_mercado.py
  - docs/state/HISTORIA.md  # el Archivo 86 de la apertura
  - PROJECT_STATE.md  # Current Branch, Current Feature, el Archivo y el recuento de tests
rutas_protegidas:
  - knowledge/cuentas/ftmo-2step-swing-100k.yaml  # el perfil
  - docs/validation/PREREGISTRO.md
  - docs/validation/CIERRES-DE-MERCADO.md
  - docs/validation/CAPA-GENERADA.md
  - docs/validation/RENOVAR-CIERRES.md
  - knowledge/spec/
  - knowledge/cases/
  - knowledge/evidence/
  - knowledge/feedback/
  - knowledge/corpus/
  - src/
  - scripts/
  - tools/
  - data/
  - corpus/
  - config/
  - Makefile
  - .claude/
  - .gitignore
  - mql5/Experts/
  - mql5/Scripts/
  - mql5/tester/
  - mql5/*.md
  - mql5/Include/Botsito/*.md
  - mql5/Include/Botsito/Capa/Cuenta.mqh
  - mql5/Include/Botsito/Capa/Journal.mqh
  - mql5/Include/Botsito/Capa/Reloj.mqh
  - mql5/Include/Botsito/Capa/Sesiones.mqh
  - docs/plan/HOJA-DE-RUTA.md  # va en el cierre
  - docs/adr/  # ningun ADR nuevo ni cambiado
comprobaciones:
  - uv run botsito state check
  - uv run botsito knowledge validate (con su log en la carpeta de trabajo de la sesion, fuera del repo)
  - uv run python scripts/contrato_rama.py
  - uv run python src/botsito/mql5bridge/generar_capa.py --repo . --perfil ftmo-2step-swing-100k --comprobar
  - uv run pytest tests/unit/test_cierres_de_mercado.py tests/unit/test_renovar_cierres.py tests/unit/test_capa_generada.py tests/unit/test_f17_historial_criterio.py
  - make check > make-check.log 2>&1
