rama: trabajo/respaldo-m1
riesgo: alto  # toca el broker simulado (engine/llenado.py y quiza engine/broker.py), es decir el motor que mide la construccion; no cambia la spec, los casos ni ninguna cifra
artefacto: docs/validation/RESPALDO-M1.md
tramo: R3
rutas_permitidas:
  - src/botsito/engine/llenado.py
  - src/botsito/engine/broker.py
  - tests/unit/test_*.py
  - docs/adr/0051-el-modelo-de-llenado.md
  - docs/adr/0070-umbral-de-construccion-para-medir-mayo.md
  - docs/validation/RESPALDO-M1.md
  - docs/validation/anexos/RESPALDO-M1/**
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
rutas_protegidas:
  - knowledge/
  - config/
  - data/manifests/
  - .claude/
  - Makefile
  - src/botsito/domain/
  - src/botsito/spec/
  - docs/validation/anexos/RECORRIDA-CONSTRUCCION/
comprobaciones:
  - uv run pytest tests/unit/test_llenado.py tests/unit/test_broker.py tests/unit/test_broker_ordenes_stop.py -q
  - make check > make-check.log 2>&1
