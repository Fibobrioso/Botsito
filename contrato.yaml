rama: trabajo/guardia-g1
riesgo: medio  # cambia la guardia de Claude Code (.claude/hooks/) y sus tests; no la spec, el motor, ninguna cifra ni material
artefacto: docs/validation/GUARDIA-G1.md
tramo: "Carril: guardias y deuda"
rutas_permitidas:
  - .claude/hooks/guardia.py
  - .claude/hooks/solo_lectura.py
  - tests/unit/test_guardia_g1.py
  - tests/unit/test_guardia_claude.py  # el test de ls-files (:1855) cambia de sentido (encargo, punto e)
  - tests/unit/test_guardia_ci.py  # fase 2: sus dos riesgos residuales cambian de sentido con B y C (ampliado el 2026-11-04, GUARDIA-G1.md §5)
  - docs/validation/GUARDIA-G1.md
  - docs/validation/anexos/GUARDIA-G1/**
  - docs/runbooks/ERRORES-RECURRENTES.md  # fase 3: la fila de las dos negativas de H, si esta rama las arregla
  - CLAUDE.md  # fase 3: «deja listarlo» frente a lo que decida el punto e
  - docs/adr/0088-*.md  # respuesta a la PARADA, punto 0: el ADR del listado del holdout (ampliado el 2026-11-04; el 0088 y no el 0087, que lo reservan como «aun no existe» ACTIVAR-SESION-05-MOTOR.md:28 y su encargo, GUARDIA-G1.md §4.10)
  - docs/adr/README.md  # su fila del indice (idem)
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
rutas_protegidas:
  - src/
  - mql5/
  - knowledge/
  - data/
  - config/
  # docs/adr/ abierto SOLO para el 0088 y el indice (respuesta a la PARADA, punto 0): los demas, uno a
  # uno por prefijo (los patrones del contrato no admiten corchetes)
  - docs/adr/000*
  - docs/adr/001*
  - docs/adr/002*
  - docs/adr/003*
  - docs/adr/004*
  - docs/adr/005*
  - docs/adr/006*
  - docs/adr/007*
  - docs/adr/0080*
  - docs/adr/0081*
  - docs/adr/0082*
  - docs/adr/0083*
  - docs/adr/0084*
  - docs/adr/0085*
  - docs/adr/0086*
  - docs/adr/0087*
  - docs/adr/0089*
  - docs/plan/HOJA-DE-RUTA.md
  - .claude/settings.json
  - .claude/skills/
  - .claude/agents/
  - .github/
  - Makefile
comprobaciones:
  - uv run pytest tests/unit/test_guardia_g1.py tests/unit/test_guardia_claude.py tests/unit/test_guardia_alias.py tests/unit/test_guardia_ci.py tests/unit/test_guardia_ffmpeg.py -q
  - make check > make-check.log 2>&1
