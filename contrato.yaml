rama: trabajo/dieta-estado
riesgo: bajo  # solo mueve o acorta lineas de PROJECT_STATE.md hacia docs/state/HISTORIA.md; no toca codigo, tests, spec, motor, guardias ni material
artefacto: docs/validation/DIETA-ESTADO.md
tramo: "Carril: guardias y deuda"
rutas_permitidas:
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - docs/validation/DIETA-ESTADO.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md  # la fila del dia por los make check (encargo, punto 0)
  - docs/plan/HOJA-DE-RUTA.md  # SOLO para quitar el HER:n de un pendiente heredado que salga, en el mismo commit (encargo, punto 0)
rutas_protegidas:
  # encargo, punto 2 («Lo que NO cambia»)
  - docs/state/README.md
  - src/
  - mql5/
  - knowledge/
  - data/
  - tests/
  - scripts/
  - .claude/
  - Makefile
  - .gitattributes
  - .github/
  - CLAUDE.md
  - docs/runbooks/
comprobaciones:
  - uv run botsito state check
  - uv run python scripts/contrato_rama.py
  - wc -c PROJECT_STATE.md
  - make check > make-check.log 2>&1
