rama: trabajo/guardias-holdout
riesgo: alto  # como manda el encargo: toca la puerta del sello (contrato_rama.py corre el primero en make check) y mide fechas de dias reservados
artefacto: docs/validation/GUARDIAS-HOLDOUT.md
tramo: "Carril: guardias y deuda"
rutas_permitidas:
  - docs/validation/GUARDIAS-HOLDOUT.md
  - docs/validation/anexos/GUARDIAS-HOLDOUT/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
  - CLAUDE.md
  - scripts/contrato_rama.py
  - tests/unit/test_contrato_rama.py
  - tests/unit/test_fila_del_dia.py
  - tests/unit/test_hoja_de_ruta.py
# Lista blanca: lo demas de scripts/, tests/, docs/ y .claude/ queda fuera por no estar en la lista.
# Lo que el encargo dice que no cambia, ademas, protegido (manda sobre lo permitido).
rutas_protegidas:
  - Makefile
  - src/
  - knowledge/
  - config/
  - data/manifests/
  - mql5/
  - docs/adr/
  - docs/plan/HOJA-DE-RUTA.md
  - tests/contract/
  - tests/conftest.py
  - tests/guarda_holdout.py
comprobaciones:
  - uv run botsito knowledge validate (con el log fuera del repo, en la carpeta de trabajo de la sesion)
  # `uv run python scripts/contrato_rama.py` suelto lo niega la guardia mientras el guion difiera
  # del de main (su `git -c core.quotepath=false`; PROJECT_STATE.md, Technical Debt de los guiones de
  # la plataforma): en esta rama lo corre `make check` (linea CONTRATO: y G2: del log), o Aleks con «!»
  - make-check.log, lineas CONTRATO y G2
  - uv run pytest tests/unit/test_contrato_rama.py tests/unit/test_fila_del_dia.py tests/unit/test_hoja_de_ruta.py -q
  - make check > make-check.log 2>&1
