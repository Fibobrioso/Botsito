rama: trabajo/demo-ejecucion-1
riesgo: alto  # la fase 1 cambia cifras de la cuenta y del broker (ADR-0057, A-27, perfil de FTMO) con una medida nueva; la fase 0 solo congela el CSV y hace inventario
artefacto: docs/validation/DEMO-EJECUCION-1.md
rutas_permitidas:
  - docs/validation/DEMO-EJECUCION-1.md
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  # fase 0 a): el manifiesto inmutable del CSV de la ejecucion 1
  - data/manifests/demo_ftmo/
  # fase 0 c) e i): la linea de netting/hedging y la duracion medida
  - docs/runbooks/DEMO-FTMO.md
  # y su esquema, en una seccion nueva (anadido en el commit de la fase 0)
  - data/manifests/README.md
  # fase 1 (respuesta del consultor del 2026-10-09), anadido en el commit del ADR:
  # punto 1, el ADR nuevo y su fila en el indice
  - docs/adr/0071-lo-que-fija-la-ejecucion-1-de-la-demo-de-ftmo.md
  - docs/adr/README.md
  # puntos 2, 3, 4, 5 y 7: los valores, A-27 y los documentos generados
  - knowledge/spec/parametros.yaml
  - knowledge/spec/ambiguedades.yaml
  # el parche de spec_version (15.9.0 -> 15.9.1) que exige knowledge validate (anadido en el commit
  # de los valores: solo cambian estado y fuente)
  - knowledge/spec/spec_manifest.yaml
  - knowledge/cuentas/ftmo-2step-swing-100k.yaml
  - docs/spec/
  # punto 3: la negativa con el stops level UNKNOWN, pasada a un perfil sintetico; y test_kit (punto 7)
  - tests/unit/perfil_stops_level_unknown.py
  - tests/unit/test_cableado.py
  - tests/unit/test_orden_stop_pivote.py
  - tests/unit/test_selector_orden_stop.py
  - tests/unit/test_renovar_cierres.py
  - tests/unit/test_perfil_cuenta.py
  - tests/unit/test_kit.py
  # anadidos en el commit de los valores, tras el primer make check: A-27 DECIDIDA sigue siendo
  # medicion, y la regresion del 7 de agosto choca con el volumen maximo medido (informe §3.2)
  - tests/unit/test_spec_fidelidad.py
  - tests/regression/test_cuenta_7_de_agosto.py
  # punto 5: el script 1.1, su lector y su test
  - tools/mql5/MedirDemoFTMO.mq5
  - scripts/leer_demo_ftmo.py
  - tests/unit/test_leer_demo_ftmo.py
rutas_protegidas:
  # lo que el encargo y la respuesta dicen que no cambia: codigo, motor, estrategia, corpus y holdout
  - src/
  - knowledge/spec/strategy_spec.yaml
  - knowledge/simulador/
  - knowledge/cases/
  - knowledge/corpus/
  - knowledge/feedback/
  - knowledge/evidence/
  - corpus/
  - data/manifests/eurusd-*.yaml
  - data/manifests/ticks/
comprobaciones:
  - git log --format=%H main..HEAD
  - uv run python scripts/leer_demo_ftmo.py data/demo_ftmo
  - sha256sum data/demo_ftmo/MedirDemoFTMO_20261009_153552.csv
  - git diff main -- tools/mql5/MedirDemoFTMO.mq5
  - uv run pytest tests/unit/test_leer_demo_ftmo.py tests/unit/test_cableado.py tests/unit/test_selector_orden_stop.py tests/unit/test_perfil_cuenta.py tests/unit/test_orden_stop_pivote.py tests/unit/test_renovar_cierres.py -q
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - uv run botsito state check
  - make check > make-check.log 2>&1
