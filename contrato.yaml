rama: trabajo/capa-generada
riesgo: medio  # el generador de lo que la capa de MT5 recibe del repo (mql5bridge), el fichero generado, el EA que escribe capa_hash, el journal v2 y sus tests y goldens; no cambia motor, spec, parametros, ambiguedades, perfil, calendario de cierres, cases ni holdout, y no lee velas, ticks ni material del trader
artefacto: docs/validation/CAPA-GENERADA.md
tramo: R6a
rutas_permitidas:
  - docs/validation/CAPA-GENERADA.md
  - docs/validation/anexos/CAPA-GENERADA/
  - mql5/
  - src/botsito/mql5bridge/
  - tests/
  - docs/runbooks/DEMO-FTMO.md
  - docs/runbooks/RENOVAR-CIERRES.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md  # cada make check lee el M1 de marzo (Technical Debt; auditor, herencia 1)
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
  - docs/adr/0001-repository-structure-and-change-regimes.md  # recuadro de correccion (orden de cierre, punto 2): la capa se genera tambien desde knowledge/cuentas/
  - docs/adr/0082-la-capa-de-mt5-que-nunca-decide-una-operacion-va-antes-de-f26.md  # recuadro de correccion (orden de cierre, punto 2): lote_si_no_cabe es CONFIRMED
rutas_protegidas:
  - Makefile
  - .gitattributes
  - .claude/
  - .github/
  - tools/mql5/
  - scripts/leer_demo_ftmo.py
  - data/manifests/
  - knowledge/
  - src/botsito/engine/
  - src/botsito/domain/
  - src/botsito/spec/
  - src/botsito/cases/
  - docs/plan/
  - docs/validation/anexos/EA-CONEXION/
comprobaciones:
  - uv run botsito state check
  - uv run python scripts/contrato_rama.py
  - make check > make-check.log 2>&1
