rama: trabajo/margen-lote
riesgo: alto  # cambia el broker simulado (rechazo por margen al llenar), la preparacion del lote, la spec (dos parametros nuevos, RN-011/RN-027 o una regla nueva, A-57) y el perfil de la cuenta; lee filas dev de los libros de construccion y el M1 de meses reservados para calentar el arnes (declarado el mismo dia); ninguna cifra de la geometria cambia
artefacto: docs/validation/MARGEN-LOTE.md
tramo: R3
rutas_permitidas:
  - docs/validation/MARGEN-LOTE.md
  - docs/validation/anexos/MARGEN-LOTE/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  # el ADR nuevo (D6) y los dos que enmienda con recuadro (ADR-0052 §4; ADR-0053 si D2 lo pide), y el indice
  - docs/adr/0081-*.md
  - docs/adr/0052-el-broker-simulado.md
  - docs/adr/0053-el-cableado-del-simulador.md
  - docs/adr/README.md
  - docs/spec/
  - knowledge/spec/
  # el perfil: firma_apalancamiento (quien lo consume), firma_tamano_posicion_ratio_aviso (G.3) y, si la fase 0 lo propone, el tope de volumen
  - knowledge/cuentas/ftmo-2step-swing-100k.yaml
  - knowledge/cuentas/README.md
  - src/botsito/engine/broker.py
  - src/botsito/engine/primitivas_broker.py
  - src/botsito/engine/cableado.py
  - src/botsito/engine/simulacion.py
  - src/botsito/engine/cuenta.py
  # el campo de salida de 4.e (lote pedido, distancia, margen requerido) vive en cableado.py (CABECERA_ORDENES);
  # arnes.py solo si el informe del arnes tiene que cambiar con el
  - src/botsito/engine/arnes.py
  - tests/unit/test_broker.py
  - tests/unit/test_broker_ordenes_stop.py
  - tests/unit/test_be_al_tick.py
  - tests/unit/test_peticiones.py
  - tests/unit/test_perfil_cuenta.py
  - tests/unit/test_cuenta.py
  - tests/unit/test_arnes_motor.py
  # el test de «### Ordenes», que gana el campo de 4.e
  - tests/unit/test_vida_de_la_orden.py
  - tests/unit/test_kit.py
  - tests/regression/test_cuenta_7_de_agosto.py
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - Makefile
  - .claude/
  - scripts/
  - docs/plan/
  - docs/runbooks/DEMO-FTMO.md
  - docs/validation/DEMO-FTMO-SCRIPT.md
  - docs/validation/DEMO-EJECUCION-1.md
  - docs/validation/CORRIDA-CONSTRUCCION.md
  - docs/validation/SESGO-H4-COLOR.md
  - docs/validation/VIABILIDAD-COMISION.md
  - docs/validation/FTMO-P-D1.md
  - docs/validation/anexos/CORRIDA-CONSTRUCCION/
  - docs/validation/anexos/SESGO-H4-COLOR/
  - docs/validation/anexos/ENTRADA-JULIO/
  - docs/adr/0000-template.md
  - docs/adr/0026-la-prop-firm-es-ftmo-2-step-swing.md
  - docs/adr/0031-el-freno-de-la-firma-dispara-antes-del-limite.md
  - docs/adr/0050-el-simulador-la-capa-de-cuenta.md
  - docs/adr/0056-la-entrada-con-la-ruptura.md
  - docs/adr/0070-umbral-de-construccion-para-medir-mayo.md
  - docs/adr/0071-lo-que-fija-la-ejecucion-1-de-la-demo-de-ftmo.md
  - src/botsito/domain/
  - src/botsito/cli.py
  - src/botsito/engine/freno.py
  - src/botsito/engine/motor.py
  - src/botsito/engine/primitivas.py
  - src/botsito/engine/diagnostico.py
  - src/botsito/engine/visor.py
  - src/botsito/cases/
  - tools/mql5/
  - knowledge/evidence/
  - knowledge/feedback/
  - knowledge/cases/
  - knowledge/corpus/
  - knowledge/cuentas/cierres/
  - knowledge/simulador/
  - config/
  - data/manifests/
  - tests/golden/
comprobaciones:
  - uv run python scripts/contrato_rama.py
  - uv run pytest tests/unit/test_broker.py tests/unit/test_broker_ordenes_stop.py tests/unit/test_be_al_tick.py tests/unit/test_peticiones.py tests/unit/test_perfil_cuenta.py tests/regression/test_cuenta_7_de_agosto.py -q
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - uv run botsito spec docs --escribir
  - make check > make-check.log 2>&1
