# El contrato de esta rama (docs/runbooks/CONTRATO-DE-RAMA.md). Lo comprueba `make check`
# (scripts/contrato_rama.py); las comprobaciones las ejecuta el revisor. Sale de la rama antes del
# merge (RITUAL.md).
rama: trabajo/guardias-claude
riesgo: medio  # toca make check y lo que Claude Code deja hacer; no toca motor, spec ni knowledge
artefacto: docs/validation/GUARDIAS-CLAUDE.md
rutas_permitidas:
  - .claude/
  - .gitignore
  - CLAUDE.md
  - Makefile
  - PROJECT_STATE.md
  - docs/HANDOFF.md
  - docs/encargos/
  - docs/runbooks/CONTRATO-DE-RAMA.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - docs/runbooks/README.md
  - docs/runbooks/RITUAL.md
  - docs/validation/GUARDIAS-CLAUDE.md
  - scripts/contrato_rama.py
  - tests/unit/test_guardia_claude.py
  - tests/unit/test_contrato_rama.py
  - tests/unit/test_revisor.py
rutas_protegidas:
  - src/
  - knowledge/
  - config/
  - data/
  - mql5/
  - tools/
  - scripts/git-hooks/
  - docs/adr/
  - docs/spec/
comprobaciones:
  - uv run pytest tests/unit/test_guardia_claude.py tests/unit/test_contrato_rama.py tests/unit/test_revisor.py -q
  - uv run python scripts/contrato_rama.py
  - make check > make-check.log 2>&1
