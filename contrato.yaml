rama: trabajo/corrida-construccion
riesgo: alto  # corre el arnes sobre toda la construccion (lee velas M1 de meses con dias reservados para calentar, declarado el mismo dia) y anade al informe del arnes la tabla por operacion; ninguna decision del motor, ningun parametro, ninguna opcion nueva
artefacto: docs/validation/CORRIDA-CONSTRUCCION.md
tramo: R3
rutas_permitidas:
  - docs/validation/CORRIDA-CONSTRUCCION.md
  - docs/validation/anexos/CORRIDA-CONSTRUCCION/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - docs/runbooks/ARNES-MOTOR.md
  - src/botsito/engine/arnes.py
  - tests/unit/test_arnes_motor.py
  - tests/unit/test_diferencias_por_operacion.py
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - Makefile
  - .claude/
  - src/botsito/cli.py
  - src/botsito/engine/broker.py
  - src/botsito/engine/cuenta.py
  - src/botsito/engine/freno.py
  - src/botsito/engine/motor.py
  - src/botsito/engine/cableado.py
  - src/botsito/engine/diagnostico.py
  - src/botsito/engine/simulacion.py
  - src/botsito/domain/
  - src/botsito/cases/
  - knowledge/
  - config/
  - data/manifests/
  - docs/plan/
  - docs/adr/
  - tests/unit/test_umbral_mayo.py
  - tests/unit/test_cableado.py
  - tests/unit/test_huecos_motor.py
  - tests/golden/
comprobaciones:
  - uv run python scripts/contrato_rama.py
  - uv run pytest tests/unit/test_arnes_motor.py tests/unit/test_diferencias_por_operacion.py -q
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - make check > make-check.log 2>&1
