rama: trabajo/metodo-fidelidad-rentabilidad
riesgo: medio  # rama de metodo: ADR-0092 (enmienda ADR-0043 y ADR-0070), criterio puro fuera del motor en cases/ y guiones de medida; el motor no cambia (en engine/ solo lo que autorice la respuesta del consultor a la PARADA, y entonces se amplia en un commit)
