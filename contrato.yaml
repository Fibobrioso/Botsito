rama: trabajo/guardia-enlaces
riesgo: alto  # como manda el encargo: toca la guardia de Claude Code (.claude/hooks/guardia.py), la defensa en profundidad del material protegido
artefacto: docs/validation/GUARDIA-ENLACES.md
tramo: "Carril: guardias y deuda"
rutas_permitidas:
  - docs/validation/GUARDIA-ENLACES.md
  - docs/validation/anexos/GUARDIA-ENLACES/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
  - CLAUDE.md
  - .claude/hooks/guardia.py
  # tests/unit/: solo los ficheros de la guardia y el nuevo (encargo, «Contrato»)
  - tests/unit/test_guardia_enlaces.py
  - tests/unit/test_guardia_claude.py
  - tests/unit/test_guardia_alias.py
  - tests/unit/test_guardia_ci.py
  - tests/unit/test_guardia_falsos_positivos.py
  - tests/unit/test_guardia_ffmpeg.py
  - tests/unit/test_guardia_g1.py
# Lista blanca: lo demas de tests/, docs/ y .claude/ queda fuera por no estar en la lista.
# Lo que el encargo dice que no cambia («QUÉ NO CAMBIA»), ademas, protegido (manda sobre lo permitido).
rutas_protegidas:
  - src/
  - knowledge/
  - config/
  - scripts/
  - mql5/
  - Makefile
  - docs/adr/
  - docs/plan/HOJA-DE-RUTA.md
  - data/manifests/
  - tests/contract/
  - tests/conftest.py
comprobaciones:
  - uv run botsito knowledge validate (con el log fuera del repo, en la carpeta de trabajo de la sesion)
  - uv run pytest tests/unit/test_guardia_enlaces.py tests/unit/test_guardia_claude.py tests/unit/test_guardia_alias.py tests/unit/test_guardia_ci.py tests/unit/test_guardia_falsos_positivos.py tests/unit/test_guardia_ffmpeg.py tests/unit/test_guardia_g1.py -q
  - make-check.log, lineas CONTRATO, G2 y SELLO
  - make check > make-check.log 2>&1
