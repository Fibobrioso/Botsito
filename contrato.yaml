rama: trabajo/entorno-code
riesgo: medio  # cambia herramientas (hooks de Claude Code, skills, agentes, scripts y Makefile) y tests; no la spec, el motor ni ningun dato
artefacto: docs/validation/ENTORNO-CODE.md
tramo: R0
rutas_permitidas:
  - docs/validation/ENTORNO-CODE.md
  - .claude/skills/fase-cero/
  - .claude/skills/activar-sesion/
  - .claude/skills/comparar-con-main/
  - .claude/skills/entregar-rama/
  - .claude/skills/retomar-rama/
  - .claude/skills/abrir-rama/
  - .claude/agents/
  - .claude/hooks/
  - .claude/settings.json
  - scripts/pico_memoria.py
  - Makefile
  - pyproject.toml
  - uv.lock
  - tests/unit/
  - tests/conftest.py
  - CLAUDE.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - src/
  - knowledge/
  - config/
  - data/manifests/
  - .claude/skills/cerrar-rama/
  - .claude/skills/ingerir-sesion/
comprobaciones:
  - uv run pytest tests/unit -q -k "skills or estado_sesion or solo_lectura or revisor or pico"
  - uv run python scripts/contrato_rama.py
  - make check > make-check.log 2>&1
