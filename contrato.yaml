  - docs/runbooks/SESION-DE-PREGUNTAS.md
  - scripts/graficos_sesion.py
  - tests/unit/test_graficos_sesion.py
  - scripts/transcribir_sesion.py
  - tests/unit/test_transcribir_sesion.py
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
rutas_protegidas:
  - src/
  - knowledge/
  - config/
  - data/manifests/
  - .claude/
