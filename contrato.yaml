rama: trabajo/sesion-04
riesgo: medio  # anade al corpus (v10, transcripcion, fotogramas, evidencia) y cambia la hoja de codigos de scripts/transcribir_sesion.py con su test; no toca spec, feedback, motor ni material reservado
artefacto: docs/validation/SESION-04-EXTRACCION.md
rutas_permitidas:
  - docs/validation/SESION-04-EXTRACCION.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/sesion-4/HOJA-USADA.md
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - knowledge/corpus/fuentes.yaml
  - knowledge/corpus/manifest.yaml
  - knowledge/corpus/tramos_no_citables.yaml
  - knowledge/corpus/transcripciones/tr-v10-*.yaml
  - knowledge/corpus/fotogramas/fr-v10-*.yaml
  - knowledge/evidence/v10/
  - src/botsito/corpus/cuarentena.py
  - scripts/transcribir_sesion.py
  - tests/unit/test_inventario.py
  - tests/unit/test_cuarentena.py
  - tests/unit/test_transcribir_sesion*.py
  - .claude/hooks/ficheros_con_ocultos.txt
rutas_protegidas:
  - knowledge/spec/
  - knowledge/feedback/
  - knowledge/cases/
  - knowledge/corpus/libros.yaml
  - src/botsito/engine/
  - src/botsito/domain/
  - docs/sesion-4/PREGUNTAS.md
comprobaciones:
  - uv run botsito corpus check --hashes
  - uv run botsito corpus transcript check
  - uv run botsito corpus frames check
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - git diff --name-status main...HEAD -- knowledge/evidence knowledge/corpus/transcripciones knowledge/corpus/fotogramas data/manifests
  - make check > make-check.log 2>&1
