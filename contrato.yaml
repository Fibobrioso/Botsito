rama: trabajo/respaldo-a11
riesgo: medio  # cambia el estado de una ambiguedad cerrada, una guardia de validacion y la definicion del revisor; ningun valor, ni motor, ni evidencia
artefacto: docs/validation/RESPALDO-A11.md
# La fase 0 solo permitia el informe y los ficheros de apertura. Tras la respuesta del consultor
# (RESPALDO-A11.md §6.1, 2026-10-07) entran las rutas de la fase 1: A-11, G1 y sus tests, el kit,
# el revisor y su test.
rutas_permitidas:
  - docs/validation/RESPALDO-A11.md
  - docs/validation/anexos/RESPALDO-A11/
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - knowledge/spec/ambiguedades.yaml
  - docs/spec/
  - src/botsito/validation/citas_supersedidas.py
  - tests/unit/test_citas_supersedidas.py
  - tests/unit/test_kit.py
  - .claude/agents/revisor.md
  - tests/unit/test_revisor.py
rutas_protegidas:
  # lo que el encargo dice que no cambia, y lo que esta rama no lee ni toca
  - src/botsito/engine/
  - knowledge/spec/parametros.yaml
  - knowledge/spec/strategy_spec.yaml
  - knowledge/evidence/
  - knowledge/feedback/
  - knowledge/cases/
  - knowledge/corpus/
  - data/
comprobaciones:
  - uv run python docs/validation/anexos/RESPALDO-A11/tramos_del_cierre.py
  - uv run python docs/validation/anexos/RESPALDO-A11/rotura_g1.py
  - uv run pytest tests/unit/test_citas_supersedidas.py tests/unit/test_kit.py tests/unit/test_revisor.py -q
  - uv run botsito knowledge validate > knowledge-validate.log 2>&1
  - uv run botsito state check
  - make check > make-check.log 2>&1
