rama: trabajo/recorrida-construccion
riesgo: alto  # no cambia codigo, pero corre el arnes sobre toda la construccion (calienta con el M1 de meses con dias reservados, declarado) y su salida pasa a ser la linea base vigente; cada cifra que escribe se compara a mano
artefacto: docs/validation/RECORRIDA-CONSTRUCCION.md
tramo: R4
rutas_permitidas:
  - docs/validation/RECORRIDA-CONSTRUCCION.md
  - docs/validation/anexos/RECORRIDA-CONSTRUCCION/
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/runbooks/ACTIVAR-A35-A44.md  # ampliado el 2026-10-27 (respuesta del consultor a la PARADA, punto 4): solo la NOTA al principio de §5
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - src/
  - tests/
  - knowledge/
  - Makefile
  - .claude/
  - config/
  - data/manifests/
  - scripts/
  - pyproject.toml
  - docs/plan/
  - docs/adr/
  - docs/runbooks/ERRORES-RECURRENTES.md
  - docs/runbooks/RITUAL.md
  - docs/runbooks/VISOR-DIAS.md
  - docs/runbooks/ARNES-MOTOR.md
  - docs/validation/CABLEADO-SIMULADOR-LINEA-BASE.txt
  - docs/validation/anexos/CORRIDA-CONSTRUCCION/
  - docs/validation/anexos/PUNTO-USADO/
  - docs/validation/anexos/VISOR-CONSTRUCCION/
comprobaciones:
  - git diff main --stat -- src/ tests/ knowledge/ Makefile .claude/
  - uv run python scripts/contrato_rama.py
  - make check > make-check.log 2>&1
