rama: trabajo/sesion-07
riesgo: medio  # anade al corpus (v18 y v19; transcripciones, fotogramas, tramos, evidencia) y da de alta los videos en la cuarentena con sus tests; no toca spec, feedback, casos, motor, cifras, hoja de ruta, PREGUNTAS-7B.md ni scripts/transcribir_sesion.py
artefacto: docs/validation/SESION-07-EXTRACCION.md
tramo: R4
rutas_permitidas:
  - docs/validation/SESION-07-EXTRACCION.md
  - docs/validation/HOLDOUT-EXPOSICIONES.md
  - docs/sesion-7/HOJA-USADA-7A.md
  - docs/sesion-7/PREGUNTAS-7A.md
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - knowledge/corpus/fuentes.yaml
  - knowledge/corpus/manifest.yaml
  - knowledge/corpus/tramos_no_citables.yaml
  - knowledge/corpus/transcripciones/tr-v18-*.yaml
  - knowledge/corpus/transcripciones/tr-v19-*.yaml
  - knowledge/corpus/fotogramas/fr-v18-*.yaml
  - knowledge/corpus/fotogramas/fr-v19-*.yaml
  - knowledge/evidence/v18/
  - knowledge/evidence/v19/
  - src/botsito/corpus/cuarentena.py
  - tests/unit/test_inventario.py
  - tests/unit/test_cuarentena.py
  - tests/unit/test_guardia_claude.py
  - .claude/hooks/ficheros_con_ocultos.txt
rutas_protegidas:
  - scripts/transcribir_sesion.py
  - scripts/barrido_dias.py
  - docs/sesion-7/PREGUNTAS-7B.md
  - knowledge/spec/
  - knowledge/feedback/
  - knowledge/cases/
  - knowledge/corpus/libros.yaml
  - src/botsito/engine/
  - src/botsito/domain/
  - docs/adr/
  - docs/plan/HOJA-DE-RUTA.md
comprobaciones:
  - uv run botsito corpus check --hashes
  - uv run botsito corpus transcript check
  - uv run botsito corpus frames check
  - uv run botsito evidence contradictions
  - uv run botsito knowledge validate (log en la carpeta de trabajo de la sesion, fuera del repo)
  - git diff --name-status main...HEAD -- knowledge/evidence knowledge/corpus/transcripciones knowledge/corpus/fotogramas data/manifests
  - uv run pytest tests/unit/test_en_parte_no_se_cierra.py tests/unit/test_hoja_de_ruta.py
  - wc -c PROJECT_STATE.md
  - make check > make-check.log 2>&1
