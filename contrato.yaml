rama: trabajo/filtradas-con-tramos
riesgo: medio  # cambia el guion de las filtradas de sesion y anade tests; no cambia la spec, el motor, la regla de meses ni el knowledge
artefacto: docs/validation/FILTRADAS-CON-TRAMOS.md
rutas_permitidas:
  - docs/validation/FILTRADAS-CON-TRAMOS.md
  - docs/validation/anexos/FILTRADAS-CON-TRAMOS/
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
  - docs/runbooks/ERRORES-RECURRENTES.md
  - scripts/transcribir_sesion.py
  - tests/unit/test_filtradas_con_tramos.py
rutas_protegidas:
  - .claude/
  - src/
  - knowledge/
  - tests/unit/test_transcribir_sesion.py
  - tests/unit/test_cuarentena.py
  - tests/unit/test_cuarentena_por_condicion.py
  - tests/unit/test_tramos_de_sesion.py
comprobaciones:
  - uv run pytest tests/unit/test_filtradas_con_tramos.py tests/unit/test_transcribir_sesion.py tests/unit/test_cuarentena.py -q
  - make check > make-check.log 2>&1
