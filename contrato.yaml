rama: trabajo/margen-pendiente
riesgo: alto  # un script (MedirDemoFTMO 1.2) que envia ordenes a la cuenta de prueba de FTMO, con volumenes de hasta decenas de lotes en el paso 8; no cambia src/, mql5/, knowledge/, ningun ADR ni ninguna cifra
artefacto: docs/validation/MARGEN-PENDIENTE.md
tramo: "Carril: lo de Aleks"
rutas_permitidas:
  - tools/mql5/MedirDemoFTMO.mq5
  - tools/mql5/README.md  # solo si nombra la version o lo que hace el script
  - scripts/README.md  # solo si nombra la version o lo que hace el script
  - scripts/leer_demo_ftmo.py
  - tests/unit/test_leer_demo_ftmo.py
  - tests/contract/test_medir_demo_ftmo.py  # el test estatico nuevo del script
  - docs/runbooks/DEMO-FTMO.md
  - docs/validation/MARGEN-PENDIENTE.md
  - docs/validation/anexos/MARGEN-PENDIENTE/**
  - docs/validation/HOLDOUT-EXPOSICIONES.md  # solo si hay exposicion
  - docs/state/README.md  # solo la condicion (e)
  - docs/plan/HOJA-DE-RUTA.md  # solo quitar las referencias HER:n de los heredados que salgan
  - docs/encargos/
  - PROJECT_STATE.md
  - docs/state/HISTORIA.md
rutas_protegidas:
  - src/
  - mql5/
  - knowledge/
  - docs/adr/
  - data/
  - config/
  - .claude/
  - Makefile
comprobaciones:
  - uv run pytest tests/unit/test_leer_demo_ftmo.py tests/contract/test_medir_demo_ftmo.py tests/contract/test_capa_mt5.py -q
  - make check > make-check.log 2>&1
