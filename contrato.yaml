rama: trabajo/ea-conexion
riesgo: medio  # codigo nuevo de la capa de MT5 que no decide operaciones (EA, script de pruebas, include), el lector-validador del journal en mql5bridge, sus tests y su golden; no cambia motor, spec, parametros, ambiguedades, cases ni holdout, y no lee velas, ticks ni material del trader
artefacto: docs/validation/EA-CONEXION.md
tramo: R6a
rutas_permitidas:
  - docs/validation/EA-CONEXION.md
  - docs/validation/anexos/EA-CONEXION/
  - mql5/
  - src/botsito/mql5bridge/
  - tests/
  - docs/runbooks/
  - docs/encargos/
  - docs/state/HISTORIA.md
  - PROJECT_STATE.md
rutas_protegidas:
  - Makefile
  - .gitattributes
  - .claude/
  - .github/
  - tools/mql5/
  - scripts/leer_demo_ftmo.py
  - data/manifests/
  - knowledge/
  - src/botsito/engine/
  - src/botsito/domain/
  - src/botsito/spec/
  - src/botsito/cases/
  - docs/plan/
  - docs/adr/
comprobaciones:
  - uv run python scripts/contrato_rama.py
  - uv run pytest tests/unit tests/contract -q -k "mql5 or journal or ea_conexion"
  - make check > make-check.log 2>&1
