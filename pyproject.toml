[project]
name = "botsito"
version = "0.1.0"
description = "Bot fiel a la estrategia de un trader concreto, verificable caso a caso, ejecutable en MetaTrader 5."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
botsito = "botsito.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botsito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
  "contract: contratos estructurales (importaciones, arbol, documentos)",
  "golden: casos de la biblioteca (desde F14)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true  # solo las reglas preview nombradas en select (PLW1514)
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PLW1514"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["botsito", "tests"]

# Contratos de importacion: se hacen cumplir con `lint-imports` (make check) y con
# tests/contract/test_import_contracts.py (AST). Ver ADR-0001.
[tool.importlinter]
root_package = "botsito"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain es puro: no importa capas de IO ni el mundo exterior"
type = "forbidden"
source_modules = ["botsito.domain"]
forbidden_modules = [
  "botsito.engine", "botsito.data", "botsito.mql5bridge", "botsito.corpus",
  "botsito.viewer", "botsito.validation", "botsito.cli", "botsito.config",
  "MetaTrader5", "pandas", "polars", "numpy", "requests", "asyncio", "threading",
  "datetime", "time", "random", "os", "pathlib", "io",
]

[[tool.importlinter.contracts]]
name = "spec no depende del motor ni de los datos"
type = "forbidden"
source_modules = ["botsito.spec"]
forbidden_modules = ["botsito.engine", "botsito.data", "botsito.mql5bridge", "MetaTrader5", "pandas", "polars"]

[[tool.importlinter.contracts]]
name = "capas: cli -> validacion/motor/visor/puente -> conocimiento/datos -> domain"
type = "layers"
layers = [
  "botsito.cli",
  "botsito.validation | botsito.engine | botsito.viewer | botsito.mql5bridge",
  "botsito.cases | botsito.spec | botsito.feedback | botsito.evidence | botsito.corpus | botsito.data | botsito.config",
  "botsito.domain",
]
