# Instalar con: uv run pre-commit install (pre-commit se anade al grupo dev cuando se use).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: import-contracts
        name: contratos de importacion
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: knowledge-validate
        name: validar knowledge/ (no-op hasta F06)
        entry: uv run botsito knowledge validate
        language: system
        pass_filenames: false
